<style>
/* =====================================================================
   TEMPORA — styles. One accent (--era) is swapped by the current era;
   everything else is a quiet archive-paper / ink system.
   ===================================================================== */
:root {
  --bg: #E9ECE6; --surface: #F7F8F4; --surface-2: #E0E4DC; --sunk: #D8DDD3;
  --ink: #18202E; --ink-2: #485163; --ink-3: #7A8395; --line: #CBD1C6;
  --good: #2C8653; --warn: #B7791F; --bad: #B8392F;
  --era: var(--era-l, #3446A0); --on-era: #FFFFFF;
  --era-soft: color-mix(in srgb, var(--era) 13%, var(--surface));
  --era-line: color-mix(in srgb, var(--era) 35%, var(--line));
  --shadow: 0 1px 2px rgb(24 32 46 / .06), 0 10px 30px rgb(24 32 46 / .10);
  --f-display: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --f-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1117; --surface: #161B23; --surface-2: #1E2530; --sunk: #0A0D12;
    --ink: #E6E8EC; --ink-2: #A3ABB9; --ink-3: #6E7788; --line: #2A3240;
    --good: #5CC08A; --warn: #E0A949; --bad: #F07468;
    --era: var(--era-d, #8FA2F2); --on-era: #0E1117;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1117; --surface: #161B23; --surface-2: #1E2530; --sunk: #0A0D12;
  --ink: #E6E8EC; --ink-2: #A3ABB9; --ink-3: #6E7788; --line: #2A3240;
  --good: #5CC08A; --warn: #E0A949; --bad: #F07468;
  --era: var(--era-d, #8FA2F2); --on-era: #0E1117;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased;
  padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--era); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .005em; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.eyebrow { font: 600 11px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
[hidden] { display: none !important; }

#app { max-width: 1120px; margin: 0 auto; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 12px; padding-block: 12px 8px;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 26px; line-height: 1; }
.brand svg { flex: none; color: var(--era); }
.when { text-align: right; line-height: 1.15; }
.when .yr { font: 500 18px/1 var(--f-mono); }
.when .er { font-size: 12px; color: var(--era); font-weight: 600; letter-spacing: .04em; }
.iconbtn {
  width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.iconbtn:hover { color: var(--ink); border-color: var(--era-line); }
.iconbtn[aria-pressed="true"] { background: var(--era); color: var(--on-era); border-color: var(--era); }
.iconbtn svg { width: 18px; height: 18px; }

/* ---------- time ribbon: the signature ---------- */
.ribbon { position: relative; margin-block: 2px 14px; }
.ribbon .segs { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; height: 8px; }
.ribbon .seg { border-radius: 2px; background: var(--c); opacity: .28; }
.ribbon .seg.past { opacity: .55; }
.ribbon .seg.now { opacity: 1; }
.ribbon .mark {
  position: absolute; top: -4px; width: 2px; height: 16px; background: var(--ink); border-radius: 1px;
  transform: translateX(-1px); transition: left .5s ease;
}
.ribbon .labels { position: relative; height: 11px; margin-top: 6px; font: 11px/1 var(--f-mono); color: var(--ink-3); }
.ribbon .labels span { position: absolute; top: 0; white-space: nowrap; }
@media (max-width: 520px) { .ribbon .labels span:nth-child(2), .ribbon .labels span:nth-child(4) { display: none; } }

/* ---------- layout ---------- */
.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.layout > * { min-width: 0; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 330px minmax(0, 1fr); align-items: start; }
  .side { position: sticky; top: 84px; }
}

/* ---------- character card ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.who { display: flex; gap: 14px; align-items: center; }
.who .meta { min-width: 0; }
.who h2 { font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
.who .sub { color: var(--ink-2); font-size: 13px; margin-top: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 500;
}
.tag.era { background: var(--era-soft); color: var(--era); }
.tag.bad { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad); }
.tag.good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); }
.av {
  --ring: var(--era); flex: none; width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center; background: color-mix(in srgb, var(--ring) 16%, var(--surface));
  box-shadow: inset 0 0 0 2px var(--ring); color: var(--ink); font: 20px/1 var(--f-display);
}
.av.sm { width: 38px; height: 38px; font-size: 15px; }
.av.lg { width: 64px; height: 64px; font-size: 26px; }
.av.dead { filter: grayscale(1); opacity: .6; }

.stats { display: grid; gap: 9px; margin-top: 16px; }
.stat { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; }
.stat .k { color: var(--ink-2); }
.stat .v { font: 500 12px var(--f-mono); text-align: right; }
.bar { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--good); transition: width .45s ease; }
.bar > i.mid { background: var(--warn); }
.bar > i.low { background: var(--bad); }
.bar.era > i { background: var(--era); }
.wealth { display: flex; justify-content: space-between; align-items: baseline; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.wealth .v { font: 500 20px var(--f-mono); }

/* ---------- tabs ---------- */
.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; background: none; border: 0; padding: 10px 12px; color: var(--ink-2); font-weight: 600; font-size: 14px;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--era); }

/* ---------- generic blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel + .panel, .stack > * + * { margin-top: 14px; }
.panel h3 { font-size: 20px; margin-bottom: 4px; }
.panel .lede { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 18px 2px 8px; }
.sec-h:first-child { margin-top: 2px; }
.sec-h h3 { font-size: 19px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; color: var(--ink);
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { border-color: var(--era-line); background: var(--era-soft); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; background: var(--surface); border-color: var(--line); }
.btn.era { background: var(--era); color: var(--on-era); border-color: var(--era); }
.btn.era:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

/* list rows */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--line); color: inherit;
}
.row:first-child { border-top: 0; }
button.row:hover:not(:disabled) { background: var(--era-soft); }
button.row:disabled { cursor: default; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 600; font-size: 14.5px; }
.row .s { color: var(--ink-2); font-size: 13px; margin-top: 1px; }
.row .end { text-align: right; flex: none; font-size: 13px; color: var(--ink-2); }
.row.off { opacity: .5; }
.row .mini { width: 70px; margin-top: 6px; }
.why { color: var(--ink-3); font-size: 12px; }

/* ---------- life log ---------- */
.logyr { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.logyr:first-child { border-top: 0; padding-top: 2px; }
.logyr .d { font: 500 13px/1.3 var(--f-mono); color: var(--ink-2); }
.logyr .d b { display: block; font-size: 15px; color: var(--ink); font-weight: 500; }
.logyr.now .d b { color: var(--era); }
.logyr ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.logyr li { position: relative; padding-left: 14px; font-size: 14.5px; }
.logyr li::before { content: ''; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.logyr li.good::before { background: var(--good); }
.logyr li.bad::before, .logyr li.death::before { background: var(--bad); }
.logyr li.world { color: var(--ink); font-style: italic; }
.logyr li.world::before { border-radius: 1px; background: var(--era); transform: rotate(45deg); }
.logyr li.era { font-family: var(--f-display); font-size: 17px; color: var(--era); }
.logyr li.era::before { background: var(--era); }
.logyr li.ach { font-weight: 600; }
.logyr li.ach::before { background: var(--warn); border-radius: 1px; }
.logyr li.love::before { background: #C2477A; }
.logyr li.family::before, .logyr li.birth::before { background: var(--era); }
.logyr li.death { color: var(--ink-2); }
.logyr li.switch { font-family: var(--f-display); font-size: 16px; }

/* ---------- family tree ---------- */
.treebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.treebar select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
.treewrap {
  position: relative; height: min(68vh, 680px); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  background:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 10%, transparent) 1px, transparent 0) 0 0 / 22px 22px,
    var(--surface);
  touch-action: none; cursor: grab;
}
.treewrap.drag { cursor: grabbing; }
.treewrap svg { width: 100%; height: 100%; display: block; user-select: none; }
.tn rect.box { fill: var(--surface); stroke: var(--line); }
.tn:hover rect.box { stroke: var(--era); }
.tn.me rect.box { stroke: var(--era); stroke-width: 2.5; }
.tn.dead rect.box { fill: var(--surface-2); }
.tn text { fill: var(--ink); font-family: var(--f-body); }
.tn .nm { font-size: 13px; font-weight: 600; }
.tn .yr { font-size: 11px; fill: var(--ink-2); font-family: var(--f-mono); }
.tn .crown { font-size: 12px; fill: var(--era); }
.tlink { fill: none; stroke: var(--ink-3); stroke-width: 1.3; }
.tmar { fill: none; stroke: var(--ink-3); stroke-width: 1.3; stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---------- world ---------- */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.fact { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.fact .v { font: 500 17px var(--f-mono); margin-top: 2px; }
.laws { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.laws li + li { margin-top: 4px; }
.chron { display: grid; gap: 0; }
.chron .c { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.chron .c:first-child { border-top: 0; }
.chron .c .y { font: 500 13px var(--f-mono); color: var(--ink-2); }
.chron .c.era .t { font-family: var(--f-display); color: var(--era); font-size: 16px; }
.proj { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }

/* god mode */
.god { border-color: var(--era-line); background: var(--era-soft); }
.god .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; margin-top: 10px; }
.god label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.god input[type="range"] { width: 100%; accent-color: var(--era); }
.god select, .god input[type="number"], .field input, .field select, textarea {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); width: 100%; min-width: 0;
}

/* ---------- age bar ---------- */
.agebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, color-mix(in srgb, var(--bg) 0%, transparent));
}
.agebar .in { max-width: 1120px; margin: 0 auto; display: flex; gap: 10px; }
.agebtn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px;
  height: 56px; border: 0; border-radius: 14px; background: var(--era); color: var(--on-era);
  font: 400 24px/1 var(--f-display); box-shadow: var(--shadow); transition: transform .08s, filter .15s;
}
.agebtn:hover { filter: brightness(1.06); }
.agebtn:active { transform: scale(.985); }
.agebtn:disabled { filter: grayscale(.8); opacity: .6; cursor: not-allowed; }
.agebtn small { font: 500 13px var(--f-mono); opacity: .85; }
@media (min-width: 900px) { .agebar .in { padding-left: 346px; } }

/* ---------- sheets / modals ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 50; background: rgb(8 10 14 / .45); display: flex; align-items: flex-end; justify-content: center;
  padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: fade .15s ease;
}
.sheet {
  width: 100%; max-width: 560px; max-height: calc(100dvh - 40px); overflow: auto; background: var(--surface);
  border-radius: 16px; box-shadow: var(--shadow); padding: 20px; animation: rise .2s ease;
}
@media (min-width: 700px) { .scrim { align-items: center; } }
.sheet h2 { font-size: 26px; line-height: 1.15; }
.sheet .body { margin: 10px 0 16px; color: var(--ink); font-size: 15.5px; }
.sheet .acts { display: grid; gap: 8px; }
.sheet .x { float: right; margin: -6px -6px 0 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; margin: 12px 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--f-mono); font-size: 13.5px; }
.result { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--era-soft); font-size: 14.5px; }

/* death */
.epitaph { text-align: center; padding: 6px 0 4px; }
.epitaph .dag { font: 40px/1 var(--f-display); color: var(--ink-3); }
.epitaph h2 { font-size: 30px; margin-top: 4px; }
.epitaph .dates { font: 500 15px var(--f-mono); color: var(--ink-2); margin-top: 4px; }
.epitaph .cause { font-style: italic; color: var(--ink-2); margin-top: 6px; }

/* ---------- start screen ---------- */
.start { max-width: 720px; margin: 8px auto 0; }
.start .hero { padding: 18px 0 8px; }
.start .hero h2 { font-size: clamp(34px, 7vw, 54px); line-height: 1.02; }
.start .hero p { color: var(--ink-2); max-width: 56ch; font-size: 16px; }
.eras { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 14px 0; }
.eracard {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px;
  border-top: 4px solid var(--c);
}
.eracard .n { font: 18px/1.1 var(--f-display); }
.eracard .r { font: 12px var(--f-mono); color: var(--ink-2); margin-top: 4px; }
.eracard[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 14%, var(--surface)); border-color: var(--c); }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.field { display: grid; gap: 5px; font-size: 13px; color: var(--ink-2); }
.field input[type="range"] { accent-color: var(--era); }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(8px);
  z-index: 60; max-width: min(520px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 10px;
  background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.logyr li.quiet { color: var(--ink-2); }
@media (max-width: 400px) {
  .top { gap: 8px; }
  .brand h1 { font-size: 21px; }
  .iconbtn { width: 34px; height: 34px; }
}

/* =====================================================================
   Expansion components: portraits, stat sheets, sub-tabs, modes,
   places, household, community.
   ===================================================================== */
.av.pt { overflow: hidden; background: var(--surface); box-shadow: none; }
.av.pt svg { width: 100%; height: 100%; display: block; }
.av.petav { font-family: var(--f-display); }
.stat.srow { width: 100%; background: none; border: 0; padding: 2px 0; text-align: left; color: inherit; font: inherit; font-size: 13px; border-radius: 6px; cursor: pointer; }
.stat.srow:hover .k { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.moreStats { display: grid; gap: 9px; }
.linkbtn { background: none; border: 0; padding: 2px 0; color: var(--era); font-size: 12.5px; font-weight: 600; text-align: left; cursor: pointer; }
.tag.cls { border: 0; cursor: pointer; background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--ink); }
.sheet .body { white-space: pre-line; }
.sheet .body.chapter { font-family: var(--f-display); font-size: 19px; line-height: 1.45; }

/* stat card, after the classic life-sim stat popup */
.statcard { border-radius: 14px; padding: 16px; background: color-mix(in srgb, var(--sc) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--sc) 35%, var(--line)); }
.statcard .stitle { font: 700 20px/1.2 var(--f-body); color: var(--sc); letter-spacing: .01em; }
.statcard .sdesc { font-size: 16px; margin: 8px 0 12px; color: var(--ink); }
.statcard .sbar { position: relative; height: 26px; border-radius: 13px; background: color-mix(in srgb, var(--sc) 18%, var(--surface-2)); overflow: hidden; }
.statcard .sbar i { position: absolute; inset: 0 auto 0 0; background: var(--sc); border-radius: 13px; }
.statcard .sbar span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 14px var(--f-mono); color: var(--ink); }
.tierlist, .ladder { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.tierlist li, .ladder li { padding: 6px 10px; border-radius: 8px; }
.tierlist li.on, .ladder li.on { background: var(--era-soft); }
.tierlist .mono, .ladder .mono { display: inline-block; width: 28px; color: var(--ink-3); }

/* sub-tabs */
.subtabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin: 0 0 12px; border-radius: 10px; background: var(--surface-2); }
.subtabs button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.subtabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.subtabs.small button { padding: 4px 10px; font-size: 12px; }

/* story view */
.story section + section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.story h3 { font-size: 21px; }
.story p { max-width: 68ch; font-size: 15.5px; line-height: 1.65; margin: 8px 0 0; }
.story .intro { font-family: var(--f-display); font-size: 17px; color: var(--ink-2); }
.logyr li.chapter { font-family: var(--f-display); font-size: 16px; color: var(--era); }
.logyr li.chapter::before { background: var(--era); border-radius: 1px; }
.logyr li.fused { color: var(--ink-2); font-style: italic; }

/* start screen modes */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin: 8px 0; }
.modecard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; }
.modecard .n { font: 19px/1.1 var(--f-display); }
.modecard .d { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.modecard[aria-pressed="true"] { border-color: var(--era); background: var(--era-soft); }
.modes.compact .modecard .d { display: none; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2px 12px; }

/* nations */
.flagchip { flex: none; width: 38px; height: 26px; border-radius: 5px; display: grid; place-items: center; font: 600 11px var(--f-mono); background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.fact .v.sm { font-size: 14px; font-family: var(--f-body); font-weight: 600; }
.gtab { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
.gtab th, .gtab td { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); }
.gtab th { font-weight: 600; color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }

/* places */
.placegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.placegrid .panel + .panel { margin-top: 0; }
.place .lede { margin: 4px 0 8px; }
.faces { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.faces.big { gap: 8px; margin-top: 6px; }
.face { display: grid; justify-items: center; gap: 2px; width: 72px; padding: 6px 2px; border: 1px solid transparent; border-radius: 10px; background: none; }
.face span { font-size: 12px; font-weight: 600; max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.face small { font-size: 10.5px; color: var(--ink-3); }
.face.on { border-color: var(--era); background: var(--era-soft); }
.scenehead { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.scenehead h2 { font: 500 30px var(--f-mono); }
.hours { display: flex; gap: 3px; margin-top: 8px; }
.hours i { flex: 1; height: 6px; border-radius: 3px; background: var(--era); }
.hours i.gone { background: var(--surface-2); }
.panel.pick { margin-top: 10px; padding: 12px; }
.panel.pick .t { font-weight: 600; font-size: 14px; }
.feed { margin-top: 12px; display: grid; gap: 4px; }
.feed p { margin: 0; font-size: 14px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.feed p:first-child { background: var(--era-soft); }

/* household */
.hhgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 14px; }
.hhgrid .panel + .panel { margin-top: 0; }
.member { display: flex; gap: 12px; text-align: left; align-items: start; width: 100%; color: inherit; font: inherit; }
.member:hover { border-color: var(--era-line); }
.member .main { flex: 1; min-width: 0; }
.member .t { font-weight: 600; }
.member .s { color: var(--ink-2); font-size: 13px; }
.minis { display: grid; gap: 4px; margin-top: 8px; }
.minis .stat { grid-template-columns: 64px 1fr 26px; font-size: 12px; }

/* auto button */
.agebar .autob { width: 56px; height: 56px; border-radius: 14px; flex: none; }
.agebar .autob svg { width: 22px; height: 22px; }

/* community */
.compose { display: grid; gap: 8px; margin-top: 12px; }
.compose textarea { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); resize: vertical; }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.post header { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.post header .linkbtn { margin-left: auto; }
.lifecard { border-radius: 10px; padding: 12px; background: var(--era-soft); margin-bottom: 8px; }
.lifecard h3 { font-size: 22px; }
.ptext { margin: 6px 0 10px; white-space: pre-wrap; }
.comments { margin-top: 10px; display: grid; gap: 4px; }
.comments p { margin: 0; font-size: 13.5px; }
.cform { display: flex; gap: 6px; margin-top: 4px; }
.cform input { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.board { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.board li { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.field select, .field input, .god select, .god input { max-width: 100%; }

/* =====================================================================
   Styles for the second expansion: change indicators, the ID card and
   profiles, personality, pins, the phone, chat, sport, dynasty crests.
   Built on the tokens in style.css, so light and dark both work.
   ===================================================================== */

/* ---------- change chips ---------- */
.dchips { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
.dchips.small { gap: 3px; }
.dchip {
  display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; font: 600 11.5px/1.55 var(--f-body);
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.dchips.small .dchip { font-size: 10.5px; padding: 0 6px; }
.dchip.up { background: color-mix(in srgb, var(--good) 15%, var(--surface)); color: var(--good); }
.dchip.down { background: color-mix(in srgb, var(--bad) 13%, var(--surface)); color: var(--bad); }
.dchip.money { font-family: var(--f-mono); font-weight: 500; }
.dchip.minor { opacity: .7; }
.dchip.more { background: none; color: var(--ink-3); }
.dodds { font: 600 10.5px/1.55 var(--f-mono); color: var(--ink-2); padding: 0 2px; }
.dodds.alt { color: var(--ink-3); }
.preview { margin-top: 5px; }
.row .preview { display: flex; }
#dtoast {
  position: fixed; left: 50%; bottom: calc(136px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(8px);
  z-index: 61; max-width: min(560px, calc(100vw - 32px)); padding: 8px 10px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#dtoast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#dtoast .dlabel { font: 600 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-right: 2px; }
.stat.srow, .wealth { position: relative; }
.stat.srow[data-d]::after, .wealth[data-d]::after {
  content: attr(data-d); position: absolute; right: 38px; top: -7px; font: 700 10.5px/1 var(--f-mono); padding: 2px 5px; border-radius: 6px;
  animation: dfade 5s ease forwards; pointer-events: none;
}
.wealth[data-d]::after { right: 0; top: -2px; }
[data-dir="up"]::after { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
[data-dir="down"]::after { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); }
@keyframes dfade { 0% { opacity: 0; transform: translateY(4px); } 10%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.ydelta { margin-top: 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.logyr li .dchips { margin-left: 4px; }

/* ---------- choices with previews ---------- */
.btn.choice { flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; padding: 10px 14px; }
.btn.choice .preview { margin-top: 3px; }
.btn.era .dchip { background: color-mix(in srgb, var(--on-era) 22%, transparent); color: var(--on-era); }
.btn.era .dodds { color: var(--on-era); }
.btn.hint { outline: 2px solid var(--warn); outline-offset: 2px; }

/* ---------- character card: avatar button and ID card ---------- */
.avbtn { border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; flex: none; }
.avbtn:hover .av, .avbtn:focus-visible .av { box-shadow: 0 0 0 3px var(--era-line); }
.idcard { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 12px 0 0; font-size: 12.5px; }
.idcard dt { color: var(--ink-3); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding-top: 1px; }
.idcard dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }

/* ---------- profiles ---------- */
.profbody { margin-top: 4px; }
.profkv { grid-template-columns: minmax(96px, auto) 1fr; }
.profkv dd { font-family: var(--f-body); font-size: 14px; }
.tiernote { font-size: 11.5px; color: var(--ink-3); margin: -5px 0 2px 102px; }
.mbti { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
.mbti .type { font: 600 24px/1 var(--f-mono); padding: 10px 12px; border-radius: 10px; background: var(--era-soft); color: var(--era); letter-spacing: .06em; }
.axes { display: grid; gap: 8px; margin-top: 12px; }
.axis { display: grid; grid-template-columns: 96px 1fr 96px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.axis span:last-child { text-align: right; }
.axis span.on { color: var(--ink); font-weight: 600; }
.axbar { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); }
.axbar i { position: absolute; top: -4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--era); box-shadow: 0 0 0 3px var(--surface); }
.traits { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; font-size: 13.5px; }
.plog { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 7px; font-size: 13.5px; max-height: 50vh; overflow: auto; }
.plog li { padding-left: 10px; border-left: 3px solid var(--line); }
.plog li.good { border-color: var(--good); } .plog li.bad, .plog li.death { border-color: var(--bad); } .plog li.love { border-color: #C2477A; } .plog li.world { font-style: italic; }
.plog .mono { font-size: 11.5px; margin-right: 4px; }
.plink { border: 0; background: none; padding: 0; font: inherit; color: var(--era); text-decoration: underline; text-decoration-color: var(--era-line); text-underline-offset: 2px; cursor: pointer; }
.plink:hover { text-decoration-color: var(--era); }
.acts.two { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.actrow { display: flex; gap: 6px; align-items: stretch; }
.actrow > .btn { flex: 1; }
/* a once-a-year action already used up: the label, then why it is greyed out */
.btn.used { flex-direction: column; gap: 2px; line-height: 1.2; }
.btn.used .note { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
.logyr li.gossip { color: var(--ink-2); }
.logyr li.gossip::before { background: #8B6CF0; }

/* ---------- auto pins ---------- */
.pin {
  border: 1px dashed var(--line); background: none; color: var(--ink-3); font: 600 10.5px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase;
  padding: 4px 7px; border-radius: 7px; cursor: pointer; align-self: center;
}
.pin:hover { color: var(--ink); border-color: var(--era-line); }
.pin.on { border-style: solid; border-color: var(--era); color: var(--era); background: var(--era-soft); }
.row .pin { margin-left: 4px; }

/* ---------- notices, sport, phone, chat ---------- */
.panel.notice { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); margin-bottom: 12px; }
.panel.sport { margin-bottom: 14px; }
.post.msg.done { opacity: .7; }
.contact { align-items: flex-start; }
.contact .linkbtn.t { font-size: 14.5px; color: var(--ink); }
.chatlog { display: grid; gap: 8px; margin: 12px 0; max-height: 46vh; overflow: auto; padding: 2px; }
.chatlog p { margin: 0; padding: 8px 12px; border-radius: 12px; font-size: 14.5px; max-width: 85%; white-space: pre-wrap; }
.chatlog p.user { justify-self: end; background: var(--era); color: var(--on-era); border-bottom-right-radius: 4px; }
.chatlog p.assistant { justify-self: start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.chatlog p.faint { max-width: none; background: none; padding: 0; }
.aibody { margin-top: 10px; }
.story .prose { font-family: var(--f-display); font-size: 17px; line-height: 1.6; color: var(--ink); }

/* ---------- dynasty ---------- */
.crestrow { display: flex; gap: 14px; align-items: center; }
.crestrow svg { flex: none; filter: drop-shadow(0 1px 2px rgb(0 0 0 / .25)); }
.dyn h3 { font-style: italic; }

/* ---------- small screens ---------- */
@media (max-width: 480px) {
  .top .iconbtn { width: 32px; height: 32px; }
  .top .iconbtn svg { width: 16px; height: 16px; }
  .top { gap: 6px; }
  #btnSound { display: none; }
  .when .yr { font-size: 15px; }
  .agebar .autob { width: 46px; }
  .axis { grid-template-columns: 78px 1fr 78px; font-size: 11.5px; }
  .tiernote { margin-left: 0; }
}
@media (max-width: 360px) { .brand h1 { display: none; } }

</style>

<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <path d="M9 19.6c.6-1.4 1.8-2.3 3-2.8 1.2.5 2.4 1.4 3 2.8z" fill="currentColor" stroke="none"/><path d="M9.6 6.2h4.8c-.5.9-1.4 1.6-2.4 2.1-1-.5-1.9-1.2-2.4-2.1z" fill="currentColor" stroke="none"/>

<script>
/* ---- data-core.js ---- */
'use strict';
/* =====================================================================
   TEMPORA — data layer, part 1: utilities, name pools, data registry.
   Everything the simulation knows about the world lives in DATA and is
   plain data. To add an era, event or activity, push a new object.
   ===================================================================== */

const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  ri: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  chance: p => Math.random() < p,
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a = 0, b = 100) => Math.max(a, Math.min(b, v)),
  slug: s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
  // Weighted pick: items + weight function
  wpick(items, w) {
    const ws = items.map(w), tot = ws.reduce((s, x) => s + x, 0);
    if (tot <= 0) return null;
    let r = Math.random() * tot;
    for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  },
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  // Years skip 0: ... 2 BC (-2), 1 BC (-1), 1 AD (1), 2 AD ... Math is done
  // in astronomical years (1 BC = 0) and converted back.
  astro: y => (y < 0 ? y + 1 : y),
  unastro: a => (a <= 0 ? a - 1 : a),
  add: (y, n) => U.unastro(U.astro(y) + n),
  next: y => U.add(y, 1),
  span: (a, b) => U.astro(b) - U.astro(a),
  fmtYear: y => (y < 0 ? `${-y} BC` : `${y}`),
  fmtYearAD: y => (y < 0 ? `${-y} BC` : y < 1000 ? `${y} AD` : `${y}`),
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  // Resolve a value that may be a number or a [min,max] range
  roll: v => (Array.isArray(v) ? U.ri(v[0], v[1]) : v),
  fmtNum(n) {
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    if (a >= 1e9) return s + (a / 1e9).toFixed(a >= 1e10 ? 0 : 1) + 'B';
    if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
    if (a >= 1e4) return s + Math.round(a / 1e3) + 'k';
    return s + Math.round(a).toLocaleString('en-US');
  },
  ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); },
  // 'House of Smith', but 'House of Thebes' for a name that is already 'of Thebes'
  house: n => (/^(of|the) /i.test(n || '') ? `House ${/^the /i.test(n) ? 'of ' : ''}${n}` : `House of ${n || '?'}`),
  roman(n) { const m = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let r = ''; for (const [v, s] of m) while (n >= v) { r += s; n -= v; } return r || '—'; },
};

function J(t, pay, o = {}) { return Object.assign({ id: U.slug(t), t, pay, sm: 0, edu: 0, rep: 0, lk: 0, risk: 0, fame: 0, vol: 0 }, o); }
// Asset: title, price (era currency), kind, yearly appreciation, yearly income rate, happiness on purchase

// Disease: name, yearly catch chance, health damage/yr, lethality/yr, duration (yrs), medicine needed to cure

/* ---- engine.js ---- */
/* =====================================================================
   ENGINE, part 1 — world state, people, family graph, yearly simulation.
   No DOM access here. The UI reads Sim.W and calls Sim.* actions.
   ===================================================================== */

const Sim = (() => {
  let W = null;                 // the whole saveable world
  const prompts = [];           // pending interactive choices (not saved)
  const hooks = {};             // extension points, filled in by engine-world.js

  /* ---------------- basic lookups ---------------- */
  const eraOf = y => DATA.eras.find(e => y >= e.from && y <= e.to) || (y < DATA.eras[0].from ? DATA.eras[0] : DATA.eras[DATA.eras.length - 1]);
  const era = () => eraOf(W.year);
  const P = id => (id == null ? null : W.people[id]);
  const me = () => W.people[W.playerId];
  const alive = p => !!p && p.died == null;
  const age = (p, y) => U.span(p.born, p.died != null ? p.died : (y ?? W.year));
  const toVal = (amt, e = era()) => amt * e.cur.r;
  const cash = p => p.money / era().cur.r;                 // in current era currency
  const curNow = (cc, e = era()) => (hooks.cur && W && hooks.cur(cc ?? P(W.playerId)?.cc, W.year)) || e.cur;
  const money = (v, e = era(), cc) => { const c = curNow(cc, e); return c.s ? `${c.s}${U.fmtNum(v / c.r)}` : `${U.fmtNum(v / c.r)} ${c.n}`; };
  const fullName = p => `${p.title ? p.title + ' ' : ''}${p.fo && !/^(of|the) /.test(p.last) ? `${p.last} ${p.first}` : `${p.first} ${p.last}`}`;
  const assetsVal = p => p.assets.reduce((s, a) => s + a.val, 0);
  const netWorth = p => p.money + assetsVal(p);
  const law = (k, e = era(), cc) => {
    const base = k === 'sameSex' ? (e.laws.sameSex || (e.laws.sameSexFrom != null && W.year >= e.laws.sameSexFrom)) : e.laws[k];
    return hooks.law ? hooks.law(k, base, e, cc ?? P(W.playerId)?.cc) : base;
  };
  const sameSexOK = (e = era(), cc) => law('sameSex', e, cc);
  const medicine = (y = W.year) => {
    const e = eraOf(y);
    return Math.min(0.97, e.life.med + DATA.history.filter(h => h.type === 'medicine' && h.y <= y && h.y >= e.from).reduce((s, h) => s + h.med, 0));
  };
  const eduComp = (e = era()) => {
    let c = e.edu.comp;
    for (const [y, lvl] of e.edu.compAt || []) if (W.year >= y) c = Math.max(c, lvl);
    return c;
  };
  // Wars from the history books plus wars declared during play (politics.js keeps W.wars)
  const activeWars = () => [...DATA.history, ...(W.wars || [])].filter(h => h.type === 'war' && W.year >= h.y && W.year <= (h.end ?? h.y));
  // neo: content that needs farming, herding or copper to have reached the player's land
  const inWindow = o => (o.from == null || W.year >= o.from) && (o.to == null || W.year <= o.to) && (o.neo == null || !hooks.neo || hooks.neo(o.neo));

  /* ---------------- family graph ---------------- */
  const parents = p => [P(p.fa), P(p.mo)].filter(Boolean);
  const kids = p => p.kids.map(P).filter(Boolean);
  const siblings = p => {
    const s = new Set();
    parents(p).forEach(par => par.kids.forEach(k => k !== p.id && s.add(k)));
    return [...s].map(P).filter(Boolean);
  };
  const grandparents = p => parents(p).flatMap(parents);
  const grandkids = p => kids(p).flatMap(kids);
  const auncles = p => parents(p).flatMap(siblings);
  const cousins = p => auncles(p).flatMap(kids);
  const niblings = p => siblings(p).flatMap(kids);
  const spouse = p => P(p.sp);

  function relLabel(p, o) {
    if (!o || o.id === p.id) return 'You';
    const M = o.sex === 'M';
    if (p.fa === o.id || p.mo === o.id) return M ? 'Father' : 'Mother';
    if (p.sp === o.id) return M ? 'Husband' : 'Wife';
    if (p.kids.includes(o.id)) return M ? 'Son' : 'Daughter';
    if (siblings(p).includes(o)) {
      const full = o.fa === p.fa && o.mo === p.mo;
      return (full ? '' : 'Half-') + (M ? 'Brother' : 'Sister');
    }
    if (grandparents(p).includes(o)) return M ? 'Grandfather' : 'Grandmother';
    if (grandkids(p).includes(o)) return M ? 'Grandson' : 'Granddaughter';
    if (auncles(p).includes(o)) return M ? 'Uncle' : 'Aunt';
    if (niblings(p).includes(o)) return M ? 'Nephew' : 'Niece';
    if (cousins(p).includes(o)) return 'Cousin';
    if (grandparents(p).some(g => g.fa === o.id || g.mo === o.id)) return M ? 'Great-grandfather' : 'Great-grandmother';
    if (grandkids(p).some(g => g.kids.includes(o.id))) return M ? 'Great-grandson' : 'Great-granddaughter';
    if (p.exes.includes(o.id)) return M ? 'Ex-husband' : 'Ex-wife';
    if (spouse(p) && parents(spouse(p)).includes(o)) return M ? 'Father-in-law' : 'Mother-in-law';
    if (kids(p).some(k => k.sp === o.id)) return M ? 'Son-in-law' : 'Daughter-in-law';
    const r = p.rels[o.id];
    if (r) return { friend: 'Friend', lover: M ? 'Boyfriend' : 'Girlfriend', fiance: M ? 'Fiancé' : 'Fiancée', ex: 'Ex', coworker: 'Coworker', enemy: 'Rival' }[r.k] || 'Acquaintance';
    return 'Acquaintance';
  }

  // Everyone the player knows (for the Relationships tab and "Become")
  function known(p) {
    const s = new Set([...parents(p), ...siblings(p), ...grandparents(p), ...auncles(p), ...cousins(p), ...kids(p), ...grandkids(p), ...niblings(p)].map(x => x.id));
    if (p.sp != null) s.add(p.sp);
    p.exes.forEach(x => s.add(x));
    Object.keys(p.rels).forEach(k => s.add(+k));
    const sp = spouse(p); if (sp) parents(sp).forEach(x => s.add(x.id));
    kids(p).forEach(k => k.sp != null && s.add(k.sp));
    s.delete(p.id);
    return [...s].map(P).filter(Boolean);
  }

  function rel(p, o) {                       // closeness record, created lazily
    if (!p.rels[o.id]) p.rels[o.id] = { k: 'fam', c: U.ri(45, 80) };
    return p.rels[o.id];
  }

  /* ---------------- people ---------------- */
  const pool = (e, cc, y) => (hooks.pool && hooks.pool(e, cc, y ?? W.year)) || DATA.names[e.names];
  function pickName(sex, e = era(), cc, y) {
    const pool_ = pool(e, cc, y);
    return U.pick(sex === 'M' ? pool_.m : pool_.f);
  }
  function mkPerson(o) {
    const e = eraOf(o.born);
    const sex = o.sex || (U.chance(0.5) ? 'M' : 'F');
    const cc = o.cc || W.spawnCC || P(W.playerId)?.cc || null;
    const p = {
      id: W.nid++, first: o.first || pickName(sex, e, cc, o.born), last: o.last || U.pick(pool(e, cc, o.born).last), sex, cc,
      born: o.born, died: null, cause: null,
      h: o.h ?? U.ri(65, 100), hp: o.hp ?? U.ri(55, 90), sm: o.sm ?? U.ri(20, 85), lk: o.lk ?? U.ri(20, 85), rep: o.rep ?? U.ri(5, 25),
      money: o.money || 0, fa: o.fa ?? null, mo: o.mo ?? null, sp: null, exes: [], kids: [],
      job: null, retired: false, edu: o.edu || 0, school: null, assets: [], rels: {}, sick: [], imm: [],
      title: o.title || null, prison: 0, orient: o.orient || 'straight', played: false, log: [], ach: [], flags: {}, did: {},
    };
    W.people[p.id] = p;
    const fa = P(p.fa), mo = P(p.mo);
    if (fa) fa.kids.push(p.id);
    if (mo) mo.kids.push(p.id);
    if (hooks.onCreate) hooks.onCreate(p, o);
    return p;
  }
  function inherit(a, b) { return U.clamp(Math.round((a + b) / 2 + U.ri(-18, 18)), 1, 100); }
  function childOf(fa, mo, born) {
    const dyn = [fa, mo].some(x => x && (x.id === W.playerId || x.last === W.dyn.name));
    const last = dyn ? W.dyn.name : (fa || mo).last;
    const sex = U.chance(0.5) ? 'M' : 'F';
    const taken = new Set([...[fa, mo].filter(Boolean).flatMap(x => x.kids.map(P)).filter(k => k && alive(k)), fa, mo].filter(Boolean).map(k => k.first));
    const cc = mo?.cc || fa?.cc;
    let first = pickName(sex, eraOf(born), cc, born);
    for (let i = 0; i < 6 && taken.has(first); i++) first = pickName(sex, eraOf(born), cc, born);
    return mkPerson({ born, sex, first, cc, fa: fa?.id, mo: mo?.id, last, sm: inherit(fa?.sm ?? 50, mo?.sm ?? 50), lk: inherit(fa?.lk ?? 50, mo?.lk ?? 50), h: U.ri(70, 100), hp: U.ri(70, 95) });
  }

  function log(p, t, k = 'life') {
    p.log.push({ y: W.year, a: age(p), t, k });
    if (p.log.length > 400) p.log.splice(0, p.log.length - 400);
    if (hooks.onLog) hooks.onLog(p, t, k);
  }

  /* ---------------- hooks, stat snapshots and change records ---------------- */
  // Chain an extension hook. 'seq' calls every handler in order, 'mul' multiplies
  // numeric results, 'add' sums them, 'cat' concatenates array results.
  function addHook(name, fn, mode = 'seq') {
    const prev = hooks[name];
    if (!prev) { hooks[name] = fn; return; }
    hooks[name] = mode === 'mul' ? (...a) => (prev(...a) ?? 1) * (fn(...a) ?? 1)
      : mode === 'add' ? (...a) => (prev(...a) || 0) + (fn(...a) || 0)
      : mode === 'cat' ? (...a) => [...(prev(...a) || []), ...(fn(...a) || [])]
      : (...a) => { prev(...a); return fn(...a); };
  }
  const hk = (name, ...a) => (hooks[name] ? hooks[name](...a) : undefined);
  const hmul = (name, ...a) => (hooks[name] ? hooks[name](...a) ?? 1 : 1);
  const hadd = (name, ...a) => (hooks[name] ? hooks[name](...a) || 0 : 0);
  const STAT_KEYS = ['h', 'hp', 'sm', 'lk', 'rep', 'mh', 'fe', 'im', 'wp', 'fm'];
  // Extra numbers worth tracking in change records (followers, skills...): [label, p => number]
  const snapFns = [];
  const snapAdd = (label, f) => snapFns.push([label, f]);
  function snap(p) {
    const s = { $: p.money, c: {}, x: {} };
    for (const [k, f] of snapFns) { try { s.x[k] = f(p) || 0; } catch { s.x[k] = 0; } }
    for (const k of STAT_KEYS) s[k] = p[k] ?? 0;
    for (const [id, r] of Object.entries(p.rels)) s.c[id] = r.c;
    return s;
  }
  // Compact change record: { h: -3, hp: 5, $: 120, rel: [[id, +8], [id, 'new']], x: {...} }
  function diff(a, b) {
    const d = {};
    for (const k of STAT_KEYS) { const v = Math.round((b[k] ?? 0) - (a[k] ?? 0)); if (v) d[k] = v; }
    const m = b.$ - a.$; if (Math.abs(m) >= 0.5) d.$ = Math.round(m * 100) / 100;
    const rc = [];
    for (const [id, c] of Object.entries(b.c)) { if (a.c[id] == null) rc.push([+id, 'new']); else { const v = Math.round(c - a.c[id]); if (v) rc.push([+id, v]); } }
    if (rc.length) d.rel = rc.sort((x, y) => (y[1] === 'new') - (x[1] === 'new') || Math.abs(y[1]) - Math.abs(x[1])).slice(0, 4);
    const x = {}; for (const k of Object.keys(b.x || {})) { const v = Math.round((b.x[k] || 0) - (a.x?.[k] || 0)); if (v) x[k] = v; }
    if (Object.keys(x).length) d.x = x;
    return d;
  }
  const hasDiff = d => !!d && Object.keys(d).length > 0;
  function tagLast(p, d) { if (hasDiff(d) && p.log.length) p.log[p.log.length - 1].d = d; }

  /* ---------------- jobs (shared by NPCs and player) ---------------- */
  const jobsNow = (e = era(), cc) => [...e.jobs.filter(inWindow).map(j => (hooks.jobMap ? hooks.jobMap(j, cc) : j)).filter(Boolean), ...(hooks.jobs ? hooks.jobs(e, cc) : [])];
  function eligible(p, j) {
    return (!j.sex || j.sex === p.sex) && p.sm >= j.sm && p.edu >= j.edu && p.rep >= j.rep && p.lk >= j.lk;
  }
  function giveJob(p, j, e = era()) {
    p.job = { id: j.id, t: (p.sex === 'F' && j.tf) || j.t, era: e.id, pay: toVal(j.pay, e), yrs: 0, perf: 55, rank: 0, risk: j.risk, fame: j.fame, vol: j.vol };
    p.retired = false; p.lastJob = p.job.t;
    if (/astronaut|mars|orbital|starship|asteroid|colonist/i.test(j.t)) p.flags.space = 1;
  }
  function npcJob(p, e) {
    const opts = jobsNow(e).filter(j => eligible(p, j) && !j.grant);
    const j = U.wpick(opts, x => 1 / Math.sqrt(x.pay) * (x.pay < e.cost * 3 ? 3 : 1));
    if (j) giveJob(p, j, e);
  }

  /* ---------------- world creation ---------------- */
  const CLASSES = [
    { id: 'poor', w: 35, cash: 0.2, edu: 0 }, { id: 'common', w: 40, cash: 1, edu: 0.3 },
    { id: 'comfortable', w: 17, cash: 4, edu: 0.7 }, { id: 'wealthy', w: 7, cash: 20, edu: 1 }, { id: 'noble', w: 1.5, cash: 60, edu: 1 },
  ];
  function seedAdult(o, e, cls) {
    const p = mkPerson(o);
    const lvl = CLASSES.indexOf(cls);
    p.edu = Math.max(eduComp(e), U.chance(cls.edu) ? U.ri(1, Math.min(4, lvl + 1)) : 0);
    p.sm = U.clamp(p.sm + lvl * 4);
    p.money = toVal(e.cost, e) * cls.cash * U.rand(0.5, 1.5);
    p.rep = U.clamp(p.rep + lvl * 8);
    if (hooks.onSeed) hooks.onSeed(p, lvl);
    if (age(p) >= 16) {
      if (lvl >= 3) {
        const good = jobsNow(e).filter(j => (!j.sex || j.sex === p.sex) && !j.grant).sort((a, b) => b.pay - a.pay).slice(0, 5);
        giveJob(p, U.pick(good), e);
      } else npcJob(p, e);
    }
    return p;
  }

  function newWorld(opt) {
    const year = opt.year;
    W = { v: 1, year, nid: 1, people: {}, playerId: null, news: [], started: year,
      dyn: { name: '', score: 0, lives: [], played: [], founder: null, houses: [] }, god: false, lastEra: eraOf(year).id,
      mode: opt.mode || 'narrative', godOn: !!opt.godOn, pets: {}, auto: {}, rel: {}, nat: {}, pops: {} };
    spawnFamily(opt);
    return W;
  }

  // A complete family (grandparents, parents, aunts, uncles, cousins, older
  // siblings) around a newborn player, in the current world year.
  function spawnFamily(opt) {
    const year = W.year;
    const e = eraOf(year);
    W.spawnCC = opt.cc || (hooks.defaultCC && hooks.defaultCC(year)) || null;
    const mA = law('marry', e, W.spawnCC);
    const cls = opt.cls ? CLASSES.find(c => c.id === opt.cls) : U.wpick(CLASSES, c => c.w);
    const last = opt.last?.trim() || U.pick(pool(e, W.spawnCC).last);
    const faAge = U.ri(mA + 6, 40), moAge = U.ri(mA + 3, Math.min(40, faAge + 2));
    const by = a => U.add(year, -a);
    // grandparents
    const gpf = seedAdult({ sex: 'M', born: by(faAge + U.ri(20, 32)), last }, e, cls);
    const gmf = seedAdult({ sex: 'F', born: by(faAge + U.ri(18, 28)) }, e, cls);
    const gpm = seedAdult({ sex: 'M', born: by(moAge + U.ri(20, 32)) }, e, cls);
    const gmm = seedAdult({ sex: 'F', born: by(moAge + U.ri(18, 28)), last: undefined }, e, cls);
    marry(gpf, gmf, true); marry(gpm, gmm, true);
    // parents
    const fa = seedAdult({ sex: 'M', born: by(faAge), fa: gpf.id, mo: gmf.id, last }, e, cls);
    const mo = seedAdult({ sex: 'F', born: by(moAge), fa: gpm.id, mo: gmm.id, last: gpm.last }, e, cls);
    marry(fa, mo, true);
    if (cls.id === 'noble' && ['medieval', 'renaissance', 'colonial', 'industrial'].includes(e.id)) { gpf.title = 'Lord'; fa.title = 'Lord'; }
    // aunts, uncles, cousins
    for (const [g1, g2, parentAge] of [[gpf, gmf, faAge], [gpm, gmm, moAge]]) {
      for (let i = 0, n = U.ri(0, 3); i < n; i++) {
        const a = U.clamp(parentAge + U.ri(-8, 8), mA, 60);
        const au = seedAdult({ born: by(a), fa: g1.id, mo: g2.id, last: g1.last }, e, cls);
        if (a > mA + 4 && U.chance(0.7)) {
          const sp = seedAdult({ sex: au.sex === 'M' ? 'F' : 'M', born: by(a + U.ri(-4, 4)) }, e, cls);
          marry(au, sp, true);
          const [f, m] = au.sex === 'M' ? [au, sp] : [sp, au];
          for (let k = 0, kn = U.ri(0, 3); k < kn; k++) {
            const ka = U.ri(0, Math.max(0, a - mA - 2));
            const c = childOf(f, m, by(ka)); c.last = f.last;
            if (ka >= 16) npcJob(c, e);
          }
        }
      }
    }
    // older siblings
    const maxSib = Math.max(0, moAge - mA - 1);
    for (let i = 0, n = U.ri(0, Math.min(3, Math.floor(maxSib / 2))); i < n; i++) {
      const sa = U.ri(1, maxSib);
      const s = childOf(fa, mo, by(sa)); s.last = last;
      s.edu = Math.min(eduComp(e), sa >= 12 ? 2 : sa >= 6 ? 1 : 0);
      if (sa >= 16) npcJob(s, e);
    }
    // the player
    const p = childOf(fa, mo, year);
    p.last = last; p.sex = opt.sex || p.sex; p.first = opt.first?.trim() || pickName(p.sex, e, p.cc); p.orient = opt.orient || 'straight';
    delete W.spawnCC;
    if (hooks.onFamily) hooks.onFamily(p, { fa, mo, cls, opt });
    W.dyn.name = last; W.dyn.founder = p.id; W.dyn.houses.push({ name: last, y: year, founder: p.id });
    known(p).forEach(o => (rel(p, o).c = U.ri(55, 90)));
    setPlayer(p, true);
    const fj = fa.job ? `a ${fa.job.t.toLowerCase()}` : 'unemployed';
    const mj = mo.job ? `a ${mo.job.t.toLowerCase()}` : 'at home';
    log(p, `You were born a ${p.sex === 'M' ? 'boy' : 'girl'} in the ${e.name} era. Your father ${fa.first} is ${fj}; your mother ${mo.first} is ${mj}. Your family is ${cls.id}.`, 'birth');
    const gl = grandparents(p).length;
    if (gl) log(p, `Your ${gl} grandparents came to meet you.`, 'birth');
    return p;
  }

  function setPlayer(p, founder = false) {
    W.playerId = p.id;
    if (!p.played) { p.played = true; W.dyn.played.push(p.id); }
    if (!founder) log(p, `From this year, you live as ${p.first} ${p.last}.`, 'switch');
  }

  function marry(a, b, silent) {
    a.sp = b.id; b.sp = a.id;
    delete a.rels[b.id]; delete b.rels[a.id];
    a.rels[b.id] = { k: 'fam', c: U.ri(65, 95) }; b.rels[a.id] = { k: 'fam', c: U.ri(65, 95) };
    if (!silent) { log(a, `Married ${b.first} ${b.last}.`, 'love'); log(b, `Married ${a.first} ${a.last}.`, 'love'); }
  }
  function unmarry(a, b) {
    if (a.sp === b.id) a.sp = null; if (b.sp === a.id) b.sp = null;
    if (!a.exes.includes(b.id)) a.exes.push(b.id);
    if (!b.exes.includes(a.id)) b.exes.push(a.id);
  }

  /* ---------------- death ---------------- */
  function mortality(p, e, a) {
    const L = e.life, med = medicine();
    let q = 0;
    const cm = L.child * (1 - med * 0.5);
    if (a < 5) q += (1 - Math.pow(1 - cm, 1 / 5)) * 0.85;       // era diseases supply the rest
    else if (a < 15) q += cm * 0.015;
    // Gompertz senescence around the era's modal adult age, scaled by health
    q += 0.09 * Math.exp(0.09 * (a - L.adult)) * 0.55 * U.clamp(1 + (60 - p.h) / 40, 0.35, 3);
    if (hooks.mort) q *= hooks.mort(p, a);
    return Math.min(0.95, q + L.acc * 0.35 * hmul('accMul', p));
  }
  function causeOf(p, e, a) {
    if (p.sick.length) return U.pick(p.sick).n;
    if (U.chance(e.life.acc * 20)) return U.pick(e.die.acc);
    if (a < 5) return U.pick(e.die.kid);
    if (a >= Math.min(e.life.adult - 8, e.life.adult * 0.8)) return U.chance(0.45) ? 'old age' : U.pick(e.die.old);
    return U.pick(e.die.adult);
  }
  function kill(p, cause) {
    if (!alive(p)) return;
    // Far Future mind backup: one restore
    if (p.flags.backup && p.id === W.playerId) {
      delete p.flags.backup; p.flags.revived = 1; p.h = 60; p.sick = [];
      log(p, `You died of ${cause}, but were restored from your mind backup into a new body.`, 'bad');
      return;
    }
    p.died = W.year; p.cause = cause; p.job = null; p.school = null;
    if (hooks.onDeath) hooks.onDeath(p);
    const sp = spouse(p);
    if (sp) { sp.sp = null; if (!sp.exes.includes(p.id)) sp.flags.widow = p.id; log(sp, `${p.first} died of ${cause}.`, 'death'); }
    log(p, `Died of ${cause}.`, 'death');
    const pl = me();
    if (pl && p.id !== pl.id && alive(pl) && known(pl).includes(p)) {
      log(pl, `Your ${relLabel(pl, p).toLowerCase()} ${p.first} died of ${cause}${age(p) ? ` at ${age(p)}` : ''}.`, 'death');
      pl.hp = U.clamp(pl.hp - ((pl.rels[p.id]?.c ?? 50) > 60 ? 12 : 5));
      // NPC estates flow to their children or spouse (the player's own estate is handled at their death)
      npcEstate(p);
    } else npcEstate(p);
  }
  function npcEstate(p) {
    if (p.id === W.playerId) return;
    const heirs = kids(p).filter(alive);
    const sp = spouse(p);
    const val = netWorth(p);
    if (val <= 0) return;
    const to = heirs.length ? heirs : sp && alive(sp) ? [sp] : [];
    if (!to.length) return;
    const share = p.money / to.length;
    to.forEach((h, i) => {
      h.money += share;
      p.assets.filter((_, k) => k % to.length === i).forEach(a => h.assets.push(a));
      if (h.id === W.playerId && val > 1) log(h, `You inherited ${money(share + p.assets.filter((_, k) => k % to.length === i).reduce((s, a) => s + a.val, 0))} from ${p.first}.`, 'money');
    });
    if (p.title && heirs.length) { const eldest = heirs.sort((a, b) => a.born - b.born)[0]; if (!eldest.title) eldest.title = eldest.sex === 'M' ? p.title.replace('Lady', 'Lord') : p.title.replace('Lord', 'Lady').replace('Sir', 'Dame'); }
    p.money = 0; p.assets = [];
  }

  /* ---------------- effects ---------------- */
  // Apply an fx object to a person. Returns nothing; logs side effects.
  function applyFx(p, fx, e = era()) {
    if (!fx) return;
    for (const k of ['h', 'hp', 'sm', 'lk', 'rep', 'mh', 'fe', 'im', 'wp', 'fm']) if (fx[k] != null) p[k] = U.clamp((p[k] ?? 50) + U.roll(fx[k]));
    if (fx.$ != null) p.money += toVal(U.roll(fx.$), e);
    if (fx.$c != null) { const r = Array.isArray(fx.$c) ? U.rand(fx.$c[0], fx.$c[1]) : fx.$c; p.money += toVal(e.cost * r, e); }
    if (fx.edu != null) p.edu = Math.max(p.edu, fx.edu);
    if (fx.jail) jail(p, fx.jail);
    if (fx.fire && p.job) { log(p, `You lost your job as ${p.job.t.toLowerCase()}.`, 'bad'); p.job = null; }
    if (fx.job) { const j = jobsNow(e, p.cc).find(x => x.id === fx.job); if (j) { giveJob(p, j, e); log(p, `You now work as ${j.t.toLowerCase()}.`, 'work'); } }
    if (fx.lover) newLover(p, true);
    if (hooks.fx) hooks.fx(p, fx, e);
  }
  function jail(p, yrs) {
    p.prison += yrs; p.flags.jailed = 1;
    if (p.job) p.job = null;
    p.school = null;
    p.rep = U.clamp(p.rep - 8);
  }

  /* ---------------- relationships spawning ---------------- */
  function prefSex(p) {
    if (p.orient === 'gay') return p.sex;
    if (p.orient === 'bi') return U.chance(0.5) ? 'M' : 'F';
    return p.sex === 'M' ? 'F' : 'M';
  }
  function newLover(p, quiet) {
    const a = age(p);
    const o = mkPerson({ near: p, sex: prefSex(p), born: U.add(W.year, -U.clamp(a + U.ri(-4, 4), 14, 120)) });
    o.sm = U.clamp(p.sm + U.ri(-25, 25)); o.money = toVal(era().cost, era()) * U.rand(0, 2);
    if (age(o) >= 16) npcJob(o, era());
    p.rels[o.id] = { k: 'lover', c: U.ri(55, 85) };
    o.rels[p.id] = { k: 'lover', c: U.ri(55, 85) };
    if (!quiet) log(p, `You started seeing ${o.first} ${o.last}.`, 'love');
    else log(p, `${o.first} ${o.last} is now your ${o.sex === 'M' ? 'boyfriend' : 'girlfriend'}.`, 'love');
    return o;
  }
  function newFriend(p, k = 'friend') {
    const a = age(p);
    const o = mkPerson({ near: p, born: U.add(W.year, -U.clamp(a + U.ri(-6, 6), 4, 120)) });
    if (age(o) >= 16) npcJob(o, era());
    p.rels[o.id] = { k, c: U.ri(40, 75) };
    o.rels[p.id] = { k, c: U.ri(40, 75) };
    return o;
  }

  /* ---------------- connected set (who gets a full life sim) ---------------- */
  function connected() {
    const pl = me(), set = new Set(), q = [[pl.id, 0]];
    while (q.length) {
      const [id, d] = q.shift();
      if (set.has(id)) continue;
      set.add(id);
      if (d >= 3) continue;
      const p = P(id); if (!p) continue;
      [p.fa, p.mo, p.sp, ...p.kids].forEach(n => n != null && !set.has(n) && q.push([n, d + 1]));
    }
    Object.keys(pl.rels).forEach(k => set.add(+k));
    return set;
  }

  /* ---------------- disease ---------------- */
  function catchChance(p, d, a) {
    let c = d.p * (1.5 - p.h / 100);
    if (d.kid) c *= a < 12 ? 3 : 0.2;
    if (d.adult && a < 16) c = 0;
    if (d.ag) c *= Math.max(0.1, (a - 25) / 25);
    if (hooks.catchMul) c *= hooks.catchMul(p, d);
    return c;
  }
  function tickSick(p, e, a, isPl) {
    for (const d of e.dis) {
      if (!inWindow(d) || p.imm.includes(d.id) || p.sick.some(s => s.id === d.id)) continue;
      if (U.chance(catchChance(p, d, a))) {
        p.sick.push({ id: d.id, n: d.n, left: d.dur, dmg: d.dmg, let: d.let, cure: d.cure });
        if (isPl) log(p, `You fell ill with ${d.n.toLowerCase()}.`, 'bad');
      }
    }
    const med = medicine();
    for (const s of p.sick.slice()) {
      p.h = U.clamp(p.h - s.dmg * U.rand(0.5, 1.2));
      if (U.chance(s.let * (1 - med * 0.8) * (1.4 - p.h / 100))) { kill(p, s.n.toLowerCase()); return; }
      if (--s.left <= 0) {
        p.sick.splice(p.sick.indexOf(s), 1);
        if (s.wave) p.flags.plague = 1;
        if (['smallpox', 'measles'].includes(s.id)) p.imm.push(s.id);
        if (isPl) log(p, `You recovered from ${s.n.toLowerCase()}.`, 'good');
      }
    }
  }

  /* ---------------- per-person yearly tick ---------------- */
  function tickPerson(p, e, full, isPl) {
    const a = age(p), L = e.life;
    // aging, then the body's own recovery toward a baseline that sinks with age
    const s = L.adult * 0.6;
    if (a > s) p.h = U.clamp(p.h - Math.max(0, a - s) / (L.adult * 0.4) * 2.2 * L.age * U.rand(0.5, 1.5));
    else if (a < 18) p.h = U.clamp(p.h + U.ri(-1, 3));
    const base = a < s ? 88 : Math.max(20, 88 - (a - s) * 1.2 * L.age);
    if (!p.sick.length && p.h < base) p.h = U.clamp(p.h + (base - p.h) * 0.12);
    if (a > 40) p.lk = U.clamp(p.lk - U.rand(0, 0.8));
    if (!isPl) { p.hp = U.clamp(p.hp + U.ri(-4, 4)); }
    if (p.prison > 0) { p.prison--; p.hp = U.clamp(p.hp - 5); if (isPl) log(p, p.prison ? `Another year behind bars. ${p.prison} to go.` : 'You were released from prison.', p.prison ? 'bad' : 'good'); }
    tickSick(p, e, a, isPl);
    if (!alive(p)) return;
    if (hooks.tick) hooks.tick(p, e, a, isPl, full);
    if (p.h <= 0 || U.chance(mortality(p, e, a))) { kill(p, causeOf(p, e, a)); return; }
    if (isPl) return;          // the player's choices drive the rest
    // NPC education, work, money
    if (a === 6 && eduComp(e) >= 1) p.edu = Math.max(p.edu, 1);
    if (a === 12 && eduComp(e) >= 2) p.edu = Math.max(p.edu, 2);
    if (a === 22 && p.edu >= 2 && U.chance(p.sm / 160)) p.edu = 3;
    if (!full) return;
    if (a >= 16 && !p.job && !p.retired && p.prison <= 0 && U.chance(0.4)) npcJob(p, e);
    if (p.job) {
      if (p.job.era !== e.id && U.chance(0.5)) { p.job = null; npcJob(p, e); }
      if (p.job) { p.job.yrs++; p.money += p.job.pay * U.rand(0.08, 0.18); if (p.job.risk && U.chance(p.job.risk)) p.h = U.clamp(p.h - U.ri(8, 25)); }
      if (p.job && L.retire && a >= L.retire) { p.job = null; p.retired = true; }
    }
    if (!p.job && a >= 18 && law('ubi', e, p.cc)) p.money += toVal(law('ubi', e, p.cc), e) * 0.1;
    // relationships
    const mA = law('marry', e, p.cc);
    if (p.sp == null && a >= mA + 2 && a <= 50 && U.chance((a < 30 ? 0.12 : 0.05) * hmul('npcMul', p, 'marry'))) {
      const sp = mkPerson({ cc: p.cc, near: p, sex: p.orient === 'gay' && sameSexOK(e, p.cc) ? p.sex : p.sex === 'M' ? 'F' : 'M', born: U.add(W.year, -U.clamp(a + U.ri(-5, 5), mA, 80)) });
      sp.money = toVal(e.cost, e) * U.rand(0, 3); if (age(sp) >= 16) npcJob(sp, e);
      marry(p, sp);
      const pl = me();
      if (pl && known(pl).includes(p)) log(pl, `Your ${relLabel(pl, p).toLowerCase()} ${p.first} married ${sp.first} ${sp.last}.`, 'family');
    }
    const sp = spouse(p);
    if (sp && law('divorce', e, p.cc) && U.chance(0.008 * hmul('npcMul', p, 'divorce'))) {
      unmarry(p, sp); log(p, `Divorced ${sp.first}.`, 'love');
      const pl = me();
      if (pl && pl.id !== sp.id && known(pl).includes(p)) log(pl, `Your ${relLabel(pl, p).toLowerCase()} ${p.first} and ${sp.first} divorced.`, 'family');
    }
    // children: the woman of a couple rolls
    if (sp && alive(sp) && p.sex === 'F' && sp.sex === 'M' && a >= 16 && a <= 44) {
      const f = e.life.fert * (a > 35 ? 0.5 : 1) * (p.kids.length > 6 ? 0.3 : 1) * (hooks.fert ? hooks.fert(p, sp) : 1);
      if (U.chance(f)) birth(sp, p);
    }
  }

  function birth(fa, mo) {
    const e = era();
    const c = childOf(fa, mo, W.year);
    log(fa, `${c.sex === 'M' ? 'Son' : 'Daughter'} ${c.first} was born.`, 'family');
    log(mo, `${c.sex === 'M' ? 'Son' : 'Daughter'} ${c.first} was born.`, 'family');
    if (hooks.onBirth) hooks.onBirth(c, fa, mo);
    const pl = me();
    if (pl && pl.id !== fa.id && pl.id !== mo.id) {
      const k = known(pl);
      const par = [mo, fa].find(x => k.includes(x));
      if (par) log(pl, `Your ${relLabel(pl, par).toLowerCase()} ${par.first} had a baby: ${c.first}.`, 'family');
    }
    if (e.life.birth && U.chance(e.life.birth * (1 - medicine()))) kill(mo, 'complications of childbirth');

  }

  /* ---------------- history ---------------- */
  function histTick(list = [...DATA.history, ...(W.wars || [])]) {
    const pl = me();
    const conn = connected();
    const scope = (h, q) => !h.where || h.where.includes(q.cc);
    for (const h of list) {
      const end = h.end ?? h.y;
      if (W.year < h.y || W.year > end) continue;
      const first = W.year === h.y;
      if (first) {
        W.news.push({ y: W.year, t: h.t, type: h.type, where: h.where || null });
        if (alive(pl) && scope(h, pl)) log(pl, h.t, 'world');
        if (h.fx) Object.values(W.people).filter(q => alive(q) && scope(h, q)).forEach(p => applyFx(p, h.fx));
      }
      const living = Object.values(W.people).filter(q => alive(q) && scope(h, q));
      if (h.type === 'plague') {
        let hit = false;
        for (const p of living) {
          if (p.sick.some(s => s.id === U.slug(h.dn)) || U.chance(1 - h.inf * (1.3 - p.h / 100))) continue;
          p.sick.push({ id: U.slug(h.dn), n: h.dn, left: 1, dmg: h.dmg, let: h.let, cure: 0.6, wave: 1 });
          if (p === pl) hit = true;
        }
        if (hit) log(pl, `You caught the ${h.dn}.`, 'bad');
      } else if (h.type === 'war') {
        for (const p of living) {
          const a = age(p);
          if (p.flags.war === h.key) {
            if (a > 50 || W.year === end) { delete p.flags.war; p.flags.vet = 1; if (p === pl) log(p, `You came home from the ${h.n}.`, 'good'); continue; }
            if (U.chance(h.mort)) kill(p, `wounds in the ${h.n}`);
            else if (p === pl && U.chance(0.3)) { p.h = U.clamp(p.h - U.ri(5, 20)); log(p, `You were wounded at the front.`, 'bad'); }
            continue;
          }
          if (p.sex === 'M' && a >= 18 && a <= 45 && !p.prison && !law('noDraft', era(), p.cc) && U.chance(h.draft * hmul('draftMul', p))) {
            if (p === pl) draftPrompt(p, h);

          } else if (h.civ && U.chance(h.civ)) kill(p, `the ${h.n}`);
        }
      } else if (h.type === 'famine') {
        for (const p of living) {
          p.h = U.clamp(p.h - h.dmg * U.rand(0.5, 1.2) * (p.money > toVal(era().cost * 3) ? 0.3 : 1));
          if (U.chance(h.mort * (p.money > toVal(era().cost * 3) ? 0.2 : 1))) kill(p, 'starvation');
        }
      } else if (h.type === 'crash') {
        if (first) living.forEach(p => { if (p.money > 0) p.money *= 1 - h.loss; p.assets.forEach(a => a.kind === 'stock' && (a.val *= 1 - h.loss * 1.5)); });
        if (h.lay) living.forEach(p => { if (p.job && U.chance(h.lay)) { if (p === pl) log(p, `You were laid off from your job as ${p.job.t.toLowerCase()}.`, 'bad'); p.job = null; } });
      } else if (h.type === 'disaster') {
        if (alive(pl) && scope(h, pl) && U.chance(h.p)) {
          applyFx(pl, h.fx); if (h.loss) pl.money *= 1 - h.loss;

        }

        for (const p of living) if (p.title && U.chance(h.strip)) {
          if (p === pl) log(p, `Revolutionaries stripped you of your title and seized half your wealth.`, 'bad');
          p.title = null; p.money *= 0.5;
        }
      }
    }
  }

  function draftPrompt(p, h) {
    prompt({
      title: `Called up: ${h.n}`, text: `You have been conscripted to fight in the ${h.n}.`,
      choices: [
        { l: 'Serve', go: () => { p.flags.war = h.key; p.rep = U.clamp(p.rep + 5); if (p.job) p.job = null; log(p, `You went off to fight in the ${h.n}.`, 'world'); return 'You shipped out with your unit.'; } },
        { l: 'Dodge the draft', go: () => { if (U.chance(0.5)) { if (hooks.arrest) return hooks.arrest(p, { crime: 'draft', yrs: U.ri(1, 3), sev: 2 }); jail(p, U.ri(1, 3)); log(p, 'You were caught dodging the draft and imprisoned.', 'bad'); return 'Caught. You were sent to prison.'; } p.rep = U.clamp(p.rep - 6); log(p, 'You dodged the draft.', 'life'); return 'You slipped through the cracks, but people talk.'; } },
        { l: 'Flee abroad', go: () => { p.money *= 0.6; p.hp = U.clamp(p.hp - 8); if (p.job) p.job = null; log(p, 'You fled abroad to avoid the war, leaving much behind.', 'life'); return 'You escaped, at great cost.'; } },

    if (pr.choices?.length && pr.choices.every(c => c.dis)) pr.choices.push({ l: 'Let it pass', go: () => 'You could not afford any of it, so you let it pass.' });

/* ---- engine-player.js ---- */
/* =====================================================================
   ENGINE, part 2 — the player's year, choices, careers, school,
   relationships, assets, death & inheritance, dynasty, god mode, saves.
   ===================================================================== */

Object.assign(Sim, (() => {
  const S = Sim;
  const W = () => S.W;
  const EDU_YEARS = [0, 6, 6, 4, 4];
  const EDU_AGE = [0, 5, 10, 16, 20];
  const EDU_SM = [0, 0, 20, 45, 65];
  const workAge = e => (e.id === 'prehistory' ? 10 : DATA.PREMODERN.includes(e.id) ? 12 : 16);

  /* ---------------- the yearly loop ---------------- */
  function ageUp() {
    const w = W(), p = S.me();
    if (!S.alive(p) || w.dead) return;
    const s0 = S.snap(p);
    w.year = U.next(w.year);
    const e = S.era();
    p.did = {};
    if (e.id !== w.lastEra) {
      w.lastEra = e.id;
      w.news.push({ y: w.year, t: `The ${e.name} era begins.`, type: 'era' });
      S.log(p, `A new age dawns: the ${e.name} era. ${e.blurb}`, 'era');
      if (S.age(p) > 0) p.flags.era = 1;
    }
    if (S.hooks.preYear) S.hooks.preYear(p, e);
    S.histTick();
    const conn = S.connected();
    for (const q of Object.values(w.people)) if (S.alive(q)) S.tickPerson(q, e, conn.has(q.id), q.id === p.id);
    if (S.alive(p)) playerYear(p, e);
    if (S.alive(p)) randomEvents(p, e);
    if (S.alive(p) && S.hooks.postYear) S.hooks.postYear(p, e);
    if (S.alive(p) && !p.log.some(l => l.y === w.year)) S.log(p, quietYear(S.age(p)), 'quiet');
    checkAch(p);
    const yd = S.diff(s0, S.snap(p));
    if (S.hasDiff(yd)) { (p.yd ||= []).push({ y: w.year, d: yd }); if (p.yd.length > 160) p.yd.splice(0, p.yd.length - 160); }
    w.lastYear = { y: w.year, d: yd, pid: p.id };
    if (w.year % 25 === 0) prune();
    if (!S.alive(p)) onDeath(p);
  }

  const QUIET = [
    [2, ['You slept, ate and cried. Mostly cried.', 'You grew round and content.', 'You discovered your own feet.']],
    [12, ['You played with the other children.', 'You helped around the house.', 'You chased animals and scraped your knees.', 'You asked "why?" roughly ten thousand times.']],
    [19, ['You spent the year daydreaming.', 'You argued with your parents about everything.', 'You felt like nobody understood you.']],
    [64, ['A quiet year.', 'The year passed without much to remark on.', 'Work, meals, sleep. Repeat.', 'An ordinary year, and you were grateful for it.']],
    [999, ['You spent the year by the fire with your memories.', 'A slow, peaceful year.', 'You told the same stories again. Nobody minded.']],
  ];
  const quietYear = a => U.pick(QUIET.find(([m]) => a <= m)[1]);

  function playerYear(p, e) {
    const a = S.age(p), L = e.life;
    schoolYear(p, e, a);
    // work
    const j = p.job;
    let takeHome = 0;
    if (j) {
      j.yrs++;
      let pay = j.pay * rankPay(j) * S.hmul('payMul', p, j);
      if (j.vol) pay *= U.rand(1 - j.vol * 0.6, 1 + j.vol);
      takeHome = pay * (1 - Math.min(0.9, L.tax * S.hmul('taxMul', p)));
      p.money += takeHome;
      j.perf = U.clamp(j.perf + U.ri(-6, 5) + S.hadd('perf', p, j));
      if (j.fame) { p.fm = U.clamp((p.fm ?? 0) + j.fame * U.rand(0.5, 1.5) * (1 + 0.25 * j.rank) * (1 - (p.fm ?? 0) / 130)); p.rep = U.clamp(p.rep + j.fame * 0.3); }
      if (j.risk && U.chance(j.risk)) { p.h = U.clamp(p.h - U.ri(8, 25)); S.log(p, 'You were injured at work.', 'bad'); }
      if (j.perf >= 80 && promoReady(j) && j.rank < 4 && U.chance(0.35 * S.hmul('promoMul', p, j))) { j.rank++; j.perf = 60; j.lastPromo = j.yrs; S.log(p, `You were promoted to ${rankName(j.rank)} ${j.t.toLowerCase()}.`, 'good'); }
      else if (j.perf < 15 && U.chance(0.4)) { S.log(p, `You were fired from your job as ${j.t.toLowerCase()}.`, 'bad'); p.job = null; }
      if (p.job && j.era !== e.id && !S.jobsNow(e, p.cc).some(x => x.id === j.id) && U.chance(0.3)) { S.log(p, `Your trade as ${j.t.toLowerCase()} has no place in the ${e.name} era. You are out of work.`, 'bad'); p.job = null; }
    } else if (p.retired && L.retire) p.money += S.toVal(e.cost * 0.6);
    else if (a >= 18 && S.law('ubi', e, p.cc) && !p.prison) p.money += S.toVal(S.law('ubi', e, p.cc));
    // cost of living
    if ((a >= 18 || takeHome > 0) && !p.prison && !p.school?.home) {      // working children pay their way at home too
      const deps = S.kids(p).filter(k => S.alive(k) && S.age(k) < 18).length;
      const sp = S.spouse(p);
      const share = sp && S.alive(sp) && sp.job ? 0.6 : 1;
      const home = p.assets.some(x => x.kind === 'home') ? 0.75 : 1;
      const par = a < 25 && !(sp && S.alive(sp)) ? S.parents(p).filter(S.alive).sort((x, y) => y.money - x.money)[0] : null;   // still living with family
      // what a household of this station needs, or most of what it brings home, whichever is more
      const need = S.toVal(e.cost) * (1 + deps * 0.3) * share * home * S.hmul('costMul', p, e);
      const c1 = S.toVal(e.cost), bill = Math.max(need, takeHome * (takeHome < c1 * 2 ? 0.88 : takeHome < c1 * 6 ? 0.78 : 0.6));
      // at home, a working child hands over a good part of their wages; the parents carry the rest
      if (par) { const mine = Math.max(need * (p.job ? 0.35 : 0.15), takeHome * 0.6), theirs = Math.min(Math.max(0, par.money), need * 0.3); p.money -= mine + Math.max(0, need * 0.3 - theirs); par.money -= theirs; }
      else p.money -= bill;
    }
    if (p.money < 0) {
      p.hp = U.clamp(p.hp - 6);
      if (DATA.PREMODERN.includes(e.id)) { p.h = U.clamp(p.h - 5); S.log(p, 'You are in debt and often go hungry.', 'bad'); }
      else S.log(p, 'You are in debt. The letters from creditors keep coming.', 'bad');
      if (e.id === 'colonial' && p.money < -S.toVal(e.cost * 2) && U.chance(0.3)) { S.jail(p, 1); S.log(p, "You were thrown into debtors' prison.", 'bad'); }
    }
    // assets
    for (const as of p.assets) {
      as.val = Math.max(0, as.val * (1 + as.appr + (as.vol ? U.rand(-as.vol, as.vol) : 0)));
      if (as.inc) p.money += as.val * as.inc;
    }
    // relationships drift
    for (const [id, r] of Object.entries(p.rels)) {
      const o = S.P(+id);
      if (!o || !S.alive(o)) continue;
      r.c = U.clamp(r.c + U.ri(-4, 1) + S.hadd('relDrift', p, o, r));
      if ((r.k === 'lover' || r.k === 'fiance') && r.c < 20 && U.chance(0.4)) { r.k = 'ex'; S.log(p, `${o.first} broke up with you.`, 'love'); p.hp = U.clamp(p.hp - 8); }
      if (r.k === 'friend' && r.c < 8 && U.chance(0.3)) { delete p.rels[id]; S.log(p, `You and ${o.first} drifted apart.`, 'life'); }
    }
    const sp = S.spouse(p);
    if (sp && S.alive(sp)) {
      const r = S.rel(p, sp);
      if (r.c < 15 && S.law('divorce', e, p.cc) && U.chance(0.25 * S.hmul('npcMul', sp, 'divorce'))) { S.unmarry(p, sp); p.money *= 0.65; S.log(p, `${sp.first} divorced you and took a third of your savings.`, 'love'); p.hp = U.clamp(p.hp - 15); }
      else if (p.sex !== sp.sex) {
        const mo = p.sex === 'F' ? p : sp, ma = S.age(mo);
        if (ma >= 16 && ma <= 44 && !mo.kids.some(k => S.P(k)?.born === W().year) && U.chance(L.fert * 0.35 * (mo.kids.length > 4 ? 0.4 : 1) * (S.hooks.fert ? S.hooks.fert(mo, p.sex === 'M' ? p : sp) : 1))) {
          const c = S.birth(p.sex === 'M' ? p : sp, mo);
          S.log(p, `You welcomed a baby ${c.sex === 'M' ? 'boy' : 'girl'}: ${c.first}!`, 'family');
          S.rel(p, c).c = 90;
        }
      }

        if (ma > 46) { t = nope(me ? 'You are past the age of having children.' : `${mo.first} is past the age of having children.`); break; }

          const c = S.birth(p.sex === 'M' ? p : o, mo); S.rel(p, c).c = 90;
          t = `A baby ${c.sex === 'M' ? 'boy' : 'girl'}: ${c.first}!`;
          if (p.sp !== o.id) p.rep = U.clamp(p.rep - ([...DATA.PREMODERN, 'wars'].includes(e.id) ? 10 : 2));

    if (S.hooks.afterInteract) S.hooks.afterInteract(p, o, act, t);

  }

  /* ---------------- assets ---------------- */
  function market() { const e = S.era(); return e.assets.filter(S.inWindow).map(a => ({ a, price: S.toVal(a.price) })); }
  function buy(aid) {
    const p = S.me(), e = S.era(), m = market().find(x => x.a.id === aid);

  /* ---------------- random life events ---------------- */
  function eventOK(p, ev, a) {

  const afford = (p, fx) => { if (!fx) return true; const e = S.era(); const need = (fx.$ < 0 ? -fx.$ : 0) + (typeof fx.$c === 'number' && fx.$c < 0 ? -fx.$c * e.cost : 0); return S.cash(p) >= need; };
