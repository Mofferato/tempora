/* ---- genetics.js ---- */
/* =====================================================================
   GENETICS — genomes, inheritance, phenotype, population microevolution.
   A genome (p.g) is a set of allele pairs. Children get one allele of
   each pair from each parent (X-linked traits follow the X). Founders
   are sampled from their country's current allele frequencies, which
   drift, adapt and mix over the centuries (W.pops).
   ===================================================================== */

const Gen = (() => {
  const bit = f => (Math.random() < f ? 1 : 0);
  const pair = f => [bit(f), bit(f)];
  const bits = (n, f) => Array.from({ length: n }, () => bit(f));
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  // Frequencies of rarer single-gene traits, the same everywhere
  const UNI = { myo: 0.2, ast: 0.15, lon: 0.05, twn: 0.12, lh: 0.3, dim: 0.3, hem: 0.0003, hun: 0.0002 };
  const WORLD = 'ENG FRA ITA GRC EGY CHN JPN IND WAF MEX IRN RUS LEV MSP ANA MAG SCA AND'.split(' ');
  const KEYS = ['sk', 'hd', 'rd', 'eb', 'eg', 'cu', 'lac', 'sc', 'cf', 'cb'];

  /* ---------- population frequencies (with microevolution) ---------- */
  // y: the ancestral pool before later migrations, where a land has one (genT)
  function founding(cc, y) {
    const c = DATA.countries.find(x => x.id === cc);
    if (!c) return founding('ENG', y);
    if (y != null && c.genT) { const t = c.genT.find(([until]) => y <= until); if (t) { const g = DATA.genPools[t[1]]; return { ...g, ht: g.ht.slice(), bl: g.bl.slice() }; } }
    if (c.gen) return { ...c.gen, ht: c.gen.ht.slice() };
    const mix = c.mix === 'world' ? Object.fromEntries(WORLD.map(k => [k, 1 / WORLD.length])) : c.mix;
    return blend(mix);
  }
  function blend(mix) {
    const out = { ht: [0, 0], bl: [0, 0], rh: 0, nose: '' }, noses = new Set();
    for (const [k, w] of Object.entries(mix)) {
      const g = DATA.countries.find(x => x.id === k).gen;
      KEYS.forEach(key => (out[key] = (out[key] || 0) + g[key] * w));
      out.ht[0] += g.ht[0] * w; out.ht[1] += g.ht[1] * w; out.bl[0] += g.bl[0] * w; out.bl[1] += g.bl[1] * w; out.rh += g.rh * w;

      const drift = 0.004 * Math.sqrt(step) / Math.sqrt(1 + Math.log10(1 + (Sim.hooks.popAt ? Sim.hooks.popAt(c.id, year) : 5)));

      sk: loci(fg.sk, mg.sk), hd: loci(fg.hd, mg.hd), rd: p2('rd'), e1: p2('e1'), e2: p2('e2'), cu: loci(fg.cu, mg.cu),
      lac: p2('lac'), sc: p2('sc'), cf: p2('cf'), cb: x('cb'), hem: x('hem'), myo: p2('myo'), ast: p2('ast'), lon: p2('lon'),
      twn: p2('twn'), lh: p2('lh'), dim: p2('dim'), hun: p2('hun'), bl: [pick2(fg.bl), pick2(mg.bl)], rh: [pick2(fg.rh), pick2(mg.rh)],
      hs: (fg.hs + mg.hs) / 2 + gauss() * 0.7, fs: (fg.fs + mg.fs) / 2 + gauss() * 0.8,
      nose: Math.random() < 0.9 ? pick2([fg.nose, mg.nose]) : pick2(['straight', 'aquiline', 'button', 'broad', 'snub', 'roman', 'flat']),
    };
  }

  /* ---------- phenotype ---------- */
  const SKIN = [['porcelain', '#F7E1D2'], ['fair', '#F0CDB3'], ['light', '#E5B894'], ['light olive', '#D8A67F'], ['medium', '#C68E66'], ['olive', '#B07A52'], ['tan', '#966541'], ['brown', '#7B4F32'], ['dark brown', '#5E3A25'], ['deep brown', '#43291A']];
  const EYES = { 'dark brown': '#3B2416', brown: '#5B3A21', hazel: '#8A6A35', green: '#5E8A4E', blue: '#4A7FB5', grey: '#8C98A3' };
  function hairOf(g, age) {
    const skin = sum(g.sk) / 16, dark = Math.min(1, (sum(g.hd) / 6) * 0.75 + skin * 0.35);
    let n, hex;
    if (g.rd[0] && g.rd[1] && dark < 0.8) [n, hex] = dark > 0.55 ? ['auburn', '#7A3520'] : dark > 0.3 ? ['red', '#A5431F'] : ['strawberry blonde', '#C7824E'];
    else [n, hex] = dark < 0.12 ? ['platinum blonde', '#E9D9A6'] : dark < 0.25 ? ['blonde', '#D6B56E'] : dark < 0.4 ? ['dark blonde', '#B08A4E'] : dark < 0.55 ? ['light brown', '#8A6040'] : dark < 0.7 ? ['brown', '#5E3F28'] : dark < 0.85 ? ['dark brown', '#3F2A1C'] : ['black', '#1E1714'];
    if (age >= 75) return { n: 'white', hex: '#E8E6E1', base: n };
    if (age >= 55) return { n: `grey (once ${n})`, hex: '#A9A6A0', base: n };

    return {
      skin: { n: SKIN[skinI][0], hex: SKIN[skinI][1], i: skinI }, eyes: { n: eye, hex: EYES[eye] }, hair: { ...hair, type: hairType, curl },

  // Health consequences, used by engine hooks

    mort(p, a, eraId) {

    tick(p, a) {

  return { make, cross, phenotype, pop, evolve, founding, effects, SKIN, EYES, KEYS, mixHex };

/* ---- engine-world.js ---- */
/* =====================================================================
   ENGINE, part 3 — the world layer. Implements the engine hooks for
   countries, currencies, laws, social classes, genetics, new stats,
   nations, travel and emigration, organisations, pets, ambitions,
   narrative chapters and god-mode edits. No DOM access.
   ===================================================================== */

(() => {
  const S = Sim, H = S.hooks;
  const W = () => S.W;
  const yr = () => W().year;
  const C = id => DATA.countries.find(c => c.id === id);
  const tl = (list, y) => { for (const x of list || []) if (y <= x[0]) return x; return null; };
  const last = a => a && a[a.length - 1];
  const PREMODERN = DATA.PREMODERN;

  /* ---------------- countries ---------------- */
  const cName = (cc, y = yr()) => { const c = C(cc); if (!c) return 'distant lands'; const base = (tl(c.names, y) || last(c.names))[1]; return H.regName && y === yr() ? H.regName(cc, base) : base; };
  const cGov = (cc, y = yr()) => { const c = C(cc); if (!c) return ''; const base = (tl(c.names, y) || last(c.names))[2]; return H.regGov && y === yr() ? H.regGov(cc, base) : base; };
  const cCap = (cc, y = yr()) => { const c = C(cc); return c ? (tl(c.cap, y) || last(c.cap))[1] : ''; };
  function popAt(cc, y = yr()) {
    const pts = C(cc)?.pop; if (!pts) return 0;
    if (y <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) if (y <= pts[i][0]) { const [y0, v0] = pts[i - 1], [y1, v1] = pts[i]; return v0 + (v1 - v0) * (y - y0) / (y1 - y0); }
    return last(pts)[1];
  }
  const countriesAt = (y = yr()) => DATA.countries.filter(c => y >= c.from && (c.to == null || y <= c.to));
  H.popAt = popAt;
  H.defaultCC = y => U.wpick(DATA.countries.filter(c => y >= c.from && (c.to == null || y <= c.to) && c.region !== 'space'), c => Math.sqrt(popAt(c.id, y)) + 0.5)?.id || 'ENG';
  H.cur = (cc, y) => { const x = tl(C(cc)?.cur, y); return x ? { n: x[1], s: x[2], r: x[3] } : null; };
  H.pool = (e, cc, y) => { const x = tl(C(cc)?.pools, y); return x ? DATA.names[x[1]] : null; };
  H.law = (k, base, e, cc) => {
    const c = C(cc); if (!c) return base;
    let v = base;
    for (const [f, t, , fl] of c.laws || []) if (fl && k in fl && yr() >= f && yr() <= t) v = fl[k];
    return v;
  };
  const lawsFor = cc => (C(cc)?.laws || []).filter(([f, t]) => yr() >= f && yr() <= t).map(x => x[2]);

  /* ---------------- social classes ---------------- */
  function ladder(cc, y = yr()) {
    const o = (C(cc)?.cls || []).find(([f, t]) => y >= f && y <= t);
    return o ? o[2] : DATA.classLadders[S.eraOf(y).id];
  }
  const className = p => ladder(p.cc)[U.clamp(p.cls ?? 2, 0, 6)];
  // Where someone "should" stand: wealth owned, what they earn, titles, marriage, and for
  // young adults still at home, their parents. Tuned with tools/sim.js so that a typical
  // life ends near the middle of the ladder and the top two rungs stay rare.
  function classTarget(p, e) {
    const cost = S.toVal(e.cost), a = S.age(p);
    const wealth = S.netWorth(p) / cost;
    const earn = (p.job ? p.job.pay * S.rankPay(p.job) : p.retired && e.life.retire ? cost * 0.6 : 0) / cost;
    const wt = wealth < -3 ? 0 : wealth < 1 ? 1 : wealth < 6 ? 2 : wealth < 25 ? 3 : wealth < 100 ? 4 : 5;
    const it = earn <= 0 ? 0 : earn < 1 ? 1 : earn < 2.2 ? 2 : earn < 5 ? 3 : earn < 11 ? 4 : 5;
    let t = Math.max(wt, Math.min(it, wealth < 6 ? 2 : wealth < 25 ? 3 : 4));
    if (wt <= 1 && it >= 2) t = Math.max(t, 2);
    if (p.edu >= 3 && earn >= 2.2) t = Math.max(t, 3);
    if (p.title) t = Math.max(t, /Lord|Lady|Prince|Princess|King|Queen|Emperor|Empress|Pharaoh|Shah|Sultan|Tsar/.test(p.title) ? 5 : 4);
    if (p.office) t = Math.max(t, p.office.lvl >= 4 ? 5 : p.office.lvl >= 2 ? 4 : 3);
    const sp = S.spouse(p);

    if (PREMODERN.includes(e.id) && p.clsBirth != null && !p.title && !p.office) t = U.clamp(t, p.clsBirth - 1, p.clsBirth + 1);
    if (sp && S.alive(sp)) t = Math.max(t, Math.min(sp.cls ?? 0, 5) - (PREMODERN.includes(e.id) ? 0 : 1));
    if (a < 25 && !sp) { const par = Math.max(...S.parents(p).filter(S.alive).map(x => x.cls ?? 0), -1); if (par >= 0) t = Math.max(t, Math.min(par, 5) - (a >= 21 ? 1 : 0)); }
    return U.clamp(t, 0, 5);
  }

  // does not pile up without limit; in return a higher station is a little happier.
  const LIFESTYLE = [0.8, 0.9, 1, 1.25, 1.7, 2.6, 4];
  S.addHook('costMul', p => LIFESTYLE[U.clamp(p.cls ?? 2, 0, 6)], 'mul');   // most of what people earn they spend too (engine-player.js)
  S.addHook('hpTarget', p => ((p.cls ?? 2) - 2) * 1.2, 'add');
  function classTick(p, e) {
    if ((p.cls ?? 2) >= 6) return;

  }

  /* ---------------- jobs, activities, labels ---------------- */
  const jobCache = {};

  };
  const localCache = {};
  H.jobMap = (j, cc) => {
    cc = cc || S.me()?.cc;
    const m = DATA.jobLocal[j.id]; if (!m || !cc) return j;
    const t = cc in m ? m[cc] : m['*'];
    if (t === null) return null;
    if (t === j.t) return j;
    const key = j.id + cc;
    return (localCache[key] ||= { ...j, t, tf: null, grant: null });
  };
  H.jobWhy = (p, j) => {
    const w = [];
    if (j.cls && (p.cls ?? 2) < j.cls) w.push(`class: ${ladder(p.cc)[j.cls].toLowerCase()}`);
    if (j.im && (p.im ?? 50) < j.im) w.push(`imagination ${j.im}`);
    if (/pilot|captain|astronaut|cosmonaut/i.test(j.t) && Gen.effects.colourBlind(p)) w.push('normal colour vision');

  };
  H.acts = (p, e) => (DATA.countryActs[p.cc] || []).map(a => ({ ...a, cost: Math.round(e.cost * (a.c || 0) * 100) / 100 }));

    create(p, act, e) {

        return `People loved it. It earned you ${S.money(got)} and a little fame.`;
      }
      p.hp = U.clamp(p.hp + 2);
      return 'Nobody much noticed, but you made it, and that matters.';
    },
  };

  /* ---------------- people: creation, yearly body and mind ---------------- */
  const mid = (a, b, lo, hi) => (a != null && b != null ? U.clamp(Math.round((a + b) / 2 + U.ri(-15, 15)), 1, 100) : U.ri(lo, hi));
  H.onCreate = (p, o) => {
    const fa = S.P(p.fa), mo = S.P(p.mo);

    p.g = fa?.g && mo?.g ? Gen.cross(fa.g, mo.g, p.sex) : Gen.make(Gen.pop(W(), p.cc), p.sex);

  H.fx = (p, fx) => {
    if (fx.royal) {

  /* ---------------- nations ---------------- */
  function nat() {

    return w.nat;
  }
  function relOf(a, b) {
    if (a === b) return 100;
    const w = W(), k = [a, b].sort().join('|'); w.rel ||= {};
    if (w.rel[k] == null) w.rel[k] = C(a)?.region === C(b)?.region ? U.ri(-10, 45) : U.ri(-20, 30);

  }
  const addRel = (a, b, d) => { const k = [a, b].sort().join('|'); W().rel[k] = U.clamp(relOf(a, b) + d, -100, 100); };
  const warsOf = cc => S.activeWars().filter(h => !h.where || h.where.includes(cc));
  function natTick() {
    const n = nat();
    for (const [cc, s] of Object.entries(n)) s.stab = U.clamp(s.stab + U.rand(-3, 3) + (62 - s.stab) * 0.05 - (warsOf(cc).length ? 3 : 0));
    for (const h of S.activeWars()) if (h.where && h.y === yr()) for (const a of h.where) for (const b of h.where) if (a < b && U.chance(0.5)) addRel(a, b, -U.ri(10, 30));
    for (const k of Object.keys(W().rel)) W().rel[k] += (0 - W().rel[k]) * 0.01 + U.rand(-1.5, 1.5);
  }
  function nations() {
    const p = S.me(), n = nat();
    return countriesAt().map(c => ({
      cc: c.id, c, name: cName(c.id), gov: cGov(c.id), cap: cCap(c.id), pop: popAt(c.id), cur: H.cur(c.id, yr()) || S.era().cur,
      stab: Math.round(n[c.id].stab), rel: c.id === p.cc ? 100 : Math.round(relOf(p.cc, c.id)), wars: warsOf(c.id).map(h => h.n), home: c.id === p.cc,
    })).sort((a, b) => (b.home - a.home) || b.pop - a.pop);
  }
  const inOffice = p => (p.cls ?? 0) >= 5 || /senator|governor|lord|lady|mandarin|scholar-official|courtier|diplomat|administrator|council/i.test(p.job?.t || '') || (p.orgs || []).some(o => (DATA.orgs.find(x => x.id === o.id)?.k === 'Power' || o.id === 'party') && o.rank >= 1);
  function tripCost(p, cc) {
    const a = C(p.cc), b = C(cc), e = S.era();
    const mult = a?.region === 'space' || b?.region === 'space' ? 2 : a?.region !== b?.region ? 0.25 : 0.08;
    return S.toVal(e.cost * mult);
  }
  const enemies = (a, b) => S.activeWars().some(h => h.where && h.where.includes(a) && h.where.includes(b) && a !== b);
  function travel(cc) {
    const p = S.me(), e = S.era(), c = C(cc);
    if (cc === p.cc) return 'You are already here.';
    if (enemies(p.cc, cc)) return 'The borders are closed: your countries are at war.';
    if (S.law('noEmigrate', e, p.cc)) return 'The law forbids you from leaving the country.';
    if (S.age(p) < 12) return 'You are too young to travel alone.';
    if (p.did.travel) return 'You already travelled this year.';
    const cost = tripCost(p, cc);
    if (p.money < cost) return `The journey costs ${S.money(cost)}. You cannot afford it.`;
    p.did.travel = 1; p.money -= cost;
    S.applyFx(p, { hp: [6, 12], im: [2, 5], sm: 1 });
    if (!p.travels.includes(cc)) p.travels.push(cc);
    let t = `You travelled to ${cName(cc)} and saw ${cCap(cc)}.`;
    if (U.chance(0.4)) {
      const o = S.mkPerson({ cc, near: p, born: U.add(yr(), -U.clamp(S.age(p) + U.ri(-8, 8), 12, 90)) });
      p.rels[o.id] = { k: 'friend', c: U.ri(45, 75) }; o.rels[p.id] = { k: 'friend', c: U.ri(45, 75) };
      t += ` You befriended ${o.first}, a local.`;
    }
    if (U.chance(PREMODERN.includes(e.id) ? 0.12 : 0.03)) { p.h = U.clamp(p.h - U.ri(5, 15)); t += ' You came home with a foreign fever.'; }
    S.log(p, t, 'good');
    return t;
  }
  function emigrate(cc, family) {
    const p = S.me(), e = S.era();
    if (cc === p.cc) return 'You already live here.';
    if (enemies(p.cc, cc)) return 'You cannot move to a country your own is at war with.';
    if (S.age(p) < 16) return 'You are too young to move abroad on your own.';
    const cost = tripCost(p, cc) * 3;
    if (p.money < cost) return `Moving costs ${S.money(cost)}. You cannot afford it.`;
    if (S.law('noEmigrate', e, p.cc)) {
      if (!U.chance(0.35)) { S.jail(p, U.ri(2, 5)); S.log(p, 'You were caught trying to leave the country and imprisoned.', 'bad'); return 'Caught at the border. You were imprisoned.'; }
      p.rep = U.clamp(p.rep - 5);
    }
    p.money -= cost;
    const from = p.cc; p.cc = cc;
    const moved = [];
    if (family) for (const o of [S.spouse(p), ...S.kids(p).filter(k => S.age(k) < 18)]) if (o && S.alive(o)) { o.cc = cc; moved.push(o.first); }
    if (p.job && !['digital', 'near', 'far'].includes(e.id)) { S.log(p, `You left your job as ${p.job.t.toLowerCase()} behind.`, 'work'); p.job = null; }
    S.applyFx(p, { rep: -5, mh: -3, hp: [-4, 6], im: 3 });
    S.known(p).filter(o => S.alive(o) && o.cc === from).forEach(o => { if (p.rels[o.id]) p.rels[o.id].c = U.clamp(p.rels[o.id].c - 8); });
    if (!p.travels.includes(cc)) p.travels.push(cc);
    const t = `You emigrated from ${cName(from)} to ${cName(cc)}${moved.length ? ` with ${moved.join(', ')}` : ''}.`;
    S.log(p, t, 'switch');
    return t;
  }
  function invest(cc, share) {
    const p = S.me(), e = S.era(), s = nat()[cc];
    const amt = S.toVal(e.cost * share);
    if (S.age(p) < 18) return 'You must be an adult to invest.';
    if (p.money < amt) return `You need ${S.money(amt)} to invest.`;
    p.money -= amt;
    p.assets.push({ uid: W().nid++, id: 'venture-' + cc, t: `${C(cc).adj} venture`, kind: 'stock', val: amt, appr: 0.03 + (s.stab - 55) / 800, inc: 0.02, vol: 0.35 * (1 - s.stab / 150), era: e.id, y: yr() });
    S.log(p, `You invested ${S.money(amt)} in ${cName(cc)}.`, 'money');
    return `Invested ${S.money(amt)}.`;
  }
  function diplomacy(cc, act) {
    const p = S.me(), e = S.era();
    if (!inOffice(p)) return 'Only people in high office can conduct diplomacy.';
    if (p.did['dip:' + cc]) return 'You already dealt with them this year.';
    p.did['dip:' + cc] = 1;
    if (act === 'embassy') { const d = U.ri(4, 14); addRel(p.cc, cc, d); S.applyFx(p, { fm: 2, rep: 1 }); return `Your embassy warmed relations with ${cName(cc)} (+${d}).`; }
    if (act === 'aid') { const c = S.toVal(e.cost * 0.5); if (p.money < c) return `Aid costs ${S.money(c)}.`; p.money -= c; addRel(p.cc, cc, 12); nat()[cc].stab = U.clamp(nat()[cc].stab + 4); S.applyFx(p, { rep: 3, fm: 2 }); return 'Your aid was gratefully received.'; }
    if (act === 'denounce') { addRel(p.cc, cc, -U.ri(8, 18)); S.applyFx(p, { fm: 3, rep: -1 }); return `You denounced ${cName(cc)}. Crowds cheered, diplomats winced.`; }
    return '';
  }

  /* ---------------- organisations ---------------- */
  const orgsAvail = p => DATA.orgs.filter(o => S.inWindow(o) && (!o.cc || o.cc.includes(p.cc)));
  function orgWhy(p, o) {
    const r = o.req || {}, w = [];
    if (S.age(p) < (r.age || 14)) w.push(`age ${r.age || 14}+`);
    if (r.sm && p.sm < r.sm) w.push(`smarts ${r.sm}`);
    if (r.lk && p.lk < r.lk) w.push(`looks ${r.lk}`);
    if (r.rep && p.rep < r.rep) w.push(`reputation ${r.rep}`);
    if (r.edu && p.edu < r.edu) w.push('more schooling');
    if (r.cls && (p.cls ?? 2) < r.cls) w.push('higher class');
    if (r.sex && r.sex !== p.sex) w.push(r.sex === 'M' ? 'men only' : 'women only');
    if (r.job && !p.job) w.push('a job');
    return w;
  }
  function orgAct(id, act) {
    const p = S.me(), e = S.era(), o = DATA.orgs.find(x => x.id === id), m = p.orgs.find(x => x.id === id);
    if (act === 'join') {
      if (m) return 'You are already a member.';
      const why = orgWhy(p, o); if (why.length) return `They need: ${why.join(', ')}.`;
      p.orgs.push({ id, rank: 0, y: yr() }); S.log(p, `You joined ${o.n}.`, 'good'); return `Welcome to ${o.n}.`;
    }
    if (!m) return 'You are not a member.';
    if (p.did['org:' + id + act]) return 'You already did that this year.';
    p.did['org:' + id + act] = 1;
    if (act === 'attend') {
      S.applyFx(p, { hp: 3, ...Object.fromEntries(Object.entries(o.perk).filter(([k]) => k !== '$')) });
      let t = `You took part in the life of ${o.n}.`;
      if (U.chance(0.4)) { const f = S.newFriend(p); t += ` You got to know ${f.first}.`; }
      return t;
    }
    if (act === 'donate') { const c = S.toVal(e.cost * 0.1); if (p.money < c) return `A worthwhile gift would be ${S.money(c)}.`; p.money -= c; p.rep = U.clamp(p.rep + 3); m.pts = (m.pts || 0) + 2; return 'Your generosity was noted.'; }
    if (act === 'rise') {
      if (m.rank >= o.ranks.length - 1) return 'You already lead it.';
      const odds = U.clamp(0.15 + (yr() - m.y) * 0.04 + (m.pts || 0) * 0.05 + (p.rep - 40) / 200, 0.05, 0.85);
      if (U.chance(odds)) { m.rank++; S.applyFx(p, { rep: 3, fm: 2 }); S.log(p, `You became ${o.ranks[m.rank].toLowerCase()} of ${o.n}.`, 'good'); return `You are now ${o.ranks[m.rank]}.`; }
      m.pts = (m.pts || 0) + 1; return 'Not yet. Keep showing up.';
    }
    if (act === 'leave') { p.orgs = p.orgs.filter(x => x.id !== id); S.log(p, `You left ${o.n}.`, 'life'); return 'You left.'; }
    return '';
  }
  function orgsTick(p, e) {
    for (const m of (p.orgs || []).slice()) {
      const o = DATA.orgs.find(x => x.id === m.id);
      if (!o || !S.inWindow(o)) { p.orgs = p.orgs.filter(x => x !== m); S.log(p, `${o ? o.n[0].toUpperCase() + o.n.slice(1) : 'Your society'} has passed into history.`, 'world'); continue; }
      p.money -= S.toVal(e.cost * (o.fee || 0));
      const k = (m.rank + 1) * 0.5;
      if (o.perk.$) p.money += S.toVal(e.cost * o.perk.$ * (m.rank + 1));
      for (const [s, v] of Object.entries(o.perk)) if (s !== '$') p[s] = U.clamp((p[s] ?? 50) + v * k * 0.5);
      if (o.risk && U.chance(o.risk)) { p.h = U.clamp(p.h - U.ri(10, 25)); S.log(p, `Danger came with membership of ${o.n}. You were hurt.`, 'bad'); }
    }
  }

  /* ---------------- pets ---------------- */
  const petsOf = p => Object.values(W().pets || {}).filter(x => x.owner === p.id && x.died == null);
  const petSpec = k => DATA.pets.find(x => x.id === k);
  const petsAvail = p => DATA.pets.filter(x => S.inWindow(x));
  function adoptPet(kind, name) {
    const p = S.me(), e = S.era(), sp = petSpec(kind);
    if (S.age(p) < 5) return 'You are too young to look after a pet.';
    if (sp.cls && (p.cls ?? 2) < sp.cls) return `Keeping a ${sp.n.toLowerCase()} is for the upper classes here.`;
    const cost = S.toVal(e.cost * sp.cost);
    const payer = S.age(p) < 18 ? (S.parents(p).filter(S.alive).sort((a, b) => b.money - a.money)[0] || p) : p;
    if (payer.money < cost) return `A ${sp.n.toLowerCase()} costs ${S.money(cost)}.`;
    payer.money -= cost;
    W().pets ||= {};
    const pet = { id: W().nid++, kind, n: (name || '').trim() || U.pick(DATA.petNames), born: yr(), died: null, owner: p.id, h: 90, bond: 55, tricks: 0, life: U.ri(sp.life[0], sp.life[1]) };
    W().pets[pet.id] = pet;
    p.flags.pets = (p.flags.pets || 0) + 1;
    S.log(p, `You brought home a ${sp.n.toLowerCase()} and named it ${pet.n}.`, 'family');
    return `Meet ${pet.n}!`;
  }
  function petAct(id, act) {
    const p = S.me(), e = S.era(), pet = W().pets[id]; if (!pet || pet.died != null) return '';
    if (p.did['pet:' + id + act]) return `${pet.n} has had enough of that for this year.`;
    p.did['pet:' + id + act] = 1;
    const sp = petSpec(pet.kind), bump = (b, fx, t) => { pet.bond = U.clamp(pet.bond + b); if (fx) S.applyFx(p, fx); return t; };
    switch (act) {
      case 'play': return bump(10, { hp: 3 }, `You played with ${pet.n}.`);
      case 'walk': return bump(8, { h: 2, hp: 2 }, `You and ${pet.n} walked for miles.`);
      case 'groom': pet.h = U.clamp(pet.h + 5); return bump(6, null, `${pet.n} looks magnificent.`);
      case 'feed': pet.h = U.clamp(pet.h + 3); return bump(5, { hp: 1 }, `${pet.n} loved the treat.`);
      case 'ride': return bump(6, { hp: 4, rep: 1 }, `You rode ${pet.n} across the countryside.`);
      case 'hunt': return bump(5, { rep: 2 }, `${pet.n} brought down a hare. Admirers gathered.`);
      case 'milk': return bump(3, { h: 2 }, `${pet.n} gave good milk, grudgingly.`);
      case 'teach': return bump(4, { im: 1 }, U.chance(0.4) ? `${pet.n} learned a word you would rather it had not.` : `${pet.n} can now say your name.`);
      case 'fly': return bump(6, { fm: 2, hp: 4 }, `${pet.n} looped over the rooftops. Crowds pointed.`);
      case 'upgrade': { const c = S.toVal(e.cost * 0.05); if (p.money < c) return `Upgrades cost ${S.money(c)}.`; p.money -= c; pet.h = 100; return bump(4, null, `${pet.n} is running the latest firmware.`); }
      case 'train': pet.tricks++; if (pet.tricks >= 5 && U.chance(0.3)) S.applyFx(p, { fm: 2 }); return bump(5, null, `${pet.n} learned a new trick (${pet.tricks} so far).`);
      case 'vet': { const c = S.toVal(e.cost * 0.03); if (p.money < c) return `The ${PREMODERN.includes(e.id) ? 'animal doctor' : 'vet'} costs ${S.money(c)}.`; p.money -= c; pet.h = U.clamp(pet.h + 25); return `${pet.n} feels much better.`; }
      case 'rehome': pet.owner = null; pet.died = yr(); pet.gone = 1; S.log(p, `You found ${pet.n} a new home.`, 'life'); p.hp = U.clamp(p.hp - 4); return `${pet.n} has a new home.`;

  }
  function petsTick() {

      pet.bond = U.clamp(pet.bond - 5); pet.h = U.clamp(pet.h - (age > pet.life * 0.7 ? 6 : 1) + U.ri(-2, 2));

        pet.died = yr();
        if (owner && owner.id === W().playerId) { S.log(owner, `Your ${sp.n.toLowerCase()} ${pet.n} died at ${age}.`, 'death'); S.applyFx(owner, { hp: -Math.round(3 + pet.bond / 10), mh: -Math.round(1 + pet.bond / 20) }); }
        continue;
      }
      if (owner && S.alive(owner) && pet.bond > 30) {
        const k = (pet.bond - 30) / 50;                     // 0 at a weak bond, 1.4 at the strongest
        S.applyFx(owner, Object.fromEntries(Object.entries(sp.bonus).map(([s, v]) => [s, Math.round(v * k * 10) / 10])));
        const lonely = !S.spouse(owner) && Object.values(owner.rels).filter(r => r.k === 'friend' && r.c >= 40).length < 2;
        if (lonely) S.applyFx(owner, { mh: 1.5 * k, hp: 1 * k });
        if (/dog|robodog/.test(pet.kind)) owner.flags.dogWalks = W().year;
      }
    }
  }

  /* ---------------- ambitions, chapters, story ---------------- */
  const hasNarrative = () => ['narrative', 'god'].includes(W().mode);
  const CHAPTERS = [[0, 'I', 'Beginnings'], [6, 'II', 'Childhood'], [13, 'III', 'Coming of Age'], [18, 'IV', 'Setting Out'], [30, 'V', 'The Middle of the Road'], [50, 'VI', 'Harvest'], [70, 'VII', 'Twilight'], [90, 'VIII', 'The Long Evening']];
  function chapterText(p, a) {
    const tier = k => DATA.statTier(k, p[k] ?? 50).name.toLowerCase();
    const where = cName(p.cc), cls = className(p).toLowerCase();
    const opener = a === 0 ? `You are born in ${U.fmtYearAD(yr())}, in ${where}, into a ${cls} family.` : `It is ${U.fmtYearAD(yr())} in ${where}, and you are ${a}.`;
    const body = a < 13 ? `Your health is ${tier('h')} and your mind ${tier('sm')}.` : `People would call you ${tier('lk')} to look at and ${tier('sm')} of mind; your spirit is ${tier('mh')}.`;
    const wars = warsOf(p.cc).map(h => h.n);
    const world = wars.length ? ` The ${wars[0]} darkens everything.` : ` The ${S.era().name} era ${a === 0 ? 'waits for you' : 'goes on around you'}.`;
    return opener + ' ' + body + world;
  }
  function chaptersTick(p) {
    if (!hasNarrative()) return;
    const a = S.age(p), ch = CHAPTERS.find(c => c[0] === a && a > 0);

    const text = chapterText(p, a);
    S.log(p, `Chapter ${ch[1]} · ${ch[2]}. ${text}`, 'chapter');
    S.prompt({ title: `Chapter ${ch[1]}`, text: `${ch[2]}\n\n${text}`, chapter: true, choices: [{ l: 'Turn the page', go: () => '' }] });
  }
  function ambitionTick(p) {
    const a = S.age(p);
    if (a === 16 && !p.amb && !p.flags.ambAsked) {
      p.flags.ambAsked = 1;
      const opts = U.shuffle(DATA.ambitions).slice(0, 4);
      S.prompt({ title: 'A life’s ambition', text: 'You are sixteen. What do you want from your life?', choices: [
        ...opts.map(o => ({ l: o.n, go: () => { p.amb = o.id; S.log(p, `Your ambition: ${o.n.toLowerCase()}. ${o.d}`, 'ach'); return `Ambition set: ${o.n}.`; } })),
        { l: 'Take life as it comes', go: () => { S.log(p, 'You decided to take life as it comes.', 'life'); return 'No grand plans.'; } }] });
    }
    if (p.amb && !p.flags.ambDone) {
      const o = DATA.ambitions.find(x => x.id === p.amb);
      if (o && o.test(p, S)) { p.flags.ambDone = 1; S.applyFx(p, { hp: 15, mh: 10, rep: 5 }); S.log(p, `You achieved your life's ambition: ${o.n.toLowerCase()}!`, 'ach'); }
    }
  }
  function story(p) {
    const out = [];
    let cur = null;
    for (const l of p.log) {
      if (l.k === 'quiet') continue;
      const ch = [...CHAPTERS].reverse().find(c => l.a >= c[0]);
      if (!cur || cur.n !== ch[1]) { cur = { n: ch[1], title: ch[2], lines: [] }; out.push(cur); }
      if (l.k === 'chapter') { cur.intro = l.t.replace(/^Chapter [IVX]+ · [^.]+\. /, ''); continue; }
      const t = l.t.replace(/^You /, 'you ').replace(/^Your /, 'your ');
      cur.lines.push(l.k === 'world' ? `In ${U.fmtYearAD(l.y)}, ${t.charAt(0).toLowerCase() + t.slice(1)}` : `At ${l.a}, ${t.charAt(0).toLowerCase() === t.charAt(0) ? t : t.charAt(0).toLowerCase() + t.slice(1)}`);
    }
    return out;
  }

  /* ---------------- modes, world setup, migration ---------------- */
  function ensurePerson(p) {
    p.cc ||= 'ENG';
    if (!p.g) p.g = Gen.make(Gen.pop(W(), p.cc), p.sex);
    p.mh ??= U.ri(55, 85); p.fe ??= Gen.effects.fertility(p); p.im ??= U.ri(20, 80); p.wp ??= U.ri(25, 80); p.fm ??= Math.round((p.rep ?? 10) / 5);
    p.bmi ??= 22; p.cls ??= 2; p.orgs ||= []; p.travels ||= [];
  }
  function ensureWorld() {
    const w = W();
    w.mode ||= 'narrative'; w.pets ||= {}; w.auto ||= {}; w.rel ||= {};
    nat();
  }
  H.migrate = w => { ensureWorld(); Object.values(w.people).forEach(ensurePerson); };
  H.preYear = (p, e) => {
    ensureWorld();
    natTick();
    if (yr() % 5 === 0) Gen.evolve(W(), yr(), 5);
    petsTick();
    orgsTick(p, e);
  };
  H.postYear = (p, e) => { classTick(p, e); ambitionTick(p); chaptersTick(p); };

  /* ---------------- god-mode edits ---------------- */
  const god = {
    stat(id, k, v) { const p = S.P(id); if (p) p[k] = U.clamp(+v); },
    money(id, v) { const p = S.P(id); if (p) p.money = +v * S.curNow(p.cc).r; },
    cls(id, v) { const p = S.P(id); if (p) p.cls = U.clamp(+v, 0, 6); },
    country(id, cc) { const p = S.P(id); if (p) p.cc = cc; },
    look(id, k, v) { const p = S.P(id); if (!p) return; p.phx ||= {}; if (v === '' || v == null) delete p.phx[k]; else p.phx[k] = v; },
    title(id, t) { const p = S.P(id); if (p) p.title = t || null; },
    kill(id) { const p = S.P(id); if (p && S.alive(p) && p.id !== W().playerId) S.kill(p, 'the will of the gods'); },
    revive(id) { const p = S.P(id); if (p && !S.alive(p)) { p.died = null; p.cause = null; p.h = 60; p.sick = []; S.log(p, 'Brought back from death.', 'switch'); } },
    closeness(id, v) { const p = S.me(), o = S.P(id); if (o) S.rel(p, o).c = U.clamp(+v); },
    spawn(kind) {
      const p = S.me(), a = S.age(p);
      if (kind === 'friend') return S.newFriend(p);
      if (kind === 'lover') return S.newLover(p);
      if (kind === 'rival') return S.newFriend(p, 'enemy');
      if (kind === 'child') { const o = S.mkPerson({ near: p, born: yr(), last: W().dyn.name, fa: p.sex === 'M' ? p.id : S.spouse(p)?.id, mo: p.sex === 'F' ? p.id : S.spouse(p)?.id }); if (!o.fa && !o.mo) { p.kids.push(o.id); o[p.sex === 'M' ? 'fa' : 'mo'] = p.id; } S.rel(p, o).c = 90; return o; }
      if (kind === 'sibling') { const [fa, mo] = [S.P(p.fa), S.P(p.mo)]; if (!fa && !mo) return null; const o = S.childOf(fa, mo, U.add(yr(), -U.ri(0, Math.max(0, a + 5)))); S.rel(p, o).c = 70; return o; }
      return null;
    },
  };

  const pheno = p => {
    const P = Gen.pop(W(), p.cc || 'ENG');

    { id: 'ambition', n: 'Dream Fulfilled', d: 'Achieve your life’s ambition.', test: p => !!p.flags.ambDone },

/* =====================================================================
   PERSONALITY — MBTI types and character traits.
   Everyone has four type axes (E/I, N/S, T/F, J/P, each -1..1) and up to
   five traits. Both are partly inherited, and traits grow out of what a
   person actually does: pick brave options and you become brave. They
   feed back into happiness, work, relationships, romance, event odds,
   accidents, crime, NPC marriages and divorces, and what an NPC (or the
   auto-player "in character") chooses.

const Pers = (() => {
  const S = Sim;
  const T = id => DATA.traits.find(t => t.id === id);
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const cl = v => Math.max(-1, Math.min(1, v));
  const typeOf = ax => `${ax.e >= 0 ? 'E' : 'I'}${ax.n >= 0 ? 'N' : 'S'}${ax.t >= 0 ? 'T' : 'F'}${ax.j >= 0 ? 'J' : 'P'}`;
  const has = (p, id) => !!p.pers && p.pers.tr.includes(id);
  const capAt = a => (a < 6 ? 1 : a < 13 ? 2 : a < 18 ? 3 : a < 30 ? 4 : 5);

  /* ---------- creation and growth ---------- */
  function traitWeight(t, ax) { let w = 1; for (const [k, v] of Object.entries(t.ax || {})) w *= Math.exp(v * ax[k] * 1.6); return w; }
  function pickTrait(p, prefer) {
    const tr = p.pers.tr, pool = DATA.traits.filter(t => !tr.includes(t.id) && !tr.includes(t.o));
    if (!pool.length) return null;
    return U.wpick(pool, t => traitWeight(t, p.pers.ax) * (1 + (p.pers.sc?.[t.id] || 0)) * (prefer?.includes(t.id) ? 3 : 1));
  }
  function make(p, fa, mo) {
    const pa = [fa, mo].filter(x => x && x.pers);
    const ax = {};
    for (const k of ['e', 'n', 't', 'j']) {
      const inh = pa.length ? pa.reduce((s, x) => s + x.pers.ax[k], 0) / pa.length : 0;
      ax[k] = cl(inh * 0.45 + gauss() * 0.5);
    }
    p.pers = { ax, tr: [], sc: {}, type: typeOf(ax) };
    const inherited = pa.flatMap(x => x.pers.tr).filter(() => Math.random() < 0.3);
    const n = S.age(p) >= 18 ? U.ri(3, 4) : Math.min(capAt(S.age(p)), 2);
    for (let i = 0; i < n; i++) { const t = pickTrait(p, inherited); if (t) p.pers.tr.push(t.id); }
    // dynasty traits and the family's temperament can tilt a newborn (see legacy.js)
    if (S.hooks.persBorn) S.hooks.persBorn(p);
  }
  function ensure(p) {
    if (p.pers && p.pers.ax) { p.pers.sc ||= {}; p.pers.type = typeOf(p.pers.ax); return; }
    make(p, S.P(p.fa), S.P(p.mo));
  }

  // A choice or habit nudges a trait. Enough nudges and it becomes who you are.
  function nudge(p, id, w = 1, quiet) {
    if (!p.pers || !T(id)) return;
    const t = T(id), sc = p.pers.sc;
    sc[id] = (sc[id] || 0) + w;
    if (t.o) sc[t.o] = Math.max(0, (sc[t.o] || 0) - w * 0.7);
    for (const [k, v] of Object.entries(t.ax || {})) p.pers.ax[k] = cl(p.pers.ax[k] + v * 0.01 * w);
    const a = S.age(p), tr = p.pers.tr;
    if (tr.includes(id)) return;
    if (t.o && tr.includes(t.o)) {
      if (sc[id] >= 7) {
        tr.splice(tr.indexOf(t.o), 1, id); sc[id] = 2;
        if (!quiet) S.log(p, `You have changed: people no longer call you ${T(t.o).n.toLowerCase()}, but ${t.n.toLowerCase()}.`, 'good');
      }
      return;
    }
    if (sc[id] >= 4 && a >= 4 && tr.length < capAt(a) + 1) {
      tr.push(id); sc[id] = 1;
      if (!quiet) S.log(p, `A trait has taken root: you are ${t.n.toLowerCase()}. ${t.d}`, 'good');
    }
    p.pers.type = typeOf(p.pers.ax);
  }

  /* ---------- compatibility and job fit ---------- */
  const GOLDEN = ['INFJ ENFP', 'INFJ ENTP', 'INTJ ENFP', 'INTJ ENTP', 'INFP ENFJ', 'INFP ENTJ', 'INTP ENTJ', 'INTP ESTJ', 'ISFJ ESFP', 'ISFJ ESTP', 'ISTJ ESFP', 'ISTJ ESTP', 'ISFP ENFJ', 'ISFP ESFJ', 'ISTP ESFJ', 'ISTP ESTJ'];
  function compat(a, b) {
    if (!a?.pers || !b?.pers) return 0;
    const A = a.pers, B = b.pers;
    let c = 0;
    c += (Math.sign(A.ax.n) === Math.sign(B.ax.n) ? 0.25 : -0.15);
    c += (Math.sign(A.ax.t) === Math.sign(B.ax.t) ? 0.1 : 0);
    c += 0.05;
    const pair = [A.type, B.type].sort().join(' ');
    if (GOLDEN.some(g => g.split(' ').sort().join(' ') === pair)) c += 0.3;
    for (const t of A.tr) {
      if (B.tr.includes(t)) c += 0.12;
      const o = T(t)?.o; if (o && B.tr.includes(o)) c -= 0.2;
    }
    if (A.tr.includes('kind') || B.tr.includes('kind')) c += 0.08;
    if (A.tr.includes('cruel') || B.tr.includes('cruel')) c -= 0.15;
    if (A.tr.includes('jealous') && B.tr.includes('fickle')) c -= 0.25;
    return cl(c);
  }
  const FIT = [
    [/engineer|programmer|developer|scientist|astronom|inventor|data|archivist|codebreaker|mechanic|technician|philosoph|researcher|accountant|banker|stockbroker|surgeon|geolog|navigator/i, 't', 1],
    [/nurse|teacher|priest|monk|nun|clergy|healer|care|therap|charity|midwife|shaman|imam|mullah/i, 't', -1],
    [/merchant|trader|sales|shopkeeper|innkeeper|anchor|actor|star|senator|governor|founder|manager|lawyer|courtier|entertainer|musician|performer|diplomat|chief|creator|influencer|politic|barista/i, 'e', 1],
    [/scribe|programmer|archivist|farmer|shepherd|researcher|writer|painter|sculptor|weaver|potter|monk|nun|embalmer|hydroponic|miner|data/i, 'e', -1],
    [/artist|painter|sculptor|musician|poet|designer|architect|inventor|writer|actor|creator|philosoph|griot|troubadour|perfumer|shaman|dreamer/i, 'n', 1],
    [/farmer|miner|smith|carpenter|mason|soldier|legionary|mechanic|porter|hand|worker|labourer|fisher|hunter|gatherer|builder|electrician|driver|servant|peasant|herder|hauler/i, 'n', -1],
    [/clerk|accountant|lawyer|judge|official|officer|administrator|banker|police|executive|scribe|secretary/i, 'j', 1],
    [/musician|artist|founder|trader|crypto|content|streamer|entertainer|explorer|prospector|mercenary|gladiator|athlete|cowboy/i, 'j', -1],
  ];
  const TFIT = [[/soldier|legionary|knight|warrior|athlete|gladiator|miner|cossack|samurai|man-at-arms|hunter/i, 'athletic'], [/merchant|sales|actor|star|senator|anchor|politic|courtier|diplomat|influencer/i, 'charming'], [/judge|priest|clergy|official|accountant|banker/i, 'honest'], [/painter|sculptor|musician|poet|writer|designer|artist|creator/i, 'creative'], [/scientist|researcher|inventor|astronom|philosoph|scholar/i, 'curious']];
  function jobFit(p, j) {
    if (!p.pers || !j) return 0;
    const t = j.t || '';
    let s = 0, n = 0;
    for (const [rx, k, sign] of FIT) if (rx.test(t)) { s += p.pers.ax[k] * sign; n++; }
    for (const [rx, tr] of TFIT) if (rx.test(t) && has(p, tr)) { s += 0.6; n++; }
    return n ? cl(s / Math.max(1, n * 0.8)) : 0;
  }

  /* ---------- what a person picks, given their character ---------- */
  // [label pattern, traits that favour it, traits that avoid it]
  const CHOICE = [
    [/fight|draw your sword|confront|meet him|take the cross|charge|duel|defend|refuse|stand|rise to/i, ['brave', 'hotheaded', 'reckless'], ['cowardly', 'cautious', 'patient']],
    [/run|hide|flee|walk on|bow and|chicken|apologise|leave town|swallow|pack your|keep your head/i, ['cowardly', 'cautious', 'patient'], ['brave', 'hotheaded']],
    [/return it|give generously|vouch|help|hear their side|talk to someone|kinder|take them in|donate/i, ['kind', 'generous', 'honest'], ['cruel', 'greedy']],
    [/keep it|snub them back|shout|punish/i, ['greedy', 'cruel', 'hotheaded'], ['kind', 'generous', 'patient']],
    [/bribe|cheat|pay .* off|lie|forge|smuggle|steal|do it$/i, ['deceitful', 'greedy', 'reckless'], ['honest', 'cautious']],
    [/invest|buy|go prospecting|enter|emigrate|enrol|court them|play$/i, ['reckless', 'ambitious', 'curious'], ['cautious']],
    [/pass|decline|stay|keep your money|not this year|politely/i, ['cautious', 'easygoing'], ['reckless', 'ambitious']],
    [/celebrate|party|host|attend|join/i, ['gregarious', 'cheerful'], ['shy']],
    [/quietly|stay home|alone|go back to sleep/i, ['shy', 'easygoing', 'melancholic'], ['gregarious']],
    [/study|learn|seek answers|sit the|get up and create/i, ['curious', 'diligent', 'creative', 'skeptic'], ['lazy']],
    [/pray|faith|offer|confess|pilgrim/i, ['pious'], ['skeptic']],
    [/work|push through|throw yourself|resist/i, ['diligent', 'ambitious'], ['lazy', 'easygoing']],
    [/give in|take time off|wing it|ignore/i, ['lazy', 'easygoing'], ['diligent']],
    [/confess|ask your crush|court|propose|accept the match|meet them/i, ['romantic', 'charming'], ['shy']],
  ];
  function choiceScore(p, label) {
    let s = 0;
    for (const [rx, pro, con] of CHOICE) if (rx.test(label)) { for (const t of pro) if (has(p, t)) s += 1; for (const t of con) if (has(p, t)) s -= 1; }
    return s;
  }
  function inCharacter(p, choices) {
    const scored = choices.map(c => [c, choiceScore(p, c.l || '') + Math.random() * 0.9]);
    scored.sort((a, b) => b[1] - a[1]);
    return scored[0][0];
  }

  /* ---------- hooks: feedback into everything ---------- */
  S.addHook('onCreate', p => make(p, S.P(p.fa), S.P(p.mo)));
  S.addHook('migrate', w => Object.values(w.people).forEach(ensure));

  S.addHook('hpTarget', (p, e) => {
    let d = 0;
    if (has(p, 'cheerful')) d += 7; if (has(p, 'melancholic')) d -= 6; if (has(p, 'easygoing')) d += 3;
    if (has(p, 'ambitious')) d += p.job || S.age(p) < 18 || p.retired ? 1 : -5;
    const friends = Object.values(p.rels).filter(r => r.k === 'friend').length;
    if (has(p, 'gregarious')) d += friends >= 3 ? 3 : -3;
    if (p.pers && p.pers.ax.e > 0.3 && friends === 0 && S.age(p) >= 14) d -= 3;
    if (has(p, 'pious')) d += DATA.PREMODERN.includes(e.id) ? 4 : 2;
    if (has(p, 'greedy')) d += p.money > S.toVal(e.cost * 10) ? 3 : -2;
    if (p.job) d += jobFit(p, p.job) * 4;
    return d;
  }, 'add');
  S.addHook('perf', (p, j) => (has(p, 'diligent') ? 3 : 0) - (has(p, 'lazy') ? 3 : 0) + (has(p, 'ambitious') ? 2 : 0) + jobFit(p, j) * 3, 'add');
  S.addHook('promoMul', p => (has(p, 'ambitious') ? 1.4 : 1) * (has(p, 'charming') ? 1.2 : 1) * (has(p, 'lazy') ? 0.6 : 1) * (has(p, 'easygoing') ? 0.8 : 1), 'mul');
  S.addHook('relDrift', (p, o, r) => {
    let d = compat(p, o) * 1.5;
    if (has(p, 'loyal')) d += 1.2; if (has(p, 'fickle')) d -= 1.5; if (has(p, 'kind')) d += 0.8; if (has(p, 'cruel')) d -= 1.5; if (has(p, 'hotheaded')) d -= 0.8;
    if (r.k === 'friend') d += has(p, 'gregarious') ? 0.6 : has(p, 'shy') ? -0.4 : 0;
    return d;
  }, 'add');
  S.addHook('relGain', (p, o, act) => {
    if (act === 'argue') return (has(p, 'hotheaded') ? -4 : 0) + (has(p, 'patient') ? 5 : 0) + (has(o, 'hotheaded') ? -3 : 0);
    return compat(p, o) * 4 + (has(p, 'charming') ? 2 : 0) + (has(p, 'kind') ? 1 : 0) + (has(p, 'cruel') ? -2 : 0);
  }, 'add');
  S.addHook('odds', (p, c) => {
    if (!p.pers) return 0;
    let d = 0;
    const tag = c.tag, o = c.o;
    if (tag === 'romance') d += (has(p, 'charming') ? 0.12 : 0) + (has(p, 'romantic') ? 0.05 : 0) - (has(p, 'shy') ? 0.08 : 0) + (o ? compat(p, o) * 0.12 : 0);
    else if (tag === 'propose') d += (o ? compat(p, o) * 0.15 : 0) + (has(p, 'loyal') ? 0.05 : 0) + (has(o, 'romantic') ? 0.05 : 0);
    else if (tag === 'crime') d += (has(p, 'deceitful') ? 0.12 : 0) - (has(p, 'honest') ? 0.1 : 0) + (has(p, 'cautious') ? 0.05 : 0) - (has(p, 'reckless') ? 0.05 : 0);
    else if (tag === 'interview') d += (has(p, 'charming') ? 0.1 : 0) + (has(p, 'ambitious') ? 0.05 : 0) - (has(p, 'shy') ? 0.05 : 0);
    else if (tag === 'fight') d += (has(p, 'brave') ? 0.1 : 0) - (has(p, 'cowardly') ? 0.1 : 0) + (has(p, 'athletic') ? 0.08 : 0) + (has(p, 'hotheaded') ? 0.03 : 0);
    else if (tag === 'vote') d += (has(p, 'charming') ? 0.08 : 0) + (has(p, 'honest') ? 0.03 : 0) + (has(p, 'cruel') ? -0.05 : 0) + (p.pers.ax.e > 0 ? 0.03 : -0.02);
    else if (c.l) {
      const l = c.l;
      if (/fight|duel|draw|confront|meet him|take the cross|charge|refuse/i.test(l)) d += (has(p, 'brave') ? 0.12 : 0) - (has(p, 'cowardly') ? 0.12 : 0) + (has(p, 'athletic') ? 0.06 : 0);
      if (/ask|confess|court|speak|attend and|flirt/i.test(l)) d += (has(p, 'charming') ? 0.12 : 0) - (has(p, 'shy') ? 0.1 : 0);
      if (/sit|exam|study|play$|enrol/i.test(l)) d += (has(p, 'curious') ? 0.05 : 0) + (has(p, 'diligent') ? 0.05 : 0) - (has(p, 'lazy') ? 0.05 : 0);
      if (/resist|push through|get fit/i.test(l)) d += (has(p, 'diligent') ? 0.1 : 0) + (has(p, 'patient') ? 0.05 : 0) - (has(p, 'lazy') ? 0.1 : 0);
      if (/bribe|cheat|lie|bluff/i.test(l)) d += (has(p, 'deceitful') ? 0.1 : 0) - (has(p, 'honest') ? 0.1 : 0);
      if (/invest|buy|prospect/i.test(l)) d += has(p, 'curious') ? 0.02 : 0;
    }
    return d;
  }, 'add');
  S.addHook('npcMul', (p, what) => {
    if (what === 'marry') return (has(p, 'romantic') ? 1.4 : 1) * (has(p, 'gregarious') ? 1.2 : 1) * (has(p, 'shy') ? 0.7 : 1);
    if (what === 'divorce') { const sp = S.spouse(p); return (has(p, 'loyal') ? 0.4 : 1) * (has(p, 'fickle') ? 2 : 1) * (has(p, 'hotheaded') ? 1.5 : 1) * (has(p, 'patient') ? 0.7 : 1) * (has(p, 'cruel') ? 1.5 : 1) * (sp ? 1 - compat(p, sp) * 0.5 : 1); }
    return 1;
  }, 'mul');
  S.addHook('accMul', p => (has(p, 'reckless') ? 1.6 : 1) * (has(p, 'cautious') ? 0.7 : 1) * (has(p, 'athletic') ? 0.9 : 1), 'mul');
  S.addHook('mort', p => (has(p, 'athletic') ? 0.95 : 1) * (has(p, 'melancholic') ? 1.03 : 1) * (has(p, 'lazy') ? 1.03 : 1), 'mul');
  S.addHook('crimeMul', p => (has(p, 'deceitful') ? 1.3 : 1) * (has(p, 'greedy') ? 1.2 : 1), 'mul');
  S.addHook('npcChoose', (p, choices) => inCharacter(p, choices));
  S.addHook('chose', (p, c) => {
    for (const [rx, pro] of CHOICE) if (rx.test(c.l || '')) { nudge(p, pro[0], 1, p.id !== S.W.playerId); break; }
  });

  // Solitary and social pleasures land differently on introverts and extraverts
  const SOCIAL = /u:(party|friend|love|gamble)|e:(games|symposium|fair|joust|masque|salon|coffee|concert|swing|movies|zerog|vr)/;
  const SOLO = /u:(study|faith|daydream|create|discipline|mind)|e:(philo|anatomy|radio|tv|sanctuary|detox|confess)/;
  const HABIT = { 'u:gym': 'athletic', 'u:study': 'curious', 'u:create': 'creative', 'u:faith': 'pious', 'u:party': 'gregarious', 'u:friend': 'gregarious', 'u:love': 'romantic', 'u:crime': 'deceitful', 'u:gamble': 'reckless', 'u:discipline': 'diligent', 'u:mind': 'patient', 'u:daydream': 'creative' };
  S.addHook('afterAct', (p, act) => {
    if (!p.pers) return '';
    const e = p.pers.ax.e, id = act.id;
    let note = '';
    if (SOCIAL.test(id)) { const d = Math.round(e * 4 + (has(p, 'gregarious') ? 2 : 0) - (has(p, 'shy') ? 2 : 0)); if (d) { p.hp = U.clamp(p.hp + d); note = d > 0 ? 'You came alive in the company.' : 'All those people wore you out.'; } }
    else if (SOLO.test(id)) { const d = Math.round(-e * 3); if (d > 0) { p.hp = U.clamp(p.hp + d); p.mh = U.clamp((p.mh ?? 60) + 1); note = 'The quiet suited you.'; } }

    if (id === 'u:study' && has(p, 'curious')) p.sm = U.clamp(p.sm + 1);
    if (id === 'u:create' && has(p, 'creative')) p.im = U.clamp((p.im ?? 50) + 2);
    if (id === 'u:faith') { if (has(p, 'pious')) p.mh = U.clamp((p.mh ?? 60) + 3); if (has(p, 'skeptic')) p.hp = U.clamp(p.hp - 2); }
    if (HABIT[id]) nudge(p, HABIT[id], 0.5);
    return note;

  S.addHook('afterInteract', (p, o, act) => {
    if (act === 'argue') nudge(p, 'hotheaded', 0.7);
    else if (act === 'gift') nudge(p, 'generous', 0.7);
    else if (act === 'time') nudge(p, 'loyal', 0.3);
    else if (act === 'money') nudge(p, 'greedy', 0.4);

  S.addHook('tick', (p, e, a) => {
    if (!p.pers) return;
    const tr = p.pers.tr;
    if (tr.includes('diligent')) p.wp = U.clamp((p.wp ?? 50) + 0.4);
    if (tr.includes('lazy')) { p.wp = U.clamp((p.wp ?? 50) - 0.3); p.bmi = Math.min(45, (p.bmi ?? 22) + 0.1); }
    if (tr.includes('athletic') && a < 60) p.h = U.clamp(p.h + 0.6);
    if (tr.includes('creative')) p.im = U.clamp((p.im ?? 50) + 0.4);
    if (tr.includes('curious') && a < 70) p.sm = U.clamp(p.sm + 0.25);
    if (tr.includes('melancholic')) { p.mh = U.clamp((p.mh ?? 60) - 0.5); p.im = U.clamp((p.im ?? 50) + 0.2); }

    if (tr.includes('hotheaded')) p.mh = U.clamp((p.mh ?? 60) - 0.2);

    if (tr.includes('charming') && (p.fm ?? 0) > 10) p.fm = U.clamp(p.fm + 0.2);
    // new traits surface at life's turning points
    if ([6, 13, 18, 30, 50].includes(a) && tr.length < capAt(a)) {
      const t = pickTrait(p, Object.entries(p.pers.sc).filter(([, v]) => v >= 2).map(([k]) => k));
      if (t) { tr.push(t.id); if (p.id === S.W.playerId) S.log(p, `As you grew, a new side of you emerged: ${t.n.toLowerCase()}. ${t.d}`, 'life'); }
    }
    p.pers.type = typeOf(p.pers.ax);

    if (!p.pers) return null;
    const [n, d] = DATA.mbti[p.pers.type] || ['', ''];
    return { type: p.pers.type, name: n, d, ax: p.pers.ax, traits: p.pers.tr.map(T).filter(Boolean) };

Sim.pers = Pers;

/* ---- settlements.js ---- */
/* =====================================================================
   SETTLEMENTS & MIGRATION — everyone lives somewhere: a hunting camp,
   a village near a town, or a named city whose size changes over the
   centuries (DATA.cities). Where you live changes your cost of living,
   pay, exposure to disease and which jobs you can get. People move to
   the city, bands follow the herds, and historical migrations carry
   genes and families from land to land.
   ===================================================================== */

const Towns = (() => {
  const S = Sim, W = () => S.W, yr = () => S.W.year;
  const LV = ['Camp', 'Hamlet', 'Village', 'Town', 'City', 'Great city', 'Metropolis', 'Megacity'];
  const COST = [0.6, 0.7, 0.8, 1, 1.12, 1.25, 1.4, 1.55], PAY = [0.7, 0.8, 0.85, 1, 1.1, 1.2, 1.3, 1.4];
  const SICK_OLD = [0.7, 0.8, 0.85, 1, 1.25, 1.5, 1.7, 1.8], SICK_NEW = [1, 1, 1, 1, 1.03, 1.06, 1.1, 1.15];
  const URBAN = { prehistory: 0.02, ancient: 0.1, medieval: 0.1, renaissance: 0.12, colonial: 0.15, industrial: 0.32, wars: 0.45, modern: 0.6, digital: 0.7, near: 0.8, far: 0.9 };

  /* ---------- the city tables ---------- */
  const cache = {};
  function list(cc) {
    if (cache[cc]) return cache[cc];
    return (cache[cc] = (DATA.cities[cc] || []).map(([raw, from, to, pts]) => ({ raw, from, to: to || null, pts: pts.split(' ').map(x => x.split(':').map(Number)) })));
  }
  const find = (cc, raw) => list(cc).find(c => c.raw === raw);
  function nameOf(raw, y = yr()) {
    if (!raw) return '';
    const parts = raw.split('>'); let n = parts[0];
    for (let i = 1; i < parts.length; i += 2) if (y >= +parts[i]) n = parts[i + 1];
    return n;
  }
  function lvlOf(c, y = yr()) {
    if (!c || y < c.from || (c.to != null && y > c.to)) return -1;
    let l = -1; for (const [yy, v] of c.pts) if (y >= yy) l = v;
    return l;
  }
  const citiesAt = (cc, y = yr()) => list(cc).map(c => ({ c, raw: c.raw, name: nameOf(c.raw, y), lvl: lvlOf(c, y) })).filter(x => x.lvl >= 0).sort((a, b) => b.lvl - a.lvl);
  const neoOK = (cc, what, y = yr()) => { const n = DATA.neolithic[cc]; return !n || y >= (n[what] ?? -1e9); };

  /* ---------- homes ---------- */
  function pickHome(cc, y = yr(), urbanBias = 0) {
    const cs = citiesAt(cc, y), e = S.eraOf(y);
    const space = S.world?.C(cc)?.region === 'space';
    if (!cs.length) return { c: null, near: S.world ? S.world.cap(cc, y) : '', rural: true, hm: U.chance(0.3) ? 1 : 0 };
    const urb = space ? 1 : U.clamp((URBAN[e.id] ?? 0.2) + urbanBias, 0, 1);
    const pick = U.wpick(cs, x => (x.lvl + 1) ** 2);
    if (U.chance(urb) || pick.lvl <= 1) return { c: pick.raw, rural: false };
    return { c: null, near: pick.raw, rural: true, hm: U.chance(0.3) ? 1 : 0 };
  }
  function ensure(p) {
    if (p.home && (p.home.c || p.home.near != null)) return p.home;
    return (p.home = pickHome(p.cc || 'ENG'));
  }
  function info(p, y = yr()) {
    const h = ensure(p), cc = p.cc;
    if (!h.rural) {
      const c = find(cc, h.c), l = lvlOf(c, y);
      if (c && l >= 0) return { name: nameOf(h.c, y), lvl: l, lvlName: LV[l], label: `${nameOf(h.c, y)} (${LV[l].toLowerCase()})`, rural: false, raw: h.c };
    }
    const near = h.near != null ? (find(cc, h.near) ? nameOf(h.near, y) : h.near) : h.c ? nameOf(h.c, y) : '';
    const forage = !neoOK(cc, 'farm', y) && y < 1500;
    const l = forage ? 0 : h.hm ? 1 : 2;
    const what = forage ? 'hunting camp' : LV[l].toLowerCase();
    return { name: near, lvl: l, lvlName: forage ? 'Camp' : LV[l], label: near ? `a ${what} near ${near}` : `a ${what}`, rural: true, raw: null };
  }
  const lvl = p => info(p).lvl;

  function move(p, target, quiet) {
    const e = S.era(), from = info(p);
    const dest = target === 'rural' ? { c: null, near: from.rural ? ensure(p).near : from.raw, rural: true, hm: 0 } : { c: target, rural: false };
    if (dest.c && dest.c === ensure(p).c) return 'You already live there.';
    const cost = S.toVal(e.cost * (target === 'rural' ? 0.1 : 0.25));
    if (!quiet) {
      if (S.age(p) < 16) return 'You are too young to move on your own.';
      if (p.did.move) return 'You already moved this year.';
      if (p.money < cost) return `Moving costs ${S.money(cost)}.`;
      p.did.move = 1; p.money -= cost;
    }
    p.home = dest;
    const fam = [S.spouse(p), ...S.kids(p).filter(k => S.age(k) < 18)].filter(o => o && S.alive(o) && o.cc === p.cc);
    fam.forEach(o => { o.home = { ...dest }; });
    for (const [id, r] of Object.entries(p.rels)) if (r.k === 'friend' || r.k === 'coworker') r.c = U.clamp(r.c - 8);
    if (p.places) delete p.places.town;
    const to = info(p);
    S.log(p, `You moved to ${to.label}${fam.length ? ` with ${fam.map(o => o.first).join(', ')}` : ''}.`, 'switch');
    return `You moved to ${to.label}.`;
  }

  /* ---------- hooks into the rest of the game ---------- */
  S.addHook('onCreate', (p, o) => {
    const par = [S.P(p.mo), S.P(p.fa)].find(x => x && x.home && x.cc === p.cc);
    if (par) { p.home = { ...par.home }; return; }
    const nr = o && o.near;
    if (nr && nr.home && nr.cc === p.cc && U.chance(0.7)) { p.home = { ...nr.home }; return; }
    p.home = pickHome(p.cc || 'ENG');
  });
  S.addHook('migrate', w => Object.values(w.people).forEach(ensure));
  S.hooks.neo = what => { const p = S.W && S.me(); return !p || neoOK(p.cc, what); };
  S.addHook('costMul', p => COST[lvl(p)] ?? 1, 'mul');
  S.addHook('payMul', p => PAY[lvl(p)] ?? 1, 'mul');
  S.addHook('catchMul', p => (DATA.PREMODERN.includes(S.era().id) ? SICK_OLD : SICK_NEW)[lvl(p)] ?? 1, 'mul');
  const BIGJOB = /senator|banker|lord|cardinal|governor|tycoon|industrialist|astronaut|anchor|film|star|stockbroker|diplomat|courtier|scholar-official|data scientist|ai researcher|neural|captain/i;
  function needLvl(j, e) {
    if (yr() < -3000 || S.world.C(S.me()?.cc)?.region === 'space') return 0;
    if (BIGJOB.test(j.t) || j.edu >= 3 || j.rep >= 50) return 4;
    if (j.edu >= 2 || j.pay >= e.cost * 3) return 3;
    return 0;
  }
  S.addHook('jobWhy', (p, j) => { const n = needLvl(j, S.era()), l = lvl(p); return l < n ? [n >= 4 ? 'living in a city' : 'living in a town'] : []; }, 'cat');

  // School beyond the basics needs a town in older ages; boarding away costs extra
  S.addHook('eduWhy', (p, l) => (l >= 3 && DATA.PREMODERN.includes(S.era().id) && lvl(p) < 3 ? ['a town with a school (or board away)'] : []), 'cat');

  /* ---------- settlement events ---------- */
  S.addHook('events', p => {
    const y = yr(), h = info(p), a = S.age(p), big = citiesAt(p.cc)[0];
    const out = [];
    if (h.rural && big && big.lvl >= 3 && a >= 16 && a <= 35 && y > -3000) out.push({ id: 'bigcity', p: ['industrial', 'wars', 'modern', 'digital'].includes(S.era().id) ? 0.08 : 0.03, t: `Travellers bring stories of ${big.name}: work, noise, and money for anyone willing to try.`, ch: [
      { l: `Move to ${big.name}`, go: 'city', fx: { im: 2, hp: 2 }, t: `You packed a bundle and left for ${big.name}.` }, { l: 'Stay where your roots are', fx: { mh: 2 }, t: 'Home is home.' }] });
    if (h.lvl === 0 && a >= 3) out.push({ id: 'bandmove', p: 0.08, t: 'The band broke camp and followed the herds to new grounds.', fx: { h: 1, im: 2 } });
    if (!h.rural && h.lvl >= 4 && DATA.PREMODERN.includes(S.era().id)) out.push({ id: 'cityfire', p: 0.03, min: 1, t: `Fire tore through the crowded lanes of ${h.name}.`, fx: { h: [-10, 0], $c: -0.1, hp: -4 } });
    if (!h.rural && h.lvl >= 5) out.push({ id: 'bigcitylife', p: 0.05, min: 12, t: `${h.name} never sleeps. Everything you could want is here, for a price.`, ch: [{ l: 'Take it all in', fx: { hp: 5, im: 2, $c: -0.03 }, t: 'Theatres, markets, crowds. You loved it.' }, { l: 'Keep your head down', fx: { mh: 1 }, t: 'The city is loud. You kept to your street.' }] });
    if (h.rural && h.lvl >= 1) out.push({ id: 'villagefair', p: 0.05, min: 4, t: 'The whole district came to the fair: livestock, dancing and gossip.', fx: { hp: 4, rep: 1 } });
    return out;
  }, 'cat');
  S.addHook('chose', (p, c) => { if (c.go === 'city') { const big = citiesAt(p.cc)[0]; if (big) move(p, big.raw, true); } });

  /* ---------- migration waves, refugees, settlement growth ---------- */
  function mixPop(to, froms, rate) {
    const w = W(), P = Gen.pop(w, to), src = froms.map(f => Gen.pop(w, f));
    for (const k of Gen.KEYS) { const g = src.reduce((s, x) => s + x[k], 0) / src.length; P[k] += (g - P[k]) * rate; }
  }
  const warsHere = cc => S.activeWars().filter(h => h.where && h.where.includes(cc) && h.civ);
  S.addHook('preYear', p => {
    const y = yr();
    for (const h of DATA.history) {
      if (h.type !== 'migration' || y < h.y || y > (h.end ?? h.y) || !h.where) continue;
      if (h.from && h.mix) for (const to of h.where) mixPop(to, h.from, h.mix);
      // a few people you know join the movement
      if (h.from) for (const o of S.known(p)) if (S.alive(o) && h.from.includes(o.cc) && S.age(o) >= 16 && S.age(o) <= 45 && U.chance(0.015)) {
        const dest = U.pick(h.where); o.cc = dest; o.home = pickHome(dest, y, 0.2);
        S.log(p, `Your ${S.relLabel(p, o).toLowerCase()} ${o.first} left for ${S.world.name(dest)}.`, 'world');
      }
      // and you might too
      const key = 'mig_' + h.key;
      if (h.from && h.from.includes(p.cc) && !p.flags[key] && S.age(p) >= 16 && S.age(p) <= 50 && U.chance(0.25)) {
        p.flags[key] = 1; const dest = U.pick(h.where);
        S.prompt({ title: 'A time of leaving', text: `${h.t}\n\nNeighbours are packing up for ${S.world.name(dest)}. Will you go with them?`, choices: [
          { l: `Go to ${S.world.name(dest)}`, go: () => { const t = emigrateCheap(p, dest); return t; } },
          { l: 'Stay', go: () => { S.log(p, 'Many left, but you stayed.', 'life'); return 'You watched them go.'; } }] });
      }
      if (h.urban && h.where.includes(p.cc) && info(p).rural && !p.flags[key] && S.age(p) >= 16 && S.age(p) <= 45 && U.chance(0.2)) {
        p.flags[key] = 1; const big = citiesAt(p.cc)[0];
        if (big) S.prompt({ title: 'Heading north', text: `${h.t}\n\nFactories in ${big.name} are hiring. Go?`, choices: [
          { l: `Move to ${big.name}`, go: () => move(p, big.raw, true) }, { l: 'Stay home', go: () => 'You stayed.' }] });
      }
    }
    // refugees: war with civilian deaths at home
    const wars = warsHere(p.cc);
    if (wars.length && S.age(p) >= 16 && !p.flags.war && !p.prison && U.chance(0.1)) {
      const h = wars[0], key = 'fled_' + h.key;
      if (!p.flags[key]) {
        const safe = S.world.countriesAt().filter(c => c.id !== p.cc && c.region !== 'space' && !S.activeWars().some(w => w.where && w.where.includes(c.id)));
        if (safe.length) {
          p.flags[key] = 1; const dest = U.pick(safe).id;
          S.prompt({ title: 'The war comes closer', text: `The ${h.n} has reached your district. Families are fleeing toward ${S.world.name(dest)}.`, choices: [
            { l: `Flee to ${S.world.name(dest)}`, go: () => emigrateCheap(p, dest, 'fled') },
            { l: 'Stay and endure', go: () => { S.applyFx(p, { mh: -4, wp: 2 }); return 'You bolted the door and stayed.'; } }] });
        }
      }
    }
  });

    p.cc = dest; p.home = pickHome(dest, yr(), 0.2);

    fam.forEach(o => { o.cc = dest; o.home = { ...p.home }; });
    if (p.job && !['digital', 'near', 'far'].includes(S.era().id)) p.job = null;
    p.money *= how === 'fled' ? 0.5 : 0.8;
    S.applyFx(p, { mh: how === 'fled' ? -6 : -2, im: 3, rep: -2 });
    if (!p.travels.includes(dest)) p.travels.push(dest);
    const t = `You ${how === 'fled' ? 'fled' : 'emigrated'} from ${S.world.name(from)} to ${info(p).label}, ${S.world.name(dest)}${fam.length ? ` with ${fam.map(o => o.first).join(', ')}` : ''}.`;
    S.log(p, t, 'switch');
    return t;
  }
  S.addHook('postYear', p => {
    const h = ensure(p), i = info(p);
    // your town grows, shrinks, is renamed or abandoned
    if (!h.rural) {
      if (lvlOf(find(p.cc, h.c)) < 0) { const near = citiesAt(p.cc)[0]; p.home = { c: null, near: near ? near.raw : '', rural: true }; S.log(p, `${nameOf(h.c)} was abandoned. Your family moved out into the country.`, 'bad'); }
      else if (h.seen != null && i.lvl !== h.seen) S.log(p, i.lvl > h.seen ? `${i.name} has grown into a ${i.lvlName.toLowerCase()}.` : `${i.name} has shrunk to a ${i.lvlName.toLowerCase()}.`, 'world');
      else if (h.nm && h.nm !== i.name) S.log(p, `${h.nm} is now called ${i.name}.`, 'world');
