/* ---- auto.js ---- */
/* =====================================================================
   AUTO — let the game act for you.
   * Habits: work, exercise, study, see a healer, keep in touch...
   * Pins: tap "auto" next to almost any action (an activity, a person's
     action, a pet, a household plan, a club, a phone call, a sport) and
     it repeats every year.
   * Recorder: everything you do in a year is remembered; "Repeat last
     year" replays it in one tap, or every year automatically.
   * Choice policies, an AI autopilot goal (ai.js), timed aging, carrying
     on as an heir, and "play N years".
   ===================================================================== */

const Auto = (() => {
  const S = Sim;
  const OPTS = [
    ['work', 'Work hard every year'], ['gym', 'Exercise every year'], ['study', 'Study every year'], ['healer', 'See a healer when ill'],
    ['social', 'Keep in touch with family'], ['job', 'Find work when unemployed'], ['school', 'Enrol in the next school'], ['invest', 'Put spare money into income property'], ['pets', 'Care for pets'],
    ['repeat', "Repeat last year's actions every year"], ['pinsOn', 'Run my pinned actions every year'],
  ];
  const cfg = () => (S.W.auto ||= { choices: 'ask', speed: 2, pinsOn: true });
  const macro = () => (S.W.macro ||= { cur: [], last: [] });

  /* ---------- replaying recorded or pinned actions ---------- */
  const replay = {
    activity: ds => S.doActivity(ds.id),
    interact: ds => S.interact(+ds.id, ds.a),
    workHard: () => S.workHard(),
    promo: () => S.askPromotion(),
    petAct: ds => S.petAct(+ds.id, ds.a),
    memberAct: ds => (typeof House !== 'undefined' ? House.act(S.me(), +ds.id, ds.a) : ''),
    house: ds => (typeof House !== 'undefined' ? House.houseAct(S.me(), ds.a) : ''),
    orgAct: ds => (['attend', 'donate', 'rise'].includes(ds.a) ? S.orgAct(ds.id, ds.a) : ''),
    natAct: ds => (ds.a === 'travel' ? S.world.travel(ds.cc) : ds.a === 'invest' ? S.world.invest(ds.cc, 0.2) : ''),
    bulk: ds => { let n = 0; for (const o of S.known(S.me()).filter(S.alive)) { if (ds.g === 'family' && !/Father|Mother|Brother|Sister|Son|Daughter|Grand|Husband|Wife/.test(S.relLabel(S.me(), o))) continue; if (ds.a === 'party') break; const t = S.interact(o.id, ds.a); if (t && !/already|cannot|gone/i.test(t)) n++; } return n ? `Kept up with ${n} people.` : ''; },
  };
  const label = x => x.label || `${x.act}${x.ds.a ? ' · ' + x.ds.a : ''}`;
  function exec(x) {
    const f = replay[x.act]; if (!f || !S.alive(S.me()) || S.W.dead) return '';
    try { const t = f(x.ds || {}); S.settle(); return t || ''; } catch (err) { console.error(err); return ''; }
  }
  // Clicks with a replay handler count as "things you did this year"
  function record(act, ds, lab) {
    if (!replay[act] || !S.W) return;
    const m = macro(), key = act + JSON.stringify(ds);
    if (!m.cur.some(x => x.key === key)) m.cur.push({ key, act, ds, label: lab });
  }
  function rollYear() { const m = macro(); if (m.cur.length) m.last = m.cur; m.cur = []; }
  function repeatLast() {
    const m = macro(), out = [];
    S.asAuto(() => { for (const x of m.last) { const t = exec(x); if (t && !/already|cannot|not |need|too young/i.test(t)) out.push(t); } });
    return out;
  }

  /* ---------- pins ---------- */
  const pins = () => (cfg().pins ||= []);
  const pinKey = (act, ds) => act + JSON.stringify(ds);
  const isPinned = (act, ds) => pins().some(x => x.key === pinKey(act, ds));
  function togglePin(act, ds, lab) {
    const k = pinKey(act, ds), list = pins(), i = list.findIndex(x => x.key === k);
    if (i >= 0) { list.splice(i, 1); return false; }
    list.push({ key: k, act, ds, label: lab }); return true;
  }
  function runPins() { const out = []; S.asAuto(() => { for (const x of pins().slice()) { const t = exec(x); if (t) out.push(t); } }); return out; }

  /* ---------- the yearly routine ---------- */
  function apply(p) { S.asAuto(() => routine(p)); }
  function routine(p) {
    const c = cfg(), e = S.era(), a = S.age(p);
    if (!S.alive(p) || S.W.dead) return;
    if (c.goal && typeof AI !== 'undefined') AI.autopilot(p, c.goal);
    if (c.work && p.job) S.workHard();
    if (c.gym && a >= 8) S.doActivity('u:gym');
    if (c.study && a >= 6) S.doActivity('u:study');
    if (c.healer && p.sick.length) S.doActivity('u:healer');
    if (c.social) S.known(p).filter(o => S.alive(o) && p.rels[o.id]?.k === 'fam').sort((x, y) => (p.rels[x.id]?.c ?? 50) - (p.rels[y.id]?.c ?? 50)).slice(0, 3).forEach(o => S.interact(o.id, 'time'));
    if (c.job && !p.job && a >= S.workAge(e) && !(p.school && p.school.lvl < 3)) { const L = S.jobListings(p).filter(x => !x.why.length).sort((x, y) => y.pay - x.pay); for (const x of L.slice(0, 3)) if (S.apply(x.j.id).ok) break; }
    if (c.school && !p.school && a <= 30) { const o = S.eduOptions(p).find(x => !x.why.length); if (o) S.doEnroll(o.lvl); }
    if (c.invest && p.money > S.toVal(e.cost * 20)) { const m = S.market().filter(x => x.a.inc > 0 && x.price < p.money * 0.5).sort((x, y) => y.a.inc - x.a.inc)[0]; if (m) S.buy(m.a.id); }
    if (c.pets) for (const pet of S.petsOf(p)) { S.petAct(pet.id, 'play'); if (pet.h < 50) S.petAct(pet.id, 'vet'); }
    if (c.pinsOn !== false) runPins();
    if (c.repeat) repeatLast();
    S.settle();
  }
  // Pick a choice by policy. Chapters and single-choice prompts just turn the page.
  function choose(pr, policy) {
    const ok = pr.choices.map((c, i) => [c, i]).filter(([c]) => !c.dis);
    if (!ok.length) return pr.choices[0];
    if (pr.choices.length === 1 || policy === 'bold') return ok[0][0];
    if (policy === 'safe') return ok[ok.length - 1][0];
    if (policy === 'character' && S.pers) return S.pers.inCharacter(S.me(), ok.map(x => x[0]));
    if ((policy === 'smart' || policy === 'goal') && typeof AI !== 'undefined') return AI.bestChoice(S.me(), ok.map(x => x[0]), cfg().goal || 'balanced');
    return U.pick(ok)[0];
  }
  function resolveAll(policy) { while (S.prompts.length) { const pr = S.prompts.shift(); choose(pr, policy).go(); S.settle(); } }
  function carryOn() {
    const d = S.W.dead; if (!d) return false;
    const h = S.heirs(S.P(d.id)).filter(x => S.age(x.o) >= 0);
    const kid = h.find(x => /Son|Daughter/.test(x.rel)) || h[0];
    if (!kid) return false;
    S.continueAs(kid.o.id);
    return true;
  }
  // Play n years at once with the current settings
  function run(n) {
    const c = cfg(), policy = c.choices === 'ask' ? 'safe' : c.choices;
    let lived = 0;
    for (let i = 0; i < n; i++) {
      rollYear();
      S.ageUp(); resolveAll(policy); S.settle();
      if (S.W.dead) { if (!(c.heir && carryOn())) break; }
      apply(S.me()); resolveAll(policy); lived++;
    }
    return lived;
  }
  return { OPTS, cfg, apply, choose, resolveAll, run, carryOn, replay, exec, record, rollYear, repeatLast, pins, isPinned, togglePin, runPins, macro, label };
})();

(() => {
  const S = Sim, ui = UI, { $, esc, toast, sheet, render } = ui;
  let timer = null;
  const running = () => !!timer;
  function stop() { if (timer) clearInterval(timer); timer = null; $('#autoBtn')?.setAttribute('aria-pressed', 'false'); }
  function tick() {
    if (!S.W || !ui.age) return stop();
    const c = Auto.cfg();
    if (ui.open && c.choices === 'ask') return;          // wait for the player's choice
    if (S.W.dead) { if (c.heir && Auto.carryOn()) { ui.open = null; $('#modal').innerHTML = ''; render(); ui.save(); return; } return stop(); }
    if (ui.open && c.choices !== 'ask') { ui.open = null; $('#modal').innerHTML = ''; }
    ui.age();
    if (c.choices !== 'ask') { Auto.resolveAll(c.choices); ui.open = null; $('#modal').innerHTML = ''; }
    render(); ui.save();
  }

  // Record what the player does (see main.js: every click passes through ui.around)
  (ui.around ||= []).push({ after: el => { if (!S.W || !S.me()) return; const ds = { ...el.dataset }; delete ds.act; delete ds.label; Auto.record(el.dataset.act, ds, el.dataset.label || el.textContent.trim().slice(0, 60)); } });
  const age0 = () => Auto.rollYear();
  // roll the recorder over at the start of every year, before the player acts again
  (ui.beforeAge ||= []).push(age0);

  // A small "auto" toggle placed next to an action button
  ui.pinBtn = (act, ds, lab) => {
    if (!S.W) return '';
    const on = Auto.isPinned(act, ds);
    return `<button class="pin ${on ? 'on' : ''}" data-act="pinToggle" data-pa="${esc(act)}" data-ps="${esc(JSON.stringify(ds))}" data-label="${esc(lab || '')}" aria-pressed="${on}" title="${on ? 'Repeats every year. Tap to stop.' : 'Repeat this every year'}">auto</button>`;
  };
  ui.on.pinToggle = el => {
    const on = Auto.togglePin(el.dataset.pa, JSON.parse(el.dataset.ps), el.dataset.label);
    el.classList.toggle('on', on); el.setAttribute('aria-pressed', on);
    ui.save(); toast(on ? `"${el.dataset.label}" will repeat every year.` : 'Unpinned.');
  };

  function autoSheet(res) {
    const c = Auto.cfg(), m = Auto.macro(), pins = Auto.pins();
    const goals = typeof AI !== 'undefined' ? AI.GOALS : [];
    sheet(`<h2>Auto-play</h2><p class="lede">Let your character handle the routine. Everything here works in every game mode.</p>
      <div class="eyebrow" style="margin-top:10px">Every year, automatically</div>
      <div class="checks">${Auto.OPTS.map(([k, l]) => `<label class="check"><input type="checkbox" data-input="autoOpt" data-k="${k}" ${c[k] || (k === 'pinsOn' && c.pinsOn !== false) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div>
      <div class="form" style="margin-top:12px">
        <div class="field"><label for="a-choices">When a choice pops up</label><select id="a-choices" data-input="autoSel" data-k="choices">${[['ask', 'Ask me'], ['safe', 'Play it safe'], ['bold', 'Be bold'], ['character', 'Choose in character'], ['smart', 'Choose what serves my goal'], ['random', 'Choose at random']].map(([v, n]) => `<option value="${v}" ${c.choices === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        ${goals.length ? `<div class="field"><label for="a-goal">Autopilot goal</label><select id="a-goal" data-input="autoSel" data-k="goal"><option value="">Off (only the habits above)</option>${goals.map(([v, n]) => `<option value="${v}" ${c.goal === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>` : ''}
        <div class="field"><label for="a-speed">Auto-age speed</label><select id="a-speed" data-input="autoSel" data-k="speed">${[[4, 'Leisurely (4 s a year)'], [2, 'Steady (2 s)'], [1, 'Brisk (1 s)'], [0.4, 'Rapid']].map(([v, n]) => `<option value="${v}" ${+c.speed === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" data-input="autoOpt" data-k="heir" ${c.heir ? 'checked' : ''}> When I die, carry on as my eldest child</label>
      <div class="eyebrow" style="margin-top:14px">Pinned actions · ${pins.length}</div>
      ${pins.length ? `<div class="list" style="margin-top:6px">${pins.map((x, i) => `<div class="row"><div class="main"><div class="t">${esc(Auto.label(x))}</div></div><button class="btn sm danger" data-act="unpin" data-i="${i}">Remove</button></div>`).join('')}</div>` : '<p class="faint" style="font-size:13px;margin:4px 0 0">Tap the small <b>auto</b> button next to an activity, a person’s action, a pet, a club or a household plan to repeat it every year.</p>'}
      <div class="eyebrow" style="margin-top:14px">Last year you did ${m.last.length} thing${m.last.length === 1 ? '' : 's'} · this year so far ${m.cur.length}</div>
      ${m.last.length ? `<p class="faint" style="font-size:13px;margin:4px 0 0">${m.last.slice(0, 12).map(x => esc(Auto.label(x))).join(' · ')}${m.last.length > 12 ? ' …' : ''}</p>` : ''}
      ${res ? `<div class="result">${esc(res)}</div>` : ''}
      <div class="btnrow" style="margin-top:14px"><button class="btn era" data-act="autoToggle">${running() ? 'Stop auto-aging' : 'Start auto-aging'}</button>
        <button class="btn" data-act="repeatLast" ${m.last.length ? '' : 'disabled'}>Repeat last year now</button>
        ${[5, 10, 25].map(n => `<button class="btn" data-act="autoRun" data-n="${n}">Play ${n} years now</button>`).join('')}</div>`, { label: 'Auto-play' });
  }
  ui.on.auto = () => { ui.open = null; autoSheet(); };
  ui.on.unpin = el => { Auto.pins().splice(+el.dataset.i, 1); ui.save(); ui.open = null; autoSheet('Unpinned.'); };
  ui.input.autoOpt = el => { Auto.cfg()[el.dataset.k] = el.checked; ui.save(); };
  ui.input.autoSel = el => { Auto.cfg()[el.dataset.k] = el.dataset.k === 'speed' ? +el.value : el.value || null; if (running()) { stop(); start(); } ui.save(); };
  function start() { stop(); timer = setInterval(tick, Math.max(300, Auto.cfg().speed * 1000)); $('#autoBtn')?.setAttribute('aria-pressed', 'true'); }
  ui.on.autoToggle = () => { if (running()) { stop(); toast('Auto-aging stopped.'); } else { ui.open = null; $('#modal').innerHTML = ''; start(); toast('Auto-aging. Press the auto button to stop.'); } };
  ui.on.autoRun = el => {
    const n = +el.dataset.n, lived = Auto.run(n);
    ui.open = null; $('#modal').innerHTML = ''; render(); ui.save();
    toast(S.W.dead ? `Played ${lived} years before the end came.` : `Played ${lived} years.`);
  };
  ui.on.repeatLast = () => {
    if (!S.W || S.W.dead) return;
    const done = Auto.repeatLast();
    const wasOpen = !!ui.open && $('#modal .sheet h2')?.textContent === 'Auto-play';
    ui.open = null; if (!wasOpen) $('#modal').innerHTML = '';
    render(); ui.save();
    toast(done.length ? `Repeated ${done.length} of last year's actions.` : 'Nothing from last year could be repeated right now.');
  };
  ui.on.autoBtn = () => { if (running()) { stop(); toast('Auto-aging stopped.'); } else ui.on.auto(); };
  ui.stopAuto = stop;
  // replaying a recorded click should not be recorded again
  const rec = Auto.record;
  Auto.record = (act, ds, lab) => { if (act === 'repeatLast' || act === 'pinToggle') return; rec(act, ds, lab); };
})();

/* ---- profile.js ---- */
/* =====================================================================
   PROFILES — tap any face or name to open a full profile: overview (in
   the style of text life sims), every stat, personality, their whole
   life's events, family, and achievements. Your own avatar opens yours.
   The character card gains an ID card, and names in the life log link
   to the people they mention.
   ===================================================================== */

(() => {
  const S = Sim, ui = UI, { $, esc, bar, span, plural, sheet, render, toast } = ui;
  const basicPerson = ui.person;
  const TABS = [['over', 'Overview'], ['stats', 'Stats'], ['pers', 'Personality'], ['life', 'Life'], ['fam', 'Family'], ['ach', 'Achievements']];
  const STATUS = (p, o) => {
    const sp = S.spouse(o);
    if (sp) return `Married to ${sp.first}`;
    const lover = Object.entries(o.rels).find(([id, r]) => (r.k === 'lover' || r.k === 'fiance') && S.alive(S.P(+id)));
    if (lover) return `${o.rels[lover[0]].k === 'fiance' ? 'Engaged to' : 'Seeing'} ${S.P(+lover[0]).first}`;
    if (o.flags.widow) return o.sex === 'M' ? 'Widower' : 'Widow';
    if (o.exes.length) return 'Divorced';
    return S.age(o) < 14 ? 'A child' : 'Single';
  };
  const tierOf = (k, v) => DATA.statTier(k, v ?? 0).name;

  /* ---------- ID card on the character card ---------- */
  function idRows(p) {
    const e = S.era(), pd = S.pers?.describe(p), home = S.towns?.info(p);
    const work = p.office ? p.office.t : p.job ? `${p.job.rank ? S.rankName(p.job.rank) + ' ' : ''}${p.job.t}` : p.school ? `Student · ${e.edu.n[p.school.lvl]}` : p.retired ? 'Retired' : S.age(p) < S.workAge(e) ? 'Child' : 'Out of work';
    return [
      ['Home', home ? home.label[0].toUpperCase() + home.label.slice(1) : S.world.name(p.cc)],
      ['Status', STATUS(p, p)],
      ['Work', work],
      ['Schooling', e.edu.n[p.edu]],
      pd ? ['Nature', `${pd.type} · ${pd.traits.slice(0, 3).map(t => t.n).join(', ') || 'still forming'}`] : null,
    ].filter(Boolean);
  }
  const card = ui.cardHTML;
  ui.cardHTML = p => {
    let html = card(p);
    html = html.replace(/<span class="av pt lg/, `<button class="avbtn" data-act="profile" data-id="${p.id}" aria-label="Open your full profile"><span class="av pt lg`).replace(/(<span class="av pt lg[^]*?<\/svg><\/span>)/, '$1</button>');
    const rows = idRows(p);
    return html.replace('<div class="tags">', `<dl class="idcard">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="tags">`);
  };

  /* ---------- the profile sheet ---------- */
  function overview(p, o) {
    const self = o.id === p.id, liv = S.alive(o), e = S.era(), ph = S.pheno(o), home = S.towns?.info(o), pd = S.pers?.describe(o);
    const kv = [
      ['Age', liv ? `${S.age(o)}` : `Died ${U.fmtYearAD(o.died)} at ${S.age(o)}, of ${o.cause}`],
      ['Born', `${U.fmtYearAD(o.born)}, ${S.eraOf(o.born).name} era`],
      ['Sex', o.sex === 'M' ? 'Male' : 'Female'],
      ['Nationality', `${S.world.C(o.cc)?.adj || ''} · ${S.world.name(o.cc)}`],
      home ? ['Lives in', home.label] : null,
      ['Class', S.className(o)],
      ['Education', e.edu.n[o.edu] + (o.school ? ` (now at ${e.edu.n[o.school.lvl].toLowerCase()})` : '')],
      ['Occupation', o.office ? o.office.t : o.job ? `${o.job.rank ? S.rankName(o.job.rank) + ' ' : ''}${o.job.t} · ${S.money(o.job.pay * S.rankPay(o.job))}/yr` : o.retired ? 'Retired' : o.lastJob ? `Formerly ${o.lastJob}` : '—'],
      o.sport ? ['Sport', S.sports?.label(o) || ''] : null,
      ['Relationship', STATUS(p, o)],
      ['Children', o.kids.length ? `${o.kids.length} (${S.kids(o).filter(S.alive).length} living)` : 'None'],
      ['Wealth', S.money(S.netWorth(o))],
      pd ? ['Personality', `${pd.type}, ${pd.name.replace(/^The /, 'the ')}`] : null,
      self ? ['Attracted to', { straight: 'The opposite sex', gay: 'The same sex', bi: 'Anyone' }[o.orient] || o.orient] : null,
      ['Fame', tierOf('fm', o.fm)], ['Reputation', tierOf('rep', o.rep)],
      o.phone?.followers ? ['Followers', U.fmtNum(o.phone.followers)] : null,
      (o.orgs || []).length ? ['Belongs to', o.orgs.map(m => DATA.orgs.find(x => x.id === m.id)?.n).filter(Boolean).join(', ')] : null,
      o.twin ? ['Twin', S.P(o.twin) ? S.fullName(S.P(o.twin)) : '—'] : null,
      o.title ? ['Title', o.title] : null,

    const look = ph ? `<p class="lede" style="margin:10px 0 0">${esc(`${ph.skin.n[0].toUpperCase() + ph.skin.n.slice(1)} skin, ${ph.hair.n} ${ph.hair.type} hair, ${ph.eyes.n} eyes, a ${ph.nose} nose. ${ph.height} cm, ${ph.weight} kg, blood type ${ph.blood}.`)}${ph.traits.length ? ' ' + esc(ph.traits.join(', ')) + '.' : ''}</p>

  function persView(p, o) {

    const ax = DATA.axes.map(([k, pos, neg]) => { const v = d.ax[k], pct = Math.round((v + 1) * 50); return `<div class="axis"><span class="${v < 0 ? 'on' : ''}">${neg}</span><div class="axbar"><i style="left:${pct}%"></i></div><span class="${v >= 0 ? 'on' : ''}">${pos}</span></div>`; }).join('');
    const c = o.id !== p.id ? S.pers.compat(p, o) : null;
    return `<div class="mbti"><div class="type">${d.type}</div><div><b>${esc(d.name)}</b><div class="faint">${esc(d.d)}</div></div></div>
      <div class="axes">${ax}</div>

      ${d.traits.length ? `<ul class="traits">${d.traits.map(t => `<li><b>${esc(t.n)}</b> <span class="faint">${esc(t.d)}</span></li>`).join('')}</ul>` : '<p class="muted">Too young for their character to show.</p>'}
      ${c != null ? `<p class="lede" style="margin-top:10px">Compatibility with you: <b>${c > 0.3 ? 'Kindred spirits' : c > 0.1 ? 'Good' : c > -0.1 ? 'Mixed' : c > -0.3 ? 'Prickly' : 'Oil and water'}</b> <span class="mono faint">${c >= 0 ? '+' : ''}${Math.round(c * 100)}</span>. It shapes how fast you grow close, and how romance goes.</p>` : `<p class="faint" style="font-size:12.5px;margin-top:10px">Traits come from your parents and grow out of what you choose. Pick brave options and you become brave; keep studying and you become curious.</p>`}`;
  }
  function lifeList(p, o) {
    const items = o.log.filter(l => l.k !== 'quiet').slice().reverse();
    if (!items.length) return '<p class="muted">Nothing recorded yet. People you are close to have fuller stories.</p>';
    return `<ul class="plog">${items.slice(0, 160).map(l => `<li class="${l.k}"><span class="mono faint">${U.fmtYearAD(l.y)} · ${l.a}</span> ${ui.linkify ? ui.linkify(l.t, p) : esc(l.t)}${l.d && ui.dchips ? ' ' + ui.dchips(l.d, { small: 1, max: 4 }) : ''}</li>`).join('')}</ul>`;
  }
  function famView(p, o) {
    const grp = (n, list) => (list.length ? `<div class="eyebrow" style="margin-top:10px">${n}</div><div class="list">${list.map(q => `<button class="row" data-act="person" data-id="${q.id}">${ui.av(q, 'sm')}<div class="main"><div class="t">${esc(S.fullName(q))}</div><div class="s">${S.alive(q) ? `${S.age(q)}` : `† ${U.fmtYear(q.died)}`}${q.id === p.id ? ' · you' : ''}</div></div></button>`).join('')}</div>` : '');
    return grp('Parents', S.parents(o)) + grp('Siblings', S.siblings(o)) + grp('Spouse', [S.spouse(o)].filter(Boolean)) + grp('Former partners', o.exes.map(S.P).filter(Boolean)) + grp('Children', S.kids(o)) + grp('Grandchildren', S.grandkids(o)) || '<p class="muted">No family recorded.</p>';
  }
  function achView(o) {
    const got = DATA.achievements.filter(a => o.ach.includes(a.id)), rest = DATA.achievements.filter(a => !o.ach.includes(a.id));
    return `<div class="tags">${got.map(a => `<span class="tag good" title="${esc(a.d)}">${esc(a.n)}</span>`).join('') || '<span class="muted">None yet.</span>'}</div>
      <details style="margin-top:10px"><summary class="faint" style="cursor:pointer">Still to earn (${rest.length})</summary><ul class="traits">${rest.map(a => `<li><b>${esc(a.n)}</b> <span class="faint">${esc(a.d)}</span></li>`).join('')}</ul></details>`;
  }
  ui.profile = (id, tab, res) => {
    const p = S.me(), o = S.P(id); if (!o) return;
    const self = o.id === p.id, liv = S.alive(o);
    tab = tab || ui.profTab || 'over'; ui.profTab = tab;
    const tabs = TABS.filter(([t]) => t !== 'ach' || o.played);
    const lab = self ? 'You' : S.relLabel(p, o), r = p.rels[o.id];
    const acts = !self && liv ? S.actionsFor(p, o) : [];
    const body = { over: () => overview(p, o), stats: () => stats(o), pers: () => persView(p, o), life: () => lifeList(p, o), fam: () => famView(p, o), ach: () => achView(o) }[tab]();
    sheet(`<div class="who">${ui.av(o, 'lg')}<div class="meta"><div class="eyebrow">${esc(lab)}${o.flags?.ruler ? ' · ruler of your land' : ''}</div><h2>${esc(S.fullName(o))}</h2><div class="sub">${span(o)}${r && !self ? ` · closeness ${Math.round(r.c)}` : ''}</div></div></div>
      ${r && !self && liv ? `<div class="stat" style="margin-top:10px"><span class="k">Closeness</span>${bar(r.c, 'era')}<span class="v">${Math.round(r.c)}</span></div>` : ''}
      <div class="subtabs" role="tablist" style="margin-top:12px">${tabs.map(([t, n]) => `<button data-act="profTab" data-id="${o.id}" data-v="${t}" aria-selected="${tab === t}">${n}</button>`).join('')}</div>
      <div class="profbody">${body}</div>
      ${res ? `<div class="result" role="status">${esc(res)}</div>` : ''}
      ${acts.length ? `<div class="eyebrow" style="margin-top:14px">Do something together</div><div class="acts two" style="margin-top:6px">${acts.map(a => `<div class="actrow">${ui.interactBtn(o, a)}${ui.pinBtn ? ui.pinBtn('interact', { id: o.id, a: a.id }, `${a.l} with ${o.first}`) : ''}</div>`).join('')}</div>` : ''}
      ${ui.personExtra ? ui.personExtra(p, o) : ''}
      ${!self && liv && S.alive(p) ? `<button class="btn era block" style="margin-top:10px" data-act="become" data-id="${o.id}">Become ${esc(o.first)}</button>
        <p class="faint" style="font-size:12px;margin:8px 0 0">You would take over ${esc(o.first)}'s life with everything in it: their family, work, places and choices. ${esc(p.first)} keeps living in the world.</p>` : ''}
      ${S.godAllowed() ? `<button class="btn sm" style="margin-top:10px" data-act="godEdit" data-id="${o.id}">Edit with god powers</button>` : ''}`, { label: S.fullName(o) });
  };
  ui.person = (id, res) => ui.profile(id, ui.profTab === 'ach' ? 'over' : ui.profTab || 'over', res);
  ui.personBasic = basicPerson;
  ui.on.profile = el => { ui.profTab = 'over'; ui.profile(+el.dataset.id, 'over'); };
  ui.on.profTab = el => { ui.open = null; ui.profile(+el.dataset.id, el.dataset.v); };
  ui.on.moreLog = () => { ui.logLimit = (ui.logLimit || 120) + 120; render(); };

  /* ---------- names in text become links ---------- */
  let cache = { key: '', rx: null, map: null };
  ui.linkify = (t, p) => {
    const s = esc(t);
    if (!p || !S.W) return s;
    const key = `${S.W.year}:${p.id}:${Object.keys(p.rels).length}:${p.kids.length}`;
    if (cache.key !== key) {
      const map = new Map(), firsts = new Map();
      for (const o of S.known(p)) {
        map.set(esc(`${o.first} ${o.last}`), o.id);
        firsts.set(esc(o.first), firsts.has(esc(o.first)) ? -1 : o.id);
      }
      for (const [f, id] of firsts) if (id !== -1 && !map.has(f)) map.set(f, id);
      const names = [...map.keys()].filter(n => n.length > 2).sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      cache = { key, map, rx: names.length ? new RegExp(`\\b(${names.join('|')})\\b`, 'g') : null };
    }
    if (!cache.rx) return s;
    return s.replace(cache.rx, m => `<button class="plink" data-act="person" data-id="${cache.map.get(m)}">${m}</button>`);
  };

  /* ---------- faces in places and households open profiles too ---------- */
  ui.personExtra = (p, o) => '';
})();

/* ---- phone.js ---- */
/* =====================================================================
   PHONE — how people reach each other, era by era: runners with word
   from the next valley, letters (or a scribe if you cannot write),
   telegrams, the telephone, the smartphone with its social feed, and
   neural chat. People you know write to you with news, requests,
   invitations and love notes; you answer, call, write and post.
   From 2004 a social feed brings followers, likes, virality,
   sponsorships, trolls and scandal, and feeds your fame.
   ===================================================================== */

const Phone = (() => {
  const S = Sim, W = () => S.W, yr = () => S.W.year;
  function device(y = yr()) {
    if (y < -3000) return { id: 'runner', tab: 'Messages', verb: 'Send word', msg: 'word', social: false };
    if (y < 1840) return { id: 'letter', tab: 'Letters', verb: 'Write a letter', msg: 'letter', social: false };
    if (y < 1920) return { id: 'telegraph', tab: 'Post & Telegraph', verb: 'Write a letter', msg: 'letter', fast: 'Send a telegram', social: false };
    if (y < 1995) return { id: 'telephone', tab: 'Telephone', verb: 'Write a letter', msg: 'call', fast: 'Telephone them', social: false };
    if (y < 2040) return { id: 'mobile', tab: 'Phone', verb: 'Text them', msg: 'message', fast: y >= 2010 ? 'Video call' : 'Call them', social: y >= 2004, app: y >= 2004 ? (y >= 2016 ? 'Feed' : 'Wall') : null };
    return { id: 'neural', tab: 'Neural link', verb: 'Send a thought', msg: 'thought', fast: 'Share a memory', social: true, app: 'Holo-feed' };
  }
  const ph = p => (p.phone ||= { inbox: [], followers: 0, posts: [], sent: {} });
  const cost = m => S.toVal(S.era().cost * m);
  const canWrite = p => p.edu >= 1 || yr() >= 1900 || S.era().id === 'prehistory';
  const firstPerson = t => t.replace(/\bYou were\b/g, 'I was').replace(/\bYou are\b/g, 'I am').replace(/\bYou\b/g, 'I').replace(/\byou\b/g, 'me').replace(/\bYour\b/g, 'My').replace(/\byour\b/g, 'my').replace(/\byourself\b/g, 'myself');
  const dist = (p, o) => (o.cc !== p.cc ? 'far' : S.towns && S.towns.info(o).name !== S.towns.info(p).name ? 'near' : 'here');

  /* ---------- writing, calling, texting ---------- */
  function contactActs(p, o) {
    const d = device(), L = [];
    const r = p.rels[o.id];
    L.push(['write', d.verb]);
    if (d.fast) L.push(['fast', d.fast]);
    if (S.age(o) >= 16 && S.age(p) >= 14) L.push(['advice', 'Ask for advice']);
    if (S.age(p) >= 16) L.push(['gift', 'Send money']);
    if (r && r.c < 40) L.push(['sorry', 'Apologise']);
    if (S.age(p) >= 12) L.push(['invite', 'Invite them to visit']);
    return L;
  }
  function contact(oid, act) {
    const p = S.me(), o = S.P(oid), d = device(), st = ph(p);
    if (!o || !S.alive(o)) return 'They are gone.';
    const key = `ph:${oid}:${act}`;
    if (p.did[key]) return 'You already did that this year.';
    const r = S.rel(p, o), far = dist(p, o) === 'far', gain = (a, b) => { r.c = U.clamp(r.c + U.ri(a, b) + S.hadd('relGain', p, o, 'talk')); };
    let t = '';
    switch (act) {
      case 'write': {
        if (d.id === 'letter' && !canWrite(p)) { const c = cost(0.01); if (p.money < c) return `You cannot write, and a scribe costs ${S.money(c)}.`; p.money -= c; t = 'A scribe wrote it down for you. '; }
        if (d.id === 'runner') { if (S.age(p) < 8) return 'You are too young to send a runner.'; t = `A runner carried your word to ${o.first}. `; }
        gain(far ? 6 : 3, far ? 12 : 7); st.sent[oid] = yr();
        t += far && d.id !== 'mobile' && d.id !== 'neural' ? `${o.first} will treasure it; the reply will take a while.` : `${o.first} ${U.pick(['wrote back warmly.', 'loved hearing from you.', 'replied with news of their own.'])}`;
        if (far && ['letter', 'telegraph', 'runner'].includes(d.id)) queue(o, p, 'reply', 1);
        break;
      }
      case 'fast': {
        const c = d.id === 'telegraph' ? cost(0.01) : d.id === 'telephone' ? cost(far ? 0.01 : 0.002) : 0;
        if (p.money < c) return `That costs ${S.money(c)}.`;
        p.money -= c; gain(4, 9); S.applyFx(p, { hp: 2 });
        t = d.id === 'telegraph' ? `STOP. Your telegram reached ${o.first} within the hour. STOP.` : d.id === 'neural' ? `You and ${o.first} shared a memory, as if you were there together.` : `You and ${o.first} talked for ages.`;
        break;
      }
      case 'advice': { gain(2, 5); const g = U.pick([['sm', 2], ['mh', 3], ['wp', 2]]); S.applyFx(p, { [g[0]]: g[1] }); t = `${o.first} had wise words. ${U.pick(['You wrote them down.', 'They helped more than you expected.', 'You will think about them for years.'])}`; break; }
      case 'gift': { const c = cost(0.05); if (p.money < c) return `You need ${S.money(c)}.`; p.money -= c; o.money += c; gain(8, 14); S.pers?.nudge(p, 'generous', 0.5); t = `You sent ${o.first} ${S.money(c)}. They were deeply touched.`; break; }
      case 'sorry': if (U.chance(0.55 + (S.pers?.has(o, 'patient') ? 0.15 : 0) - (S.pers?.has(o, 'hotheaded') ? 0.15 : 0))) { gain(10, 18); t = `${o.first} forgave you.`; } else { gain(1, 3); t = `${o.first} is not ready to forgive you yet.`; } break;
      case 'invite': { const c = far ? S.world.tripCost?.(o, p.cc) || cost(0.1) : cost(0.01); if (p.money < c) return `Their journey would cost ${S.money(c)}.`; p.money -= c; gain(8, 15); S.applyFx(p, { hp: 5 }); t = `${o.first} came to stay${far ? ' after a long journey' : ''}. You talked late into the night.`; break; }
      default: return '';
    }
    p.did[key] = 1;
    S.log(p, t.replace(/^STOP\. /, ''), 'life');
    return t;
  }

  /* ---------- the inbox ---------- */
  let nid = 1;
  function queue(from, to, kind, delay = 0, extra = {}) {
    const st = ph(to);
    st.inbox.push({ id: `${yr()}-${nid++}-${Math.random().toString(36).slice(2, 7)}`, from: from.id, y: yr() + delay, kind, read: false, done: false, ...extra });
    if (st.inbox.length > 60) st.inbox.splice(0, st.inbox.length - 60);
  }
  const TEMPLATES = {
    reply: o => [`${o.first} writes back at last: "Your ${device().msg} made my whole year. Things here are ${U.pick(['hard, but we manage', 'good', 'the same as ever', 'changing fast'])}."`, [['Write again', { c: 6 }, 'You wrote back the same day.'], ['Keep it to treasure', { hp: 2 }, 'You read it again and again.']]],
    news: (o, x) => [`${o.first} ${device().id === 'mobile' || device().id === 'neural' ? 'messaged' : 'wrote'}: "${firstPerson(x.t).slice(0, 160)}"`, [['Reply warmly', { c: 5, hp: 1 }, 'You wrote back straight away.'], ['Send congratulations or sympathy', { c: 7 }, 'They were glad you cared.'], ['Leave it', { c: -1 }, 'You meant to answer.']]],
    money: o => [`${o.first} asks if you could spare a little money. Times are hard.`, [['Send some', { $: -0.05, c: 12, rep: 1, trait: 'generous' }, 'They wept with relief.'], ['Say no kindly', { c: -3 }, 'They understood. Mostly.'], ['Ignore it', { c: -8, trait: 'greedy' }, 'The silence said enough.']]],
    invite: o => [`${o.first} invites you to ${U.pick(['a wedding', 'a naming feast', 'a birthday gathering', 'the harvest celebration'])}.`, [['Go and celebrate', { $: -0.02, c: 8, hp: 5 }, 'A wonderful day.'], ['Send a gift instead', { $: -0.01, c: 3 }, 'They thanked you for the gift.'], ['Decline', { c: -4 }, 'They noticed you were missing.']]],
    love: o => [`${o.first} left you a note: "${U.pick(['I think about you all day.', 'Thank you for being you.', 'Come home early tonight.', 'I love you, even when you snore.'])}"`, [['Reply with love', { c: 6, hp: 4 }, 'You smiled all day.'], ['A quick reply', { c: 1 }, 'Short and sweet.']]],
    advice: o => [`${o.first} asks your advice about ${U.pick(['a hard choice at work', 'a quarrel with a friend', 'whether to marry', 'what to do with their life'])}.`, [['Give careful advice', { c: 8, rep: 2 }, 'They took your advice, and it helped.'], ['Tell them what they want to hear', { c: 3 }, 'They were pleased, for now.']]],
    rival: o => [`${o.first} ${device().id === 'mobile' ? 'posted something nasty about you' : 'has been spreading stories about you'}.`, [['Answer back', { rep: 1, mh: -1, trait: 'hotheaded' }, 'You gave as good as you got.'], ['Rise above it', { mh: 2, trait: 'patient' }, 'People noticed who stayed calm.']]],
    spam: () => [U.pick(['CONGRATULATIONS! You have won a prize. Just send a small fee to claim it.', 'A prince needs help moving his fortune and will share it with you.', 'Your account is locked. Confirm your details here.']), [['Follow the link', { $: -0.1, mh: -3 }, 'It was a scam. Of course it was.'], ['Delete it', { sm: 0.5 }, 'Nice try.']]],
    fan: () => [U.pick(['A stranger writes that your work changed their life.', 'A fan asks for your autograph.', 'Someone named their child after you.']), [['Write back graciously', { hp: 4, fm: 1, rep: 1 }, 'They will frame your reply.'], ['Ignore it', {}, 'Fame is tiring.']]],
  };
  function inboxTick(p) {
    const st = ph(p), d = device();
    st.inbox = st.inbox.filter(m => !m.done && yr() - m.y <= 2);
    const people = S.known(p).filter(o => S.alive(o) && S.age(o) >= 8 && (p.rels[o.id]?.c ?? 50) >= 30);
    const young = S.age(p) < 12, cap = young ? 0 : S.age(p) < 16 ? 1 : 3;
    let n = 0;
    for (const o of U.shuffle(people)) {
      if (n >= cap) break;
      if (!U.chance(0.07)) continue;
      const r = p.rels[o.id], rl = S.relLabel(p, o);
      let kind = U.pick(['invite', 'advice', 'money', 'invite']);
      if (/Husband|Wife|Boyfriend|Girlfriend|Fiancé/.test(rl)) kind = 'love';
      if (r?.k === 'enemy') kind = 'rival';
      if (kind === 'money' && o.money > p.money) kind = 'invite';
      if (kind === 'advice' && S.age(o) >= S.age(p)) kind = 'invite';
      queue(o, p, kind); n++;
    }
    if (['mobile', 'neural'].includes(d.id) && S.age(p) >= 12 && U.chance(0.35)) queue(p, p, 'spam');
    if ((p.fm ?? 0) >= 40 && U.chance((p.fm - 30) / 100)) queue(p, p, 'fan');
  }
  function text(m, p) {
    const o = S.P(m.from) || p;
    const tpl = TEMPLATES[m.kind]; if (!tpl) return ['', []];
    if (!m.txt) { const [t, ch] = tpl(o, m); m.txt = t; m.ch = ch.map(c => [c[0], c[1], c[2]]); }
    return [m.txt, m.ch];
  }
  function answer(mid, i) {
    const p = S.me(), st = ph(p), m = st.inbox.find(x => x.id === mid); if (!m || m.done) return '';
    const [, ch] = text(m, p), c = ch[+i]; if (!c) return '';
    const [l, fx, t] = c, o = S.P(m.from);
    if (fx.$ && p.money < cost(-fx.$)) return 'You cannot afford that.';
    if (fx.$) p.money += cost(fx.$);
    if (o && o.id !== p.id && fx.c) { const r = S.rel(p, o); r.c = U.clamp(r.c + fx.c); if (fx.$ && fx.$ < 0 && m.kind === 'money') o.money += cost(-fx.$); }
    const f = { ...fx }; delete f.c; delete f.$; delete f.trait;
    S.applyFx(p, f);
    if (fx.trait) S.pers?.nudge(p, fx.trait, 0.6);
    m.done = true; m.read = true;
    S.log(p, `${o && o.id !== p.id ? `A ${device().msg} from ${o.first}: ` : ''}${t}`, 'life');
    return t;
  }

  /* ---------- the social feed ---------- */
  const POSTS = [
    ['selfie', 'Post a selfie', p => p.lk], ['update', 'Share a life update', p => 40 + (p.hp - 50) / 2], ['take', 'Post a hot take', p => p.sm * 0.6 + (p.im ?? 50) * 0.4],
    ['meme', 'Share a meme', p => p.im ?? 50], ['work', 'Promote your work', p => (p.fm ?? 0) + (p.job?.fame ? 30 : 0)], ['pet', 'Post a pet photo', p => (S.petsOf(p).length ? 75 : 0)],
  ];
  function post(kind) {
    const p = S.me(), st = ph(p), d = device();
    if (!d.social) return 'There is no feed to post on yet.';
    if (S.age(p) < 13) return 'You are too young for an account.';
    if (!st.handle) return 'Make an account first.';
    const used = st.posts.filter(x => x.y === yr()).length;
    if (used >= 3) return 'You have posted enough this year. Go outside.';
    const P = POSTS.find(x => x[0] === kind); if (!P) return '';
    if (kind === 'pet' && !S.petsOf(p).length) return 'You have no pet to show off.';
    const q = U.clamp(P[2](p) + U.ri(-25, 25) + (S.pers?.has(p, 'charming') ? 8 : 0), 0, 130);
    const base = Math.max(8, st.followers);
    let likes = Math.round(base * (0.02 + q / 900) * U.rand(0.5, 1.6)) + U.ri(0, 5);
    let gain = Math.round(likes * U.rand(0.05, 0.25));
    let viral = false, backlash = false;
    if (U.chance(0.012 + q / 4000 + ((p.fm ?? 0) / 5000))) { viral = true; const m = U.ri(5, 60); likes *= m; gain = Math.round(gain * m + U.ri(200, 5000)); }
    if (kind === 'take' && U.chance(0.2)) { backlash = true; gain = -Math.round(st.followers * U.rand(0.05, 0.2)); S.applyFx(p, { rep: -4, mh: -5 }); }
    st.followers = Math.max(0, st.followers + gain);
    const lines = { selfie: 'A new selfie.', update: `Life update: ${(p.log.filter(l => l.y === yr() && l.k !== 'quiet').slice(-1)[0]?.t || 'Just living.').slice(0, 120)}`, take: U.pick(['Unpopular opinion: everyone is wrong about everything.', 'Hot take: breakfast is overrated.', 'Somebody has to say it.']), meme: 'A meme that perfectly captures this year.', work: `New work out now${p.job ? ` from your favourite ${p.job.t.toLowerCase()}` : ''}.`, pet: `${S.petsOf(p)[0]?.n || 'My pet'} being a star.` };
    const comments = S.known(p).filter(o => S.alive(o) && S.age(o) >= 13 && U.chance(0.3)).slice(0, 3).map(o => { S.rel(p, o).c = U.clamp(S.rel(p, o).c + 1); return { from: o.id, t: U.pick(['Love this!', 'Ha!', 'So proud of you.', 'Call me sometime.', 'Iconic.', 'Where is this?']) }; });
    st.posts.push({ y: yr(), kind, t: lines[kind], likes, gain, viral, backlash, comments });
    if (st.posts.length > 40) st.posts.shift();
    S.applyFx(p, { hp: viral ? 10 : likes > 10 ? 3 : -1, fm: viral ? 6 : 0 });
    if (viral) S.log(p, `Your post went viral! ${U.fmtNum(gain)} new followers.`, 'good');
    if (backlash) S.log(p, 'Your hot take started a pile-on. You lost followers and sleep.', 'bad');
    if (st.followers >= 100000 && !st.verified) { st.verified = 1; S.log(p, 'Your account was verified. You have made it, online at least.', 'good'); }
    return viral ? `It went viral: ${U.fmtNum(likes)} likes!` : backlash ? 'The pile-on was brutal.' : `${U.fmtNum(likes)} likes${gain > 0 ? `, ${gain} new followers` : ''}.`;
  }
  function socialTick(p) {
    const st = ph(p), d = device();
    if (!d.social || !st.handle) return;
    const posted = st.posts.filter(x => x.y === yr()).length;
    st.followers = Math.round(st.followers * (posted ? 1.02 : 0.93));
    if (st.followers >= 10000 && posted >= 2) { const inc = S.toVal(S.era().cost * Math.min(40, st.followers / 50000)); p.money += inc; if (inc > S.toVal(S.era().cost * 0.2)) S.log(p, `Sponsors paid you ${S.money(inc)} for posts this year.`, 'money'); }
    if (st.followers >= 50000 && U.chance(0.12)) { S.applyFx(p, { mh: -4 }); S.log(p, 'Trolls swarmed your comments for weeks.', 'bad'); }
    const target = st.followers > 0 ? Math.log10(st.followers + 1) * 12 : 0;
    if (target > (p.fm ?? 0)) p.fm = U.clamp((p.fm ?? 0) + (target - (p.fm ?? 0)) * 0.25);
    if (st.followers >= 1000) p.flags.influencer = 1;
  }
  // what people you know are posting, made from their lives
  function feedOf(p) {
    const out = [];
    for (const o of S.known(p).filter(q => S.alive(q) && S.age(q) >= 13)) {
      const l = o.log.filter(x => x.y >= yr() - 1 && ['good', 'bad', 'love', 'family', 'work'].includes(x.k)).slice(-1)[0];
      if (l) out.push({ o, t: firstPerson(l.t).slice(0, 140), y: l.y });
    }
    return out.slice(0, 12);
  }

  /* ---------- hooks ---------- */
  S.addHook('postYear', p => { inboxTick(p); socialTick(p); });
  S.addHook('gossip', (p, news) => { if (S.age(p) < 10) return; for (const n of news) if (U.chance(0.4)) queue(n.o, p, 'news', 0, { t: n.t }); });
  S.snapAdd('Followers', p => p.phone?.followers || 0);
  DATA.achievements.push(
    { id: 'influencer', n: 'Influencer', d: 'Reach 10,000 followers.', test: p => (p.phone?.followers || 0) >= 10000 },
    { id: 'penpal', n: 'Pen Pal', d: 'Keep up a correspondence with someone in another land.', test: (p, S2) => Object.keys(p.phone?.sent || {}).some(id => S2.P(+id) && S2.P(+id).cc !== p.cc) },
  );
  const unread = p => (p.phone?.inbox || []).filter(m => !m.done && m.y <= yr()).length;
  return { device, contact, contactActs, answer, text, post, POSTS, feedOf, unread, ph, queue };
})();

const Sports = (() => {
  const S = Sim, yr = () => S.W.year;
  const LVL = ['Hobbyist', 'Club player', 'Regional star', 'Professional', 'Legend'];
  const NEED = [0, 20, 40, 60, 80];            // skill to try out for each level
  const PAY = [0, 0.2, 0.8, 3, 12];            // share of a year's living cost
  const spec = id => DATA.sports.find(s => s.id === id);
  const nameIn = (s, cc) => (s.cc && s.cc[cc]) || s.n;
  const avail = p => DATA.sports.filter(s => yr() >= s.from && yr() <= s.to && (!s.only || s.only.includes(p.cc)) && (!s.sex || s.sex === p.sex) && (!s.cls || (p.cls ?? 2) >= s.cls));
  const olympics = () => { const y = yr(); return (y >= -776 && y <= 393 && (y + 776) % 4 === 0) || (y >= 1896 && y % 4 === 0 && ![1916, 1940, 1944].includes(y)); };
  const label = p => { const s = p.sport && spec(p.sport.id); return s ? `${LVL[p.sport.lvl]} · ${nameIn(s, p.cc)} · skill ${Math.round(p.sport.skill)}` : ''; };
  const prime = a => (a < 14 ? 1.3 : a < 26 ? 1.15 : a < 31 ? 1 : a < 36 ? 0.6 : 0.3);
  const mult = p => (S.pers?.has(p, 'athletic') ? 1.3 : 1) * (S.pers?.has(p, 'diligent') ? 1.15 : 1) * (S.pers?.has(p, 'lazy') ? 0.7 : 1) * (0.7 + (p.wp ?? 50) / 170);

  function takeUp(id) {
    const p = S.me(), s = spec(id);
    if (!s || !avail(p).includes(s)) return 'That sport is not played here and now.';
    if (S.age(p) < 5) return 'You are a little young for that.';
    if (p.sport && p.sport.id === id) return 'You already play it.';
    const talent = s.mind ? (p.sm + (p.im ?? 50)) / 2 : (p.h + (p.lk ?? 50) * 0.2) / 1.2;
    p.sport = { id, skill: U.clamp(talent * 0.25 + U.ri(0, 12)), lvl: 0, yrs: 0, wins: 0, losses: 0, titles: 0, inj: 0, since: yr() };
    S.log(p, `You took up ${nameIn(s, p.cc).toLowerCase()}.`, 'life');
    return `You took up ${nameIn(s, p.cc).toLowerCase()}.`;
  }
  function train() {
    const p = S.me(), sp = p.sport; if (!sp) return '';
    if (p.did.train) return 'You already trained hard this year.';
    if (sp.inj) return 'You are injured. Rest first.';
    p.did.train = 1;
    const s = spec(sp.id), g = U.rand(3, 7) * prime(S.age(p)) * mult(p);
    sp.skill = U.clamp(sp.skill + g);
    S.applyFx(p, s.mind ? { sm: 1, h: -1 } : { h: 2, wp: 1, bmi: -0.3 });
    S.pers?.nudge(p, s.mind ? 'diligent' : 'athletic', 0.5);
    if (!s.mind && U.chance((s.risk || 0.01) + (S.pers?.has(p, 'reckless') ? 0.02 : 0))) { sp.inj = U.ri(1, 2); S.applyFx(p, { h: -10 }); S.log(p, 'You were injured in training.', 'bad'); return 'You pushed too hard and got hurt.'; }
    return `Training paid off. Skill ${Math.round(sp.skill)}.`;
  }
  function compete() {
    const p = S.me(), sp = p.sport; if (!sp) return '';
    if (p.did.compete) return 'You already competed this year.';
    if (sp.inj) return 'You are injured and cannot compete.';
    p.did.compete = 1;
    const s = spec(sp.id), oly = olympics() && sp.lvl >= 3;
    const opp = { n: `${S.pickName(p.sex, S.era(), p.cc)} ${U.pick((S.pool(S.era(), p.cc) || DATA.names.modern).last)}`, skill: U.clamp(NEED[sp.lvl] + U.ri(-5, 22) + (oly ? 12 : 0)) };
    const form = sp.skill + (s.mind ? p.sm / 10 : p.h / 8) + (p.wp ?? 50) / 12 - (s.mind ? 0 : Math.max(0, S.age(p) - 32) * 1.5);
    const odds = x => U.clamp(0.5 + (form + x - opp.skill - 12) / 40, 0.05, 0.95);
    const what = oly ? (yr() < 400 ? 'the Olympic Games at Olympia' : 'the Olympic Games') : ['a local match', 'the club championship', 'the regional finals', 'the national championship', 'the world championship'][sp.lvl];
    const play = x => {
      const won = U.chance(odds(x));
      if (won) {
        sp.wins++; sp.skill = U.clamp(sp.skill + 1);
        const prize = S.toVal(S.era().cost * PAY[sp.lvl] * 0.15);
        p.money += prize;
        S.applyFx(p, { hp: 8, fm: (1 + sp.lvl * 2) * (s.fame || 1), rep: 1 + sp.lvl });
        if (sp.lvl >= 1 && U.chance(0.35 + sp.lvl * 0.1)) { sp.titles++; if (oly) p.flags.olympic = (p.flags.olympic || 0) + 1; S.log(p, `You won ${what}! ${oly ? 'Olympic champion!' : 'A title for the record books.'}`, 'good'); p.flags.champion = 1; return `Champion of ${what}!`; }
        S.log(p, `You beat ${opp.n} at ${what}.`, 'good');
        return `You beat ${opp.n}!${prize > 0 ? ` Prize: ${S.money(prize)}.` : ''}`;
      }
      sp.losses++; S.applyFx(p, { hp: -4, mh: -1 });
      if (!s.mind && U.chance((s.risk || 0.015) * 1.5)) { sp.inj = U.ri(1, 2); S.applyFx(p, { h: -12 }); S.log(p, `You lost to ${opp.n} at ${what}, and were injured.`, 'bad'); return 'You lost, and got hurt.'; }
      S.log(p, `You lost to ${opp.n} at ${what}.`, 'bad');
      return `${opp.n} beat you.`;
    };
    S.prompt({ title: `${nameIn(s, p.cc)} · ${what}`, text: `You face ${opp.n}. They are ${opp.skill > form ? 'the favourite' : opp.skill > form - 10 ? 'evenly matched with you' : 'the underdog'}. How will you play it?`, choices: [
      { l: 'Play your own game', src: { l: 'play', odds: odds(0) }, go: () => play(0) },
      { l: 'Go all out', src: { l: 'play', odds: odds(6) }, go: () => { if (!s.mind && U.chance(0.08)) { sp.inj = 1; S.applyFx(p, { h: -8 }); } return play(6); } },
      { l: 'Play dirty', src: { l: 'cheat', odds: odds(10) }, go: () => { if (U.chance(0.3)) { S.applyFx(p, { rep: -8, fm: 2 }); sp.losses++; S.log(p, `You were disqualified at ${what} for foul play.`, 'bad'); return 'Disqualified for foul play!'; } S.pers?.nudge(p, 'deceitful', 1); return play(10); } }] });
    return `You entered ${what}.`;
  }
  function tryout() {
    const p = S.me(), sp = p.sport; if (!sp) return '';
    if (sp.lvl >= 4) return 'You are already a legend.';
    if (p.did.tryout) return 'You already tried out this year.';
    const next = sp.lvl + 1;
    if (sp.skill < NEED[next]) return `You need skill ${NEED[next]} to try out as a ${LVL[next].toLowerCase()}.`;
    if (next >= 3 && S.age(p) < 16) return 'You must be 16 to turn professional.';
    p.did.tryout = 1;
    if (!U.chance(U.clamp(0.35 + (sp.skill - NEED[next]) / 40 + S.hadd('odds', p, { tag: 'interview' }), 0.1, 0.9))) { S.applyFx(p, { hp: -4 }); return 'Not this time. Keep training.'; }
    sp.lvl = next;
    if (next >= 3) goPro(p);

/* =====================================================================
   LEGACY — wills and inheritance, disputes, heirlooms, and the traits
   a family earns over the generations.
   * Write a will: shares of your estate for each heir, heirlooms to
     named people, a gift to charity. Without one, the law of your land
     and age decides (primogeniture, Islamic shares, or equal division).
   * Unequal or unwritten estates can end in a family dispute that the
     heir must settle, fight in court, or ignore.
   * Heirlooms are named possessions that carry their story and prestige
     down the generations.
   * Dynasty traits grow from what your family's lives achieved, and
     tilt every child born into the house. The house gets a motto and
     a coat of arms.
   ===================================================================== */

const Legacy = (() => {
  const S = Sim, W = () => S.W, yr = () => S.W.year;

    medieval: ['a sword with a named blade', 'an illuminated psalter', 'a silver chalice'], renaissance: ['a family portrait in oils', 'a jewelled rapier', 'a brass astrolabe'],
    colonial: ['a pocket watch', 'a family bible', 'a silver tea service'], industrial: ['a gold watch', 'a cameo brooch', 'a music box'],
    wars: ['a medal for valour', 'a wedding ring', 'a fountain pen'], modern: ['a vintage guitar', 'a signed photograph', 'a diamond ring'],
    digital: ['a first-edition book', 'a designer watch', 'a vinyl collection'], near: ['a memory crystal', 'a hand-built robot'], far: ['a star-chart of the family voyages', 'a relic from Old Earth'],
  };
  const isHL = a => a.kind === 'heirloom';

  /* ---------- heirlooms ---------- */
  function makeHeirloom(p, t, val, how, name) {
    const a = { uid: W().nid++, id: 'heirloom', t: name ? `${name} (${t})` : t[0].toUpperCase() + t.slice(1), kind: 'heirloom', val, appr: 0.015, inc: 0, vol: 0, era: S.era().id, y: yr(),
      hl: { made: yr(), maker: p.id, prestige: 1, story: [{ y: yr(), who: p.id, t: how }] } };

    return a;
  }
  function commission(kind, name) {
    const p = S.me(), e = S.era(), list = HL[e.id] || HL.modern;
    const t = list[+kind] || list[0], price = S.toVal(e.cost * (0.4 + (+kind) * 0.3));

    if (p.money < price) return `That would cost ${S.money(price)}.`;
    p.money -= price;

    S.applyFx(p, { hp: 4, rep: 1 });

  }
  S.addHook('fx', (p, fx) => { if (fx.heirloom && p.id === W().playerId) makeHeirloom(p, fx.heirloom, S.toVal(S.era().cost * 0.2), fx.how || 'earned'); });
  // medals and trophies become heirlooms
  S.addHook('postYear', p => {
    if ((p.flags.medal || 0) > (p.flags.medalHL || 0)) { p.flags.medalHL = p.flags.medal; makeHeirloom(p, 'a medal for valour', S.toVal(S.era().cost * 0.2), 'won in battle'); S.log(p, 'You were given a medal for valour. It will be handed down.', 'good'); }

  });
  S.addHook('events', p => {
    const hls = p.assets.filter(isHL); if (!hls.length) return [];
    const a = U.pick(hls);

      { id: 'hlstory', p: 0.04, min: 8, t: `Over dinner, someone told the story of ${a.t.toLowerCase()} again.`, fx: { hp: 3, famc: 3 } },
      { id: 'hllost', p: 0.01, min: 10, t: `${a.t} has gone missing!`, ch: [{ l: 'Search everywhere', odds: 0.6, win: { t: 'It turned up behind a chest. Everyone breathed again.' }, alt: { go: 'losehl:' + a.uid, fx: { hp: -8 }, t: 'It was never found. A piece of the family is gone.' } }, { l: 'Accept the loss', go: 'losehl:' + a.uid, fx: { hp: -6 }, t: 'You told yourself it was only a thing.' }] },
    ];

    if (['ENG', 'FRA', 'SCA'].includes(cc) && y >= 1066 && y < 1925) return 'primogeniture';

        w.forEach(([k, n]) => add(k, (1 - sps) * n / tot)); if (sp) add(sp, sps);
      } else if (kids.length || sp) {
        const heirs = [...kids, ...(sp ? [sp] : [])];
        if (heirs.some(x => x.id === h.id)) { add(h, 0.5); heirs.filter(x => x.id !== h.id).forEach(x => add(x, 0.5 / Math.max(1, heirs.length - 1))); if (heirs.length === 1) add(h, 0.5); }
        else { add(h, 0.5); heirs.forEach(x => add(x, 0.5 / heirs.length)); }

  }

      { l: `Share it with them (${S.money(ask)})`, dis: h.money < ask, go: () => { h.money -= ask; who.forEach(o => { o.money += ask / who.length; S.rel(h, o).c = U.clamp(S.rel(h, o).c + 10); }); S.applyFx(h, { rep: 3, mh: 2 }); S.pers?.nudge(h, 'generous', 1); S.log(h, `You settled the inheritance dispute with ${names}.`, 'good'); return 'Peace in the family, at a price.'; } },

    { id: 'martial', n: 'Martial', d: 'Sons and daughters are born brave.', motto: 'By Courage Alone', test: q => !!q.flags.vet || (q.flags.medal || 0) > 0 || (q.flags.warwon || 0) > 0 },

/* =====================================================================
   AI — help, and a player that can play for you.
   Offline, always available:
   * advise(p): a ranked list of things worth doing now, each one tap.
   * autopilot(p, goal): plays a year toward a goal (wealth, family,
     fame, a long life, learning, power, balance, or "in character").
   * bestChoice(p, choices, goal): weighs each option's likely effects.
   With Claude (optional):
   * Ask an era-appropriate advisor anything about your life.
   * Talk freely with anyone you know, in character; the talk moves
     your closeness.
   * "Let Claude live this year": Claude picks this year's actions.
   * "Ask Claude" on any choice, and prose chapters for your story.
   Claude is reached through, in order: the hosted page's own access
   (claude.use("sample")), the Tempora server's /api/ai, or the player's
   own API key with the official Anthropic SDK loaded in the browser.
   ===================================================================== */

const AI = (() => {
  const S = Sim, yr = () => S.W.year;
  const GOALS = [['balanced', 'A good, balanced life'], ['wealth', 'Wealth'], ['family', 'A big, close family'], ['fame', 'Fame'], ['long', 'A long, healthy life'], ['scholar', 'Learning and wisdom'], ['power', 'Power and office'], ['character', 'Live in character (personality decides)']];
  const WEIGHTS = {
    balanced: { h: 1.2, hp: 1.2, sm: 0.6, lk: 0.4, rep: 0.8, mh: 1, im: 0.3, wp: 0.4, fm: 0.3, $: 0.8 },
    wealth: { h: 0.6, hp: 0.4, sm: 0.6, lk: 0.2, rep: 0.5, mh: 0.4, im: 0.1, wp: 0.3, fm: 0.2, $: 3 },
    family: { h: 0.8, hp: 1.2, sm: 0.3, lk: 0.6, rep: 0.6, mh: 0.9, im: 0.2, wp: 0.3, fm: 0.1, $: 0.5, love: 3 },
    fame: { h: 0.6, hp: 0.6, sm: 0.4, lk: 0.8, rep: 1.2, mh: 0.4, im: 0.6, wp: 0.3, fm: 3, $: 0.4 },
    long: { h: 3, hp: 0.8, sm: 0.2, lk: 0.1, rep: 0.2, mh: 1.5, im: 0.1, wp: 0.5, fm: 0, $: 0.4 },
    scholar: { h: 0.5, hp: 0.5, sm: 3, lk: 0.1, rep: 0.6, mh: 0.6, im: 1.2, wp: 0.8, fm: 0.3, $: 0.3 },
    power: { h: 0.6, hp: 0.4, sm: 0.8, lk: 0.5, rep: 2.5, mh: 0.4, im: 0.1, wp: 0.6, fm: 1.5, $: 1 },
    character: { h: 1, hp: 1, sm: 0.5, lk: 0.5, rep: 0.7, mh: 1, im: 0.5, wp: 0.5, fm: 0.5, $: 0.7 },
  };

  /* ---------- weighing choices ---------- */
  const mid = v => (Array.isArray(v) ? (v[0] + v[1]) / 2 : v || 0);
  function fxValue(p, fx, goal) {
    if (!fx) return 0;
    const w = WEIGHTS[goal] || WEIGHTS.balanced, e = S.era();
    let v = 0;
    for (const k of ['h', 'hp', 'sm', 'lk', 'rep', 'mh', 'im', 'wp', 'fm']) if (fx[k] != null) v += mid(fx[k]) * w[k] * (k === 'h' && p.h < 40 ? 2 : 1);
    const cash = (fx.$ != null ? S.toVal(mid(fx.$), e) : 0) + (fx.$c != null ? S.toVal(e.cost * mid(fx.$c), e) : 0);
    if (cash) v += (cash / Math.max(1, S.toVal(e.cost))) * 25 * w.$;

  function bestChoice(p, choices, goal = 'balanced') {
    let best = choices[0], bv = -Infinity;

    return best;
  }

    if (p.sp == null && !lover && a >= 18 && a <= 45 && actOK('u:love')) add(30, actOK('u:love').n, 'Marriage lifts happiness for life, and brings children.', 'activity', { id: 'u:love' });

      <div class="subtabs" role="tablist" style="margin-top:10px">${tabs.map(([id, n]) => `<button data-act="aiTab" data-v="${id}" aria-selected="${aiTab === id}">${n}</button>`).join('')}</div>

  ui.on.aiAsk = async () => {

    catch (e) { toast(e.message); el.textContent = 'Have Claude write this chapter as prose'; el.disabled = false; }

});

/* ---- sound.js ---- */
/* =====================================================================
   SOUND — generated music for each era and small sound effects, all
   synthesised with the Web Audio API (no audio files). Music starts on
   your first click (browsers block sound before that) and follows the
   era; effects mark ageing up, good and bad news, money, achievements,
   births and deaths. Settings live in this browser.
   ===================================================================== */

(() => {
  const S = Sim, ui = UI, { esc, sheet, toast } = ui;
  const KEY = 'tempora.sound';
  const cfg = Object.assign({ music: true, sfx: true, mv: 0.3, sv: 0.55 }, ui.store.get(KEY) || {});
  const save = () => ui.store.set(KEY, JSON.stringify(cfg));
  const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
  let ctx = null, master, music, sfx, timer = null, next = 0, step = 0, bar = 0, chord = 0, melody = 7, style = null, unlocked = false;

  // era -> scale (semitones), root (MIDI), tempo, instruments
  const STYLES = {
    prehistory: { scale: [0, 3, 5, 7, 10], root: 45, bpm: 66, lead: 'flute', pad: 'drone', bass: null, drums: 'tribal', prog: [0, 0, 3, 0] },
    ancient: { scale: [0, 1, 4, 5, 7, 8, 10], root: 50, bpm: 76, lead: 'lyre', pad: 'drone', bass: null, drums: 'frame', prog: [0, 1, 0, 6] },
    medieval: { scale: [0, 2, 3, 5, 7, 9, 10], root: 50, bpm: 70, lead: 'recorder', pad: 'drone', bass: null, drums: null, prog: [0, 3, 0, 4] },
    renaissance: { scale: [0, 2, 4, 5, 7, 9, 11], root: 52, bpm: 84, lead: 'lute', pad: 'lute', bass: 'soft', drums: null, prog: [0, 3, 4, 0] },
    colonial: { scale: [0, 2, 4, 5, 7, 9, 11], root: 55, bpm: 92, lead: 'harpsichord', pad: 'harpsichord', bass: 'harpsichord', drums: null, prog: [0, 4, 5, 3] },
    industrial: { scale: [0, 2, 3, 5, 7, 8, 11], root: 57, bpm: 84, lead: 'musicbox', pad: 'organ', bass: 'soft', drums: null, prog: [0, 5, 3, 4] },
    wars: { scale: [0, 2, 4, 5, 7, 9, 10], root: 53, bpm: 108, lead: 'piano', pad: 'piano', bass: 'walk', drums: 'brush', prog: [0, 5, 1, 4] },
    modern: { scale: [0, 2, 4, 7, 9], root: 55, bpm: 100, lead: 'synth', pad: 'synthpad', bass: 'synth', drums: 'kit', prog: [0, 4, 5, 3] },
    digital: { scale: [0, 3, 5, 7, 10], root: 50, bpm: 78, lead: 'epiano', pad: 'epiano', bass: 'sub', drums: 'lofi', prog: [0, 3, 5, 4] },
    near: { scale: [0, 2, 4, 6, 7, 9, 11], root: 52, bpm: 70, lead: 'glass', pad: 'warm', bass: 'sub', drums: 'soft', prog: [0, 1, 4, 3] },
    far: { scale: [0, 2, 4, 6, 8, 10], root: 48, bpm: 58, lead: 'glass', pad: 'space', bass: null, drums: null, prog: [0, 2, 4, 1] },
  };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    if (ctx || !AC) return !!ctx;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      music = ctx.createGain(); music.gain.value = cfg.mv; music.connect(master);
      sfx = ctx.createGain(); sfx.gain.value = cfg.sv; sfx.connect(master);
      return true;
    } catch { ctx = null; return false; }
  }
  // one note: type, frequency, start time, length, volume, envelope, destination
  function tone(f, t, len, vol, o = {}) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.wave || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = o.vib; lg.gain.value = f * 0.008; l.connect(lg).connect(osc.frequency); l.start(t); l.stop(t + len + 0.1); }
    if (o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide, t + len);
    const a = o.a ?? 0.01, r = o.r ?? len;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + r);
    let node = osc;
    if (o.lp) { const f2 = ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; osc.connect(f2); node = f2; }
    node.connect(g).connect(o.dest || music);
    osc.start(t); osc.stop(t + a + r + 0.05);
  }
  function noise(t, len, vol, o = {}) {
    const n = ctx.createBufferSource(), b = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * len)), ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = b;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'highpass'; f.frequency.value = o.f || 6000;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    n.connect(f).connect(g).connect(o.dest || music); n.start(t); n.stop(t + len);
  }
  const INST = {
    flute: (f, t, d) => tone(f, t, d, 0.05, { wave: 'sine', a: 0.08, r: d, vib: 5 }),
    lyre: (f, t, d) => tone(f, t, d * 1.5, 0.07, { wave: 'triangle', a: 0.005, r: d * 1.5 }),
    recorder: (f, t, d) => tone(f, t, d, 0.035, { wave: 'square', a: 0.05, r: d * 0.9, lp: 1800, vib: 4 }),
    lute: (f, t, d) => tone(f, t, d * 1.2, 0.06, { wave: 'triangle', a: 0.004, r: d * 1.2, lp: 2600 }),
    harpsichord: (f, t, d) => tone(f, t, d, 0.04, { wave: 'sawtooth', a: 0.003, r: d * 0.8, lp: 3200 }),
    musicbox: (f, t, d) => tone(f * 2, t, d * 1.6, 0.05, { wave: 'sine', a: 0.003, r: d * 1.6 }),
    organ: (f, t, d) => { tone(f, t, d, 0.02, { wave: 'sine', a: 0.1, r: d }); tone(f * 2, t, d, 0.012, { wave: 'sine', a: 0.1, r: d }); },
    piano: (f, t, d) => tone(f, t, d * 1.3, 0.06, { wave: 'triangle', a: 0.005, r: d * 1.3, lp: 3000 }),
    synth: (f, t, d) => tone(f, t, d * 0.8, 0.035, { wave: 'square', a: 0.01, r: d * 0.8, lp: 1600 }),
    synthpad: (f, t, d) => tone(f, t, d, 0.02, { wave: 'sawtooth', a: 0.3, r: d, lp: 900 }),
    epiano: (f, t, d) => { tone(f, t, d * 1.4, 0.045, { wave: 'sine', a: 0.01, r: d * 1.4 }); tone(f * 2, t, d * 0.5, 0.012, { wave: 'triangle', a: 0.005, r: d * 0.5 }); },
    glass: (f, t, d) => tone(f * 2, t, d * 2, 0.03, { wave: 'sine', a: 0.02, r: d * 2 }),
    warm: (f, t, d) => tone(f, t, d, 0.02, { wave: 'triangle', a: 0.6, r: d, lp: 1200 }),
    space: (f, t, d) => tone(f, t, d * 1.2, 0.02, { wave: 'sawtooth', a: 1.2, r: d * 1.2, lp: 700, vib: 0.3 }),
    drone: (f, t, d) => { tone(f / 2, t, d, 0.025, { wave: 'sawtooth', a: 0.8, r: d, lp: 500 }); tone(f * 0.75, t, d, 0.015, { wave: 'sine', a: 0.8, r: d }); },
  };
  const BASS = {
    soft: (f, t, d) => tone(f / 2, t, d, 0.05, { wave: 'sine', a: 0.02, r: d }),
    harpsichord: (f, t, d) => tone(f / 2, t, d * 0.6, 0.03, { wave: 'sawtooth', a: 0.003, r: d * 0.6, lp: 1200 }),
    walk: (f, t, d) => tone(f / 2, t, d * 0.9, 0.06, { wave: 'triangle', a: 0.01, r: d * 0.9 }),
    synth: (f, t, d) => tone(f / 2, t, d * 0.8, 0.05, { wave: 'square', a: 0.01, r: d * 0.8, lp: 500 }),
    sub: (f, t, d) => tone(f / 4, t, d, 0.07, { wave: 'sine', a: 0.02, r: d }),
  };
  const DRUMS = {
    tribal: (b, t) => { if (b % 2 === 0) tone(80, t, 0.25, 0.12, { glide: 40, a: 0.003, r: 0.25 }); if (b === 3) tone(120, t, 0.15, 0.06, { glide: 70, a: 0.003, r: 0.15 }); },
    frame: (b, t) => { tone(b === 0 ? 90 : 160, t, 0.18, b === 0 ? 0.08 : 0.04, { glide: 60, a: 0.003, r: 0.18 }); },
    brush: (b, t) => noise(t, 0.12, 0.02, { f: 3000 }),
    kit: (b, t) => { if (b % 2 === 0) tone(90, t, 0.2, 0.1, { glide: 45, a: 0.003, r: 0.2 }); else noise(t, 0.1, 0.03, { f: 1800, type: 'bandpass' }); noise(t, 0.04, 0.012); },
    lofi: (b, t) => { if (b === 0 || b === 2.5) tone(70, t, 0.25, 0.08, { glide: 40, a: 0.003, r: 0.25 }); if (b === 1 || b === 3) noise(t, 0.12, 0.025, { f: 1500, type: 'bandpass' }); noise(t, 0.03, 0.008); },
    soft: (b, t) => { if (b === 0) tone(60, t, 0.3, 0.05, { glide: 35, a: 0.01, r: 0.3 }); },
  };
  const note = (st, deg, oct = 0) => { const sc = st.scale, n = sc.length; const i = ((deg % n) + n) % n, o = Math.floor(deg / n); return st.root + sc[i] + 12 * (o + oct); };
  function schedule() {
    if (!ctx || !cfg.music || !style) return;
    const st = STYLES[style], beat = 60 / st.bpm;
    while (next < ctx.currentTime + 0.4) {
      const t = next, b = step % 4;
      if (b === 0) {
        chord = st.prog[bar % st.prog.length];
        if (st.pad) { const pad = INST[st.pad]; [0, 2, 4].forEach(k => pad(hz(note(st, chord + k)), t, beat * 4 * 0.95)); }
        bar++;
      }
      if (st.bass && (b === 0 || b === 2 || st.bass === 'walk')) BASS[st.bass](hz(note(st, chord + (st.bass === 'walk' ? [0, 2, 4, 5][b] : 0), -1)), t, beat * 0.95);
      if (st.drums) DRUMS[st.drums](b, t);
      if (Math.random() < 0.72) {
        melody += U.pick([-2, -1, -1, 0, 1, 1, 2, 3]);
        if (melody < 4) melody = 6; if (melody > 14) melody = 11;
        const len = Math.random() < 0.25 ? beat * 2 : beat;
        INST[st.lead](hz(note(st, melody + (Math.random() < 0.3 ? chord : 0), 1)), t + (Math.random() < 0.15 ? beat / 2 : 0), len * 0.9);
      }
      next += beat; step++;
    }
  }
  function startMusic() {
    if (!cfg.music || !init()) return;
    if (ctx.state === 'suspended') ctx.resume();
    style = S.W ? S.era().id : 'renaissance';
    if (!timer) { next = ctx.currentTime + 0.1; timer = setInterval(schedule, 120); }
  }
  function stopMusic() { if (timer) clearInterval(timer); timer = null; }
  function follow() { if (!S.W || !ctx) return; const id = S.era().id; if (id !== style) { style = id; bar = 0; } }

  /* ---------- effects ---------- */
  const SFX = {
    age: t => { tone(hz(72), t, 0.35, 0.08, { wave: 'sine', dest: sfx }); tone(hz(79), t + 0.09, 0.45, 0.07, { wave: 'sine', dest: sfx }); },
    good: t => { tone(hz(76), t, 0.2, 0.06, { wave: 'triangle', dest: sfx }); tone(hz(80), t + 0.08, 0.3, 0.06, { wave: 'triangle', dest: sfx }); },
    bad: t => { tone(hz(62), t, 0.25, 0.06, { wave: 'triangle', dest: sfx }); tone(hz(61), t + 0.1, 0.35, 0.05, { wave: 'triangle', dest: sfx }); },
    coin: t => { tone(hz(88), t, 0.08, 0.04, { wave: 'square', dest: sfx, lp: 5000 }); tone(hz(93), t + 0.06, 0.18, 0.04, { wave: 'square', dest: sfx, lp: 5000 }); },
    ach: t => [0, 4, 7, 12].forEach((k, i) => tone(hz(79 + k), t + i * 0.07, 0.35, 0.05, { wave: 'sine', dest: sfx })),
    death: t => { [0, 12, 19].forEach(k => tone(hz(45 + k), t, 3.2, k ? 0.03 : 0.08, { wave: 'sine', a: 0.005, r: 3.2, dest: sfx })); },
    birth: t => [0, 4, 7].forEach((k, i) => tone(hz(84 + k), t + i * 0.1, 0.4, 0.04, { wave: 'sine', dest: sfx })),
    click: t => tone(1100, t, 0.03, 0.02, { wave: 'sine', a: 0.002, r: 0.03, dest: sfx }),
  };
  function play(name) { if (!cfg.sfx || !unlocked || !init() || !SFX[name]) return; if (ctx.state === 'suspended') ctx.resume(); SFX[name](ctx.currentTime + 0.01); }
  function forDelta(d) {
    if (!d) return;
    const s = ['h', 'hp', 'sm', 'lk', 'rep', 'mh'].reduce((t, k) => t + (d[k] || 0), 0);
    if (d.$ && Math.abs(s) < 3) return play(d.$ > 0 ? 'coin' : 'bad');
    if (s >= 3) play('good'); else if (s <= -3) play('bad');
  }

  // first interaction unlocks audio
  const unlock = () => { if (unlocked) return; unlocked = true; if (cfg.music) startMusic(); };
  if (typeof document !== 'undefined') {
    document.addEventListener('pointerdown', unlock, { once: false, capture: true });
    document.addEventListener('keydown', unlock, { capture: true });
    document.addEventListener('visibilitychange', () => { if (!ctx) return; if (document.visibilityState === 'hidden') ctx.suspend(); else if (unlocked) ctx.resume(); });
  }
  let achN = -1, kids = -1;
  (ui.onAged ||= []).push(() => {
    follow();
    const p = S.me(); if (!p) return;
    if (S.W.dead) return play('death');
    if (achN >= 0 && p.ach.length > achN) play('ach');
    else if (kids >= 0 && p.kids.length > kids) play('birth');
    else play('age');
    achN = p.ach.length; kids = p.kids.length;
  });
  (ui.around ||= []).push({ after: el => { if (el.dataset.act === 'choose') play('click'); if (['heir', 'newHouse', 'begin', 'continue', 'becomeYes'].includes(el.dataset.act)) { follow(); const p = S.W && S.me(); achN = p ? p.ach.length : -1; kids = p ? p.kids.length : -1; } } });
  const death = ui.death;
  ui.death = () => { death(); play('death'); };

  function soundSheet() {
    sheet(`<h2>Music & sound</h2><p class="lede">Music is composed live for each era. Effects mark each year, good and bad news, money, achievements, births and deaths.</p>
      <label class="check"><input type="checkbox" data-input="sndMusic" ${cfg.music ? 'checked' : ''}> Music</label>
      <div class="field"><label for="snd-mv">Music volume</label><input id="snd-mv" type="range" min="0" max="100" value="${Math.round(cfg.mv * 100)}" data-input="sndMv"></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" data-input="sndSfx" ${cfg.sfx ? 'checked' : ''}> Sound effects</label>
      <div class="field"><label for="snd-sv">Effects volume</label><input id="snd-sv" type="range" min="0" max="100" value="${Math.round(cfg.sv * 100)}" data-input="sndSv"></div>
      ${AC ? '' : '<p class="why">This browser cannot play generated audio.</p>'}`, { label: 'Music and sound' });
  }
  ui.on.sound = () => { unlock(); soundSheet(); };
  ui.input.sndMusic = el => { cfg.music = el.checked; save(); if (cfg.music) startMusic(); else stopMusic(); };
  ui.input.sndSfx = el => { cfg.sfx = el.checked; save(); if (cfg.sfx) play('good'); };
  ui.input.sndMv = el => { cfg.mv = +el.value / 100; save(); if (music) music.gain.value = cfg.mv; };
  ui.input.sndSv = el => { cfg.sv = +el.value / 100; save(); if (sfx) sfx.gain.value = cfg.sv; play('click'); };
  ui.sound = { init: () => { }, play, forDelta, follow, cfg };
})();

/* ---- fusion.js ---- */
/* =====================================================================
   REALITY FUSION — merge all or part of another life into yours:
   stats, genes, people, country, wealth, career, memories, pets, or a
   whole other world's population. Sources: save slots, pasted saves,
   community posts, or past lives in your own dynasty.
   ===================================================================== */

const Fusion = (() => {
  const S = Sim;
  const STATS = ['h', 'hp', 'sm', 'lk', 'rep', 'mh', 'fe', 'im', 'wp', 'fm'];

  // Copy people from another world into this one with fresh ids
  function importPeople(src, ids, keepAges) {
    const w = S.W, map = {}, shift = keepAges ? U.span(src.year, w.year) : 0;
    for (const id of ids) map[id] = w.nid++;
    const out = [];
    for (const id of ids) {
      const o = JSON.parse(JSON.stringify(src.people[id]));
      o.id = map[id]; o.born = U.add(o.born, shift); if (o.died != null) o.died = U.add(o.died, shift);
      if (o.born > w.year) o.born = w.year;
      o.fa = map[o.fa] ?? null; o.mo = map[o.mo] ?? null; o.sp = map[o.sp] ?? null;
      o.kids = o.kids.map(k => map[k]).filter(Boolean); o.exes = o.exes.map(k => map[k]).filter(Boolean);
      o.rels = Object.fromEntries(Object.entries(o.rels).filter(([k]) => map[k]).map(([k, v]) => [map[k], v]));
      o.played = false; o.log = o.log.slice(-20); o.fused = 1; o.did = {}; o.places = null;
      if (o.job && !S.jobsNow(S.era(), o.cc).some(j => j.id === o.job.id)) { o.job = null; }
      S.ensurePerson(o);
      w.people[o.id] = o; out.push(o);
    }
    return { out, map };
  }
  const knownIn = (src, p) => {
    const ids = new Set();
    const add = id => id != null && src.people[id] && ids.add(+id);
    [p.fa, p.mo, p.sp, ...p.kids, ...p.exes, ...Object.keys(p.rels)].forEach(add);
    for (const id of [...ids]) { const q = src.people[id]; [q.fa, q.mo, ...q.kids].forEach(add); }
    ids.delete(p.id);
    return [...ids].filter(id => src.people[id].died == null).slice(0, 40);
  };

  function fuse(src, srcId, o) {
    const w = S.W, p = S.me(), internal = src === w;
    const sp = src.people[srcId ?? src.playerId];
    if (!sp) return 'Nothing to fuse with.';
    const done = [];
    if (o.stats) {
      for (const k of STATS) {
        const a = p[k] ?? 50, b = sp[k] ?? 50;
        p[k] = U.clamp(Math.round(o.stats === 'blend' ? (a + b) / 2 : o.stats === 'best' ? Math.max(a, b) : b));
      }
      done.push('stats');
    }
    if (o.genes && sp.g) {
      p.g = o.genes === 'child' ? Gen.cross(p.sex === 'M' ? p.g : sp.g, p.sex === 'M' ? sp.g : p.g, p.sex) : JSON.parse(JSON.stringify(sp.g));
      if (o.genes === 'theirs' && sp.sex !== p.sex) p.g.cb = p.g.cb.slice(0, p.sex === 'M' ? 1 : 2).concat(p.sex === 'F' && p.g.cb.length === 1 ? [0] : []);
      delete p.phx; done.push('genes');
    }
    if (o.country && sp.cc && S.world.C(sp.cc) && w.year >= S.world.C(sp.cc).from) { p.cc = sp.cc; done.push('country'); }
    if (o.wealth && !internal) {
      p.money += Math.max(0, sp.money);
      for (const a of sp.assets || []) p.assets.push({ ...a, uid: w.nid++ });
      done.push('wealth');
    }
    if (o.career) {
      p.edu = Math.max(p.edu, sp.edu || 0);
      if (sp.title && !p.title) p.title = sp.title;
      p.cls = Math.max(p.cls ?? 2, sp.cls ?? 2);
      if (sp.job && !p.job) { const j = S.jobsNow(S.era(), p.cc).find(x => x.id === sp.job.id); if (j) S.giveJob(p, j); }
      done.push('career');
    }
    if (o.memories) {
      const mem = (sp.log || []).filter(l => !['quiet'].includes(l.k)).slice(-25);
      for (const l of mem) S.log(p, `Fused memory · ${U.fmtYearAD(l.y)}, age ${l.a}: ${l.t}`, 'fused');
      done.push('memories');
    }
    if (o.pets && !internal) {
      for (const pet of Object.values(src.pets || {})) if (pet.owner === sp.id && pet.died == null) { const id = w.nid++; w.pets[id] = { ...pet, id, owner: p.id, born: U.add(w.year, -(src.year - pet.born)) }; }
      done.push('pets');
    }
    if (o.people && !internal) {
      const ids = o.people === 'world' ? Object.keys(src.people).map(Number).filter(id => src.people[id].died == null && id !== sp.id).slice(0, 300) : knownIn(src, sp);
      const all = o.self ? [sp.id, ...ids] : ids;
      const { out, map } = importPeople(src, all, o.keepAges);
      const twin = map[sp.id] && S.P(map[sp.id]);
      if (twin) {
        twin.first = twin.first; twin.flags ||= {}; twin.flags.echo = 1;
        if (o.people === 'family') { twin.fa = p.fa; twin.mo = p.mo; [S.P(p.fa), S.P(p.mo)].forEach(x => x && x.kids.push(twin.id)); }
        p.rels[twin.id] = { k: o.people === 'family' ? 'fam' : 'friend', c: 70 };
      }
      for (const q of out) if (q !== twin && sp.rels[Object.keys(map).find(k => map[k] === q.id)]) p.rels[q.id] ||= { k: 'friend', c: U.ri(40, 70) };
      if (o.people === 'world') for (const n of src.news || []) if (!w.news.some(x => x.t === n.t)) w.news.push({ ...n, t: `${n.t} (another reality)` });
      done.push(`${out.length} people`);
    }
    if (internal && o.people) {
      for (const [k, r] of Object.entries(sp.rels)) { const q = S.P(+k); if (q && S.alive(q) && q.id !== p.id) p.rels[q.id] ||= { k: r.k === 'fam' ? 'friend' : r.k, c: Math.round(r.c * 0.7) }; }
      done.push('old ties');
    }
    p.flags.fused = 1;
    S.log(p, `Reality fusion with ${sp.first} ${sp.last}: ${done.join(', ') || 'nothing changed'}.`, 'switch');
    S.checkAch(p);
    return done.length ? `Fused: ${done.join(', ')}.` : 'Nothing was selected to fuse.';
  }
  return { fuse, STATS };
})();
