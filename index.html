/* ---- platform.js ---- */
/* =====================================================================
   PLATFORM — the browser side of the Tempora server (server/server.js).
   When the game is served by a Tempora server, this adds real accounts,
   cloud saves that follow you between devices (with an optional synced
   autosave), a shared community backend with live updates, and Claude
   through the server. Opened as a plain file, it stays out of the way.
   ===================================================================== */

const Platform = (() => {
  let info = null, user = null;
  const subs = [];
  const changed = () => subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  async function api(method, path, body) {
    const r = await fetch(path, { method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || `The server said ${r.status}.`), { status: r.status, code: j.code });
    return j;
  }
  async function init() {
    // static hosts such as GitHub Pages can't run the platform server, so don't look for one
    if (typeof location === 'undefined' || !/^https?:$/.test(location.protocol) || window.TEMPORA_HOSTED || /\.github\.io$/.test(location.hostname)) return;
    try { const j = await api('GET', '/api/ping'); if (!j.tempora) return; info = j; } catch { return; }
    try { user = (await api('GET', '/api/auth/me')).user; } catch { user = null; }
    changed();
  }
  const on = () => !!info;
  async function register(username, password, handle) { user = (await api('POST', '/api/auth/register', { username, password, handle })).user; changed(); return user; }
  async function login(username, password) { user = (await api('POST', '/api/auth/login', { username, password })).user; changed(); return user; }
  async function logout() { await api('POST', '/api/auth/logout').catch(() => {}); user = null; changed(); }
  const saves = {
    list: async () => (await api('GET', '/api/saves')).saves,
    get: async slot => (await api('GET', `/api/saves/${slot}`)).data,
    put: (slot, data, meta) => api('PUT', `/api/saves/${slot}`, { data, meta }),
    del: slot => api('DELETE', `/api/saves/${slot}`),
  };
  async function aiAsk(body) {
    try { return await api('POST', '/api/ai', body); } catch (e) { return { error: e.message, code: e.code || 'upstream_error' }; }
  }

  // The community interface community.js expects, backed by the server
  function communityApi(onChange) {
    let st = { members: {}, posts: [] }, es = null;
    const pull = async () => { try { st = await api('GET', '/api/community'); onChange(); } catch { /* offline for now */ } };
    pull();
    try { es = new EventSource('/api/community/events'); es.addEventListener('changed', pull); } catch { setInterval(pull, 15000); }
    return {
      mode: 'server',
      me() { return user && st.members[user.id] ? { id: user.id, ...st.members[user.id] } : null; },
      accounts() { return []; },
      async setProfile(pr) { if (!user) throw new Error('Sign in first: Menu → Account.'); await api('POST', '/api/community/profile', pr); await pull(); },
      members() { return Object.entries(st.members).map(([id, m]) => ({ id, ...m })); },
      posts() { return st.posts; },
      async post(x, snap) { const r = await api('POST', '/api/community/posts', { ...x, snap }); await pull(); return r.id; },
      async like(id) { await api('POST', `/api/community/posts/${id}/like`); },
      async comment(id, text) { await api('POST', `/api/community/posts/${id}/comments`, { text }); },
      async del(id) { await api('DELETE', `/api/community/posts/${id}`); },
      async follow(uid) { await api('POST', `/api/community/follow/${uid}`); },
      async snap(id) { return (await api('GET', `/api/community/snaps/${id}`)).data; },
      async names() { return {}; },
    };
  }
  return { init, on, user: () => user, info: () => info, ai: () => !!(info && info.ai && user), register, login, logout, saves, aiAsk, communityApi, onChange: f => subs.push(f) };
})();

/* ---------------- Account & cloud saves (Menu → Account) ---------------- */
(() => {
  const S = Sim, ui = UI, { $, esc, toast, sheet, render } = ui;
  const meta = w => `${U.house(w.dyn.name)} · ${U.fmtYearAD(w.year)} · ${w.people[w.playerId]?.first || ''}`;
  async function accountSheet(res) {
    if (!Platform.on()) {
      sheet(`<h2>Account</h2><p class="lede">Accounts, cloud saves and a shared community need the Tempora server. Opened as a file, the game keeps everything in this browser.</p>
        <p class="faint" style="font-size:13px">To host it: install Node 18+, run <span class="mono">node server/server.js</span> in the game folder, and open the address it prints. Anyone who can reach the server can make an account and play across devices.</p>`, { label: 'Account' });
      return;
    }
    const u = Platform.user();
    if (!u) {
      sheet(`<h2>Your Tempora account</h2><p class="lede">Sign in to keep your dynasties in the cloud, play them on any device, and join the shared community${Platform.info()?.ai ? ', and talk with Claude' : ''}.</p>
        <div class="form"><div class="field"><label for="ac-user">Username</label><input id="ac-user" autocomplete="username" maxlength="24"></div>
        <div class="field"><label for="ac-pw">Password</label><input id="ac-pw" type="password" autocomplete="current-password" maxlength="200"></div></div>
        ${res ? `<div class="result">${esc(res)}</div>` : ''}
        <div class="btnrow" style="margin-top:12px"><button class="btn era" data-act="acLogin">Sign in</button><button class="btn" data-act="acRegister">Create account</button></div>
        <p class="faint" style="font-size:12px;margin:8px 0 0">Usernames are 3–24 letters, numbers or underscores. Passwords need at least 8 characters.</p>`, { label: 'Account' });
      return;
    }
    let list = [];
    try { list = await Platform.saves.list(); } catch (e) { res = e.message; }
    const slot = s => list.find(x => x.slot === s);
    sheet(`<h2>Your Tempora account</h2><p class="lede">Signed in as <b>${esc(u.handle)}</b> <span class="faint">(@${esc(u.username)})</span>.</p>
      <label class="check"><input type="checkbox" data-input="acSync" ${ui.store.get('tempora.cloudsync') ? 'checked' : ''}> Sync my autosave to the cloud every year</label>
      <div class="eyebrow" style="margin-top:14px">Cloud saves</div>
      <div class="list" style="margin-top:6px">${['auto', '1', '2', '3', '4', '5'].map(s => { const x = slot(s); return `<div class="row"><div class="main"><div class="t">${s === 'auto' ? 'Cloud autosave' : `Cloud slot ${s}`}</div><div class="s">${x ? `${esc(x.meta?.label || '')} · saved ${new Date(x.updated).toLocaleString()}` : 'empty'}</div></div>
        <div class="btnrow">${S.W && s !== 'auto' ? `<button class="btn sm" data-act="acSave" data-s="${s}">Save here</button>` : ''}${x ? `<button class="btn sm era" data-act="acLoad" data-s="${s}">Load</button>` : ''}</div></div>`; }).join('')}</div>
      ${res ? `<div class="result">${esc(res)}</div>` : ''}
      <div class="btnrow" style="margin-top:14px"><button class="btn" data-act="acLogout">Sign out</button></div>`, { label: 'Account' });
  }
  const guard = async (f, ok) => { try { const r = await f(); ui.open = null; accountSheet(ok || r); } catch (e) { ui.open = null; accountSheet(e.message); } };
  ui.on.account = () => { ui.open = null; accountSheet(); };
  ui.on.acLogin = () => guard(() => Platform.login($('#ac-user').value.trim(), $('#ac-pw').value), 'Welcome back.');
  ui.on.acRegister = () => guard(() => Platform.register($('#ac-user').value.trim(), $('#ac-pw').value), 'Account created. Welcome to Tempora.');
  ui.on.acLogout = () => guard(() => Platform.logout(), 'Signed out.');
  ui.on.acSave = el => guard(() => Platform.saves.put(el.dataset.s, JSON.parse(S.serialize()), meta(S.W)), `Saved to cloud slot ${el.dataset.s}.`);

  ui.input.acSync = el => { ui.store.set('tempora.cloudsync', JSON.stringify(el.checked)); if (el.checked) push(true); };
  // synced autosave: at most every 20 seconds, after each year

/* ---- community.js ---- */
/* =====================================================================
   COMMUNITY — profiles, a feed of shared lives, likes, comments,
   follows and a leaderboard. Two backends with one interface:
     hosted: the page's shared database, with each viewer's Claude identity
     local:  profiles and posts kept in this browser
   Shared lives can be played as a copy or fused into your own life.
   ===================================================================== */

const Community = (() => {
  let api = null, listeners = [];
  const changed = () => listeners.forEach(f => f());
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function localApi() {
    const KEY = 'tempora.community';
    // Kept in memory, and in browser storage when it is available
    let mem = UI.store.get(KEY) || { members: {}, posts: {}, snaps: {}, me: null }, warned = false;
    const load = () => mem;
    const save = d => {
      mem = d;
      if (!UI.store.set(KEY, JSON.stringify(d)) && !warned) { warned = true; UI.toast('Browser storage is unavailable, so the community will be forgotten when you close the page.'); }
      changed();
    };
    try { window.addEventListener('storage', e => { if (e.key === KEY) { mem = UI.store.get(KEY) || mem; changed(); } }); } catch { /* ignore */ }
    return {
      mode: 'local',
      me() { const d = load(); return d.me && d.members[d.me] ? { id: d.me, ...d.members[d.me] } : null; },
      accounts() { return Object.entries(load().members).map(([id, m]) => ({ id, ...m })); },
      async switchTo(id) { const d = load(); d.me = id; save(d); },
      async newAccount() { const d = load(); d.me = null; save(d); },
      async setProfile(pr) { const d = load(); let id = d.me; if (!id) { id = 'local-' + rid(); d.me = id; } d.members[id] = { following: [], joined: Date.now(), ...(d.members[id] || {}), ...pr }; save(d); },
      members() { return Object.entries(load().members).map(([id, m]) => ({ id, ...m })); },
      posts() { return Object.values(load().posts).sort((a, b) => b.t - a.t); },
      async post(x, snap) { const d = load(), id = 'p' + rid(); d.posts[id] = { id, author: d.me, t: Date.now(), likes: {}, comments: {}, ...x, hasSnap: !!snap }; if (snap) d.snaps[id] = snap; save(d); return id; },
      async like(id) { const d = load(), p = d.posts[id]; if (!p) return; p.likes[d.me] = !p.likes[d.me]; save(d); },
      async comment(id, text) { const d = load(); d.posts[id].comments[rid()] = { a: d.me, t: Date.now(), x: text }; save(d); },
      async del(id) { const d = load(); delete d.posts[id]; delete d.snaps[id]; save(d); },
      async follow(uid) { const d = load(), m = d.members[d.me], f = new Set(m.following || []); f.has(uid) ? f.delete(uid) : f.add(uid); m.following = [...f]; save(d); },
      async snap(id) { return load().snaps[id] || null; },
      async names() { return {}; },
    };
  }

  async function hostedApi() {
    const cl = window.claude;
    if (!cl || typeof cl.use !== 'function') return null;
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
    if (!db || !user) return null;
    const uid = await user.id();
    if (!uid) return null;
    const st = { members: {}, posts: [] };
    db.collection('members').onSnapshot(s => { st.members = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); changed(); }, () => {});
    db.collection('posts').orderBy('t', 'desc').limit(80).onSnapshot(s => { st.posts = s.docs.map(d => ({ id: d.id, ...d.data() })); changed(); }, () => {});
    return {
      mode: 'hosted', uid,
      me() { return st.members[uid] ? { id: uid, ...st.members[uid] } : null; },
      accounts() { return []; },
      async setProfile(pr) { const cur = st.members[uid] || { following: [], joined: Date.now() }; await db.doc('members/' + uid).set({ ...cur, ...pr }); },
      members() { return Object.entries(st.members).map(([id, m]) => ({ id, ...m })); },
      posts() { return st.posts; },
      async post(x, snap) { const ref = await db.collection('posts').add({ author: uid, t: Date.now(), likes: {}, comments: {}, ...x, hasSnap: !!snap }); if (snap) await db.doc('snaps/' + ref.id).set({ data: snap }); return ref.id; },
      async like(id) { const p = st.posts.find(x => x.id === id); await db.doc('posts/' + id).update({ likes: { [uid]: !(p?.likes?.[uid]) } }); },
      async comment(id, text) { await db.doc('posts/' + id).update({ comments: { [rid()]: { a: uid, t: Date.now(), x: text } } }); },
      async del(id) { await db.doc('posts/' + id).delete(); await db.doc('snaps/' + id).delete(); },
      async follow(target) { const f = new Set(st.members[uid]?.following || []); f.has(target) ? f.delete(target) : f.add(target); await db.doc('members/' + uid).update({ following: [...f] }); },
      async snap(id) { const s = await db.doc('snaps/' + id).get(); return s.exists ? s.data().data : null; },
      async names(ids) { const ps = await user.profiles(ids); return Object.fromEntries(ids.map(i => [i, ps[i]?.name || ''])); },
    };
  }

  async function init() {
    api = localApi();
    // Served by a Tempora server: one shared community for every account
    if (typeof Platform !== 'undefined' && Platform.on()) { api = Platform.communityApi(changed); Platform.onChange(changed); changed(); return; }
    try { const h = await hostedApi(); if (h) { api = h; changed(); } } catch { /* stay local */ }
  }
  return { init, get api() { return api; }, onChange: f => listeners.push(f) };
})();

/* ---- tree.js ---- */
/* =====================================================================
   FAMILY TREE — SVG, generational layout with couples, pan and zoom.
   Roots are the topmost known ancestors of every life you have played.
   ===================================================================== */

(() => {
  const S = Sim, ui = UI, { $, esc } = ui;
  const NW = 156, NH = 54, SG = 16, HG = 20, VG = 70;
  const view = { root: null, x: 0, y: 0, k: 0.9, fitted: false, nodes: [], w: 0, h: 0 };

  function descendants(p) {
    const seen = new Set(), st = [p.id];
    while (st.length) { const id = st.pop(); if (seen.has(id)) continue; seen.add(id); S.P(id)?.kids.forEach(k => st.push(k)); }
    return seen;
  }
  const partnersOf = p => {
    const ids = new Set([p.sp, ...p.exes, ...S.kids(p).map(k => (k.fa === p.id ? k.mo : k.fa))].filter(x => x != null && S.P(x)));
    return [...ids].filter(id => id === p.sp || S.P(id).kids.some(k => p.kids.includes(k)));
  };

  function roots() {
    const top = new Map();
    const up = (p, seen) => { if (!p || seen.has(p.id)) return; seen.add(p.id); const ps = S.parents(p); if (!ps.length) top.set(p.id, p); ps.forEach(q => up(q, seen)); };
    S.W.dyn.played.map(S.P).filter(Boolean).forEach(p => up(p, new Set()));
    let list = [...top.values()].map(p => ({ p, d: descendants(p) }));
    // one entry per founding couple
    list = list.filter(r => !partnersOf(r.p).some(id => id < r.p.id && top.has(id)));
    // drop people who merely married into a larger line
    list = list.filter(r => !partnersOf(r.p).some(id => list.some(o => o !== r && !partnersOf(o.p).includes(r.p.id) && o.d.has(id))));
    return list.map(r => ({ p: r.p, d: r.d, n: r.d.size })).sort((a, b) => b.n - a.n);
  }

  function build(root) {
    const seen = new Set();
    const mk = (p, d) => {
      seen.add(p.id);
      const partners = partnersOf(p).filter(id => !seen.has(id)).map(S.P);
      partners.forEach(x => seen.add(x.id));
      const n = { p, partners, d, kids: [] };
      if (d < 60) for (const k of S.kids(p).sort((a, b) => a.born - b.born)) if (!seen.has(k.id)) n.kids.push(mk(k, d + 1));
      return n;
    };
    const t = mk(root, 0);
    const measure = n => {
      n.uw = NW * (1 + n.partners.length) + SG * n.partners.length;
      n.kw = n.kids.reduce((s, k) => s + measure(k), 0) + HG * Math.max(0, n.kids.length - 1);
      n.w = Math.max(n.uw, n.kw);
      return n.w;
    };
    measure(t);
    const nodes = [], links = [];
    let maxD = 0;
    const place = (n, left) => {
      n.x = left + (n.w - n.uw) / 2; n.y = n.d * (NH + VG); maxD = Math.max(maxD, n.d);
      nodes.push({ p: n.p, x: n.x, y: n.y });
      n.partners.forEach((q, i) => {
        const x = n.x + (i + 1) * (NW + SG);
        nodes.push({ p: q, x, y: n.y });
        links.push(`<path class="${q.id === n.p.sp ? 'tlink' : 'tmar'}" d="M${x - SG} ${n.y + NH / 2}H${x}"/>`);
      });
      let kx = left + (n.w - n.kw) / 2;
      for (const k of n.kids) { place(k, kx); kx += k.w + HG; }
      if (n.kids.length) {
        const x0 = n.partners.length ? n.x + NW + SG / 2 : n.x + NW / 2, y0 = n.partners.length ? n.y + NH / 2 : n.y + NH;
        const ym = n.y + NH + VG / 2, cx = n.kids.map(k => k.x + NW / 2);
        links.push(`<path class="tlink" d="M${x0} ${y0}V${ym}M${Math.min(x0, ...cx)} ${ym}H${Math.max(x0, ...cx)}${cx.map((c, i) => `M${c} ${ym}V${n.kids[i].y}`).join('')}"/>`);
      }
    };
    place(t, 0);
    return { nodes, links, w: t.w, h: (maxD + 1) * (NH + VG) - VG };
  }

  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
  function nodeSVG({ p, x, y }) {
    const me = p.id === S.W.playerId, dead = !S.alive(p);
    const yrs = dead ? `${U.fmtYear(p.born)} – ${U.fmtYear(p.died)}` : `b. ${U.fmtYear(p.born)} · age ${S.age(p)}`;
    return `<g class="tn${me ? ' me' : ''}${dead ? ' dead' : ''}" data-id="${p.id}" transform="translate(${x},${y})" style="cursor:pointer">
      <title>${esc(S.fullName(p))}, ${esc(yrs)}</title>
      <rect class="box" width="${NW}" height="${NH}" rx="8"/>
      <rect x="0" y="0" width="5" height="${NH}" rx="2" fill="${ui.bornCol(p)}"/>
      <text class="nm" x="14" y="23">${dead ? '† ' : ''}${esc(clip(`${p.first} ${p.last}`, dead ? 16 : 18))}</text>
      <text class="yr" x="14" y="41">${esc(yrs)}</text>
      ${p.played ? `<text class="crown" x="${NW - 10}" y="18" text-anchor="end">◆</text>` : ''}</g>`;
  }

  ui.views.tree = () => {
    const rs = roots();
    if (!rs.length) return '<p class="muted">No family recorded yet.</p>';
    const pl = S.me();
    if (!view.root || !rs.some(r => r.p.id === view.root)) {
      const withMe = rs.filter(r => r.d.has(pl.id));
      view.root = (withMe.find(r => r.p.last === S.W.dyn.name) || withMe[0] || rs[0]).p.id;
      view.fitted = false;
    }
    const t = build(S.P(view.root));
    Object.assign(view, { nodes: t.nodes, w: t.w, h: t.h });
    const eras = [...new Set(t.nodes.map(n => S.eraOf(n.p.born)))];
    return `<div class="treebar"><label class="faint" for="treeRoot" style="font-size:13px">Line of</label>
        <select id="treeRoot" data-input="treeRoot">${rs.map(r => `<option value="${r.p.id}" ${r.p.id === view.root ? 'selected' : ''}>${esc(r.p.first)} ${esc(r.p.last)} (b. ${U.fmtYear(r.p.born)}) · ${r.n} descendants</option>`).join('')}</select>
        <span style="flex:1"></span>
        <button class="iconbtn" data-act="treeZoom" data-f="0.8" aria-label="Zoom out">−</button><button class="iconbtn" data-act="treeZoom" data-f="1.25" aria-label="Zoom in">+</button>
        <button class="btn sm" data-act="treeFit">Fit</button><button class="btn sm" data-act="treeMe">Find me</button></div>
      <div class="treewrap" id="treewrap"><svg id="treesvg" role="img" aria-label="Family tree, ${t.nodes.length} people"><g id="tv">${t.links.join('')}${t.nodes.map(nodeSVG).join('')}</g></svg></div>
      <div class="legend">${eras.map(e => `<span><i style="background:${ui.eraCol(e)}"></i>${esc(e.name)}</span>`).join('')}<span>◆ a life you played</span><span>— married · - - former partner</span></div>
      <p class="faint" style="font-size:13px;margin:8px 2px 0">Drag to pan. Scroll or pinch to zoom. Tap anyone to read their life, or become them.</p>`;
  };

  const apply = () => $('#tv')?.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  function zoomAt(pt, f) {
    const k2 = U.clamp(view.k * f, 0.12, 2.5); f = k2 / view.k;
    view.x = pt.x - (pt.x - view.x) * f; view.y = pt.y - (pt.y - view.y) * f; view.k = k2;
  }
  function fit() {
    const r = $('#treewrap').getBoundingClientRect();
    view.k = Math.min(1, (r.width - 40) / Math.max(1, view.w), (r.height - 40) / Math.max(1, view.h));
    view.x = (r.width - view.w * view.k) / 2; view.y = 20;
  }
  function findMe() {
    const r = $('#treewrap').getBoundingClientRect(), n = view.nodes.find(x => x.p.id === S.W.playerId);
    if (!n) return fit();
    view.k = Math.max(view.k, 0.75);
    view.x = r.width / 2 - (n.x + NW / 2) * view.k; view.y = r.height / 2 - (n.y + NH / 2) * view.k;
  }

  ui.afterTree = () => {
    const wrap = $('#treewrap'); if (!wrap) return;
    if (!view.fitted) { view.nodes.length > 14 ? findMe() : fit(); view.fitted = true; }
    apply();
    const pts = new Map(); let moved = 0, pinch = null, downEl = null;
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    wrap.onpointerdown = e => {
      downEl = e.target; wrap.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: dist(a, b), k: view.k }; }
      wrap.classList.add('drag');
    };
    wrap.onpointermove = e => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
      pts.set(e.pointerId, cur);
      if (pts.size === 1) { view.x += cur.x - prev.x; view.y += cur.y - prev.y; moved += Math.abs(cur.x - prev.x) + Math.abs(cur.y - prev.y); }
      else if (pinch) {
        const [a, b] = [...pts.values()], r = wrap.getBoundingClientRect();
        zoomAt({ x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }, (pinch.k * dist(a, b) / pinch.d) / view.k); moved += 10;
      }
      apply();
    };
    const up = e => {
      pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
      if (!pts.size) wrap.classList.remove('drag');
      if (e.type === 'pointerup' && moved < 6) { const n = downEl?.closest?.('.tn'); if (n) ui.person(+n.dataset.id); }
    };
    wrap.onpointerup = up; wrap.onpointercancel = up;
    wrap.onwheel = e => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt({ x: e.clientX - r.left, y: e.clientY - r.top }, Math.exp(-e.deltaY * 0.0015)); apply(); };
  };

  ui.input.treeRoot = el => { view.root = +el.value; view.fitted = false; ui.renderView(); };
  ui.on.treeZoom = el => { const r = $('#treewrap').getBoundingClientRect(); zoomAt({ x: r.width / 2, y: r.height / 2 }, +el.dataset.f); apply(); };
  ui.on.treeFit = () => { fit(); apply(); };
  ui.on.treeMe = () => { findMe(); apply(); };
})();

/* ---- late.js ---- */
/* Runs the UI registrations queued by engine-side modules (LATE), now that UI exists. */
LATE.forEach(f => f());

/* ---- main.js ---- */
/* =====================================================================
   BOOT — event wiring, theme, the Age button, autosave.
   Modules extend the loop through:
     ui.around    [{before(el), after(el, ctx)}] around every click
     ui.beforeAge [fn] before each year, ui.onAged [fn] after it
   ===================================================================== */

(() => {
  const S = Sim, ui = UI, { $ } = ui;
  const root = document.documentElement;
  const THEME = 'tempora.theme';

  const savedTheme = ui.store.get(THEME);
  if (savedTheme === 'light' || savedTheme === 'dark') root.dataset.theme = savedTheme;

  function toggleTheme() {
    const next = ui.isDark() ? 'light' : 'dark';
    root.dataset.theme = next;
    ui.store.set(THEME, JSON.stringify(next));
    ui.render();
  }
  const each = (list, ...a) => { for (const f of list || []) { try { f(...a); } catch (err) { console.error(err); } } };

  function ageUp() {
    if (!S.W || S.W.dead || ui.open) return;
    each(ui.beforeAge);
    S.ageUp();
    const auto = S.W.auto || {};
    if (typeof Auto !== 'undefined' && !S.W.dead) { Auto.apply(S.me()); if (auto.choices && auto.choices !== 'ask') Auto.resolveAll(auto.choices); }
    ui.render();
    ui.save();
    each(ui.onAged);
    if (ui.tab === 'life') {
      const v = $('#view');
      if (v && v.getBoundingClientRect().top < 0) v.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const f = ui.on[el.dataset.act];
    if (!f) return;
    const arr = ui.around || [], ctx = arr.map(h => { try { return h.before ? h.before(el) : null; } catch { return null; } });
    f(el, e);
    arr.forEach((h, i) => { try { if (h.after) h.after(el, ctx[i]); } catch (err) { console.error(err); } });
  });
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-input]');
    if (el && ui.input[el.dataset.input]) ui.input[el.dataset.input](el, e);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.open && !ui.open.locked) ui.closeSheet();
    // Space or Enter on the page (not in a field) ages you up
    if ((e.key === ' ' || e.key === 'Enter') && !ui.open && S.W && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement?.tagName || '') && e.target === document.body) { e.preventDefault(); ageUp(); }
  });
  $('#ageBtn').addEventListener('click', ageUp);
  ui.age = ageUp;
  $('#btnTheme').addEventListener('click', toggleTheme);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => ui.render());

  // Pick up where the last session left off
  const saved = ui.store.get('tempora.autosave');
  if (saved) { try { S.load(saved); } catch { S.W = null; } }
  ui.render();
  Promise.resolve(typeof Platform !== 'undefined' ? Platform.init() : null).then(() => { if (typeof Community !== 'undefined') Community.init(); });
  if (ui.sound) ui.sound.init();
})();

</script>
</body>
