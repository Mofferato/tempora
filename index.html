    // farming arrives in a hunter's lifetime
    const n = DATA.neolithic[p.cc];
    if (n && yr() === n.farm) S.log(p, 'Strangers with seed grain and tame goats have settled nearby. They plant, and they stay. Nothing will be quite the same.', 'world');
    if (n && yr() === n.copper) S.log(p, 'The first copper tools have reached your land. They gleam like the sun.', 'world');
  });

  // Emigrating to another country gives you a new home there
  LATE.push(() => {
    const em = S.world.emigrate;
    S.world.emigrate = (cc, family) => {
      const p = S.me(), before = p.cc, t = em(cc, family);
      if (p.cc !== before) { p.home = pickHome(cc, yr(), 0.25); [S.spouse(p), ...S.kids(p)].forEach(o => { if (o && o.cc === cc) o.home = { ...p.home }; }); }
      return t;
    };
  });

  return { LV, list, citiesAt, nameOf, lvlOf, info, lvl, move, pickHome, ensure, neoOK, COST, PAY, emigrateCheap };
})();
Sim.towns = Towns;

/* ---------------- World → Your land ---------------- */
LATE.push(() => {
  const S = Sim, ui = UI, T = Towns, { esc, toast, render } = ui;
  const x = v => `×${(+v).toFixed(2).replace(/0$/, '')}`;
  function view(p) {
    const e = S.era(), i = T.info(p), cs = T.citiesAt(p.cc), n = DATA.neolithic[p.cc], y = S.W.year;
    const neoLine = n ? (!T.neoOK(p.cc, 'farm') ? `People here live by hunting, fishing and gathering. Farming reaches this land around ${U.fmtYear(n.farm)}.` : y < 1500 ? `Farming came to this land in ${U.fmtYear(n.farm)}; ${T.neoOK(p.cc, 'copper') ? `copper-working in ${U.fmtYear(n.copper)}.` : `copper will arrive around ${U.fmtYear(n.copper)}.`}` : '') : '';
    const migs = DATA.history.filter(h => h.type === 'migration' && y >= h.y && y <= (h.end ?? h.y) && ((h.where || []).includes(p.cc) || (h.from || []).includes(p.cc)));
    const cost = raw => S.toVal(e.cost * (raw === 'rural' ? 0.1 : 0.25));
    return `<div class="panel"><div class="eyebrow">Where you live</div><h3>${esc(i.label[0].toUpperCase() + i.label.slice(1))}</h3>
        <p class="lede">${esc(S.world.name(p.cc))}. ${esc(neoLine)}</p>
        <div class="facts"><div class="fact"><div class="eyebrow">Settlement</div><div class="v sm">${esc(i.lvlName)}</div></div>
          <div class="fact"><div class="eyebrow">Living costs</div><div class="v sm">${x(T.COST[i.lvl])}</div></div>
          <div class="fact"><div class="eyebrow">Wages</div><div class="v sm">${x(T.PAY[i.lvl])}</div></div>
          <div class="fact"><div class="eyebrow">Best jobs</div><div class="v sm">${i.lvl >= 4 ? 'All open' : i.lvl >= 3 ? 'Most open' : 'Local work only'}</div></div></div>
        <p class="faint" style="font-size:12.5px;margin:10px 0 0">Cities pay more and open the best careers, but cost more and, before modern medicine, spread disease. Villages and camps are cheap, close-knit and healthier.</p></div>
      ${migs.length ? `<div class="panel"><div class="eyebrow">Peoples on the move</div><ul class="laws">${migs.map(h => `<li>${esc(h.t)}</li>`).join('')}</ul></div>` : ''}
      <div class="sec-h"><h3>Settlements of ${esc(S.world.C(p.cc).short)}</h3><span class="faint">${cs.length}</span></div>
      <div class="list">${cs.map(c => { const here = !i.rural && i.raw === c.raw; return `<div class="row"><div class="main"><div class="t">${esc(c.name)}${here ? ' <span class="tag era">home</span>' : ''}${c.name === S.world.cap(p.cc) ? ' <span class="tag">capital</span>' : ''}</div><div class="s">${esc(T.LV[c.lvl])} · since ${U.fmtYear(c.c.from)}</div></div>${here ? '' : `<button class="btn sm" data-act="townMove" data-raw="${esc(c.raw)}">Move · ${S.money(cost(c.raw))}</button>`}</div>`; }).join('') || '<div class="row muted">No towns yet: people live in camps and hamlets.</div>'}
        ${i.rural ? '' : `<div class="row"><div class="main"><div class="t">The countryside</div><div class="s">A ${T.neoOK(p.cc, 'farm') ? 'village' : 'camp'} near ${esc(i.name)}</div></div><button class="btn sm" data-act="townMove" data-raw="rural">Move · ${S.money(cost('rural'))}</button></div>`}</div>`;
  }
  (ui.worldExtra ||= []).push({ id: 'land', n: 'Your land', first: true, view });
  ui.on.townMove = el => { const t = T.move(S.me(), el.dataset.raw); render(); toast(t); };
});

/* ---- society.js ---- */
/* =====================================================================
   SOCIETY — courts and trials, fugitives and lawsuits, and the lives of
   everyone you know. Crimes go to an era-appropriate court where you can
   plead, hire an advocate, bribe, face an ordeal or flee. Every year the
   people around you live through events of their own, and the notable
   ones reach you as gossip.
   ===================================================================== */

const Society = (() => {
  const S = Sim, W = () => S.W, yr = () => S.W.year;
  const ISLAMIC = ['EGY', 'IRN', 'MAG', 'MSP', 'LEV', 'ANA'];
  const CRIMES = {
    theft: 'theft', pickpocket: 'picking pockets', assault: 'assault', fraud: 'fraud', smuggling: 'smuggling', heresy: 'heresy',
    sedition: 'sedition', draft: 'dodging the draft', desertion: 'desertion', murder: 'murder', escape: 'escaping custody', bribery: 'bribery', corruption: 'corruption',
  };
  function court(p) {
    const e = S.era(), y = yr(), cc = p.cc;
    if (e.id === 'prehistory') return 'the council of elders';
    if (e.id === 'ancient') return cc === 'EGY' ? "the vizier's court" : cc === 'CHN' ? "the magistrate's yamen" : 'the magistrates';
    if (ISLAMIC.includes(cc) && y >= 640 && y < 1900) return "the qadi's court";
    if (e.id === 'medieval') return ['ENG', 'FRA', 'SCA'].includes(cc) ? 'the manor court' : cc === 'CHN' ? "the magistrate's yamen" : 'the local court';
    if (e.id === 'renaissance') return 'the city tribunal';
    if (e.id === 'colonial') return cc === 'ENG' || cc === 'USA' ? 'the assizes' : 'the royal court';
    if (e.id === 'near') return 'the AI-assisted court';
    if (e.id === 'far') return 'the Arbitration Mind';
    return 'the district court';
  }
  const ordealOK = () => { const y = yr(); return (S.era().id === 'prehistory') || (y >= 500 && y <= 1215); };
  const premodern = () => DATA.PREMODERN.includes(S.era().id);
  const corrupt = p => premodern() || (S.world.nations?.().find(n => n.cc === p.cc)?.stab ?? 60) < 40;

  /* ---------- sentencing ---------- */
  function sentence(p, c, mult = 1) {
    const e = S.era();
    let yrs = Math.max(0, Math.round(c.yrs * mult));
    const crime = CRIMES[c.crime] || c.crime;
    if (c.sev >= 3 && premodern() && U.chance(0.35)) { S.log(p, `Condemned for ${crime}, you were put to death.`, 'bad'); S.kill(p, 'execution'); return 'You were condemned to death.'; }
    if (e.id === 'prehistory') {
      if (yrs >= 3 || U.chance(0.3)) { S.applyFx(p, { rep: -15, mh: -8 }); exile(p); return 'The elders cast you out of the band. You must make a life among strangers.'; }
      S.applyFx(p, { rep: -8, $c: -0.2 }); return 'You were ordered to pay the wronged family in hides, tools and food.';
    }
    if (premodern() && c.sev <= 1 && U.chance(0.55)) {
      if (U.chance(0.5)) { S.applyFx(p, { h: -10, rep: -6, mh: -4 }); S.log(p, `You were flogged in public for ${crime}.`, 'bad'); return 'You were flogged in public and sent home.'; }
      S.applyFx(p, { rep: -8, $c: -0.1 }); S.log(p, `You spent a day in the stocks for ${crime}, pelted with rotten food.`, 'bad'); return 'A day in the stocks. The whole town came to jeer.';
    }
    if (yrs <= 0) { const f = S.toVal(e.cost * 0.15 * c.sev); p.money -= f; p.rep = U.clamp(p.rep - 4); S.log(p, `You were fined ${S.money(f)} for ${crime}.`, 'bad'); return `A fine of ${S.money(f)}.`; }
    S.jail(p, yrs);
    S.log(p, `${court(p)[0].toUpperCase() + court(p).slice(1)} sentenced you to ${yrs} year${yrs > 1 ? 's' : ''} for ${crime}.`, 'bad');
    return `Sentenced to ${yrs} year${yrs > 1 ? 's' : ''} in prison.`;
  }
  function exile(p) {
    const opts = S.world.countriesAt().filter(c => c.id !== p.cc && c.region !== 'space' && c.region === S.world.C(p.cc)?.region);
    const dest = (opts.length ? U.pick(opts) : U.pick(S.world.countriesAt().filter(c => c.id !== p.cc && c.region !== 'space'))).id;
    if (Sim.towns) Sim.towns.emigrateCheap(p, dest, 'exiled');
    else p.cc = dest;
    p.flags.exiled = yr();
  }

  /* ---------- arrests and trials ---------- */
  function arrest(p, c) {
    c = { sev: 1, yrs: 1, ...c };
    if (p.id !== W().playerId) { S.jail(p, Math.max(1, c.yrs)); return ''; }
    if (p.flags.fugitive) { c.yrs += 2; c.sev = Math.min(3, c.sev + 1); delete p.flags.fugitive; }
    const e = S.era(), crime = CRIMES[c.crime] || c.crime, where = court(p);
    const base = 0.25 + p.sm / 400 + p.rep / 500 - c.sev * 0.05 + S.hadd('odds', p, { tag: 'trial' });
    const lawyerCost = S.toVal(e.cost * 0.25 * c.sev), bribeCost = S.toVal(e.cost * 0.4 * c.sev);
    const acquit = how => { S.applyFx(p, { rep: -2, mh: 2 }); S.log(p, `${where[0].toUpperCase() + where.slice(1)} found you not guilty of ${crime}${how ? ` ${how}` : ''}.`, 'good'); return 'Not guilty! You walked free.'; };
    const choices = [
      { l: 'Plead guilty and ask for mercy', go: () => { S.applyFx(p, { rep: -3 }); return sentence(p, c, 0.5); } },
      { l: 'Plead not guilty and speak for yourself', go: () => (U.chance(U.clamp(base, 0.05, 0.85)) ? acquit() : sentence(p, c, 1.2)) },
      { l: `Hire an advocate (${S.money(lawyerCost)})`, dis: p.money < lawyerCost, go: () => { p.money -= lawyerCost; return U.chance(U.clamp(base + 0.25, 0.1, 0.92)) ? acquit('thanks to your advocate') : sentence(p, c, 0.9); } },
    ];
    if (corrupt(p)) choices.push({ l: `Bribe the judge (${S.money(bribeCost)})`, dis: p.money < bribeCost, go: () => {
      p.money -= bribeCost; S.pers?.nudge(p, 'deceitful', 1);
      if (U.chance(0.55 + S.hadd('odds', p, { l: 'bribe' }))) return acquit('after a quiet word and a heavy purse');
      S.applyFx(p, { rep: -10 }); S.log(p, 'Your bribe was exposed in open court.', 'bad'); return sentence(p, { ...c, crime: 'bribery' }, 1.5);
    } });
    if (ordealOK()) choices.push({ l: e.id === 'prehistory' ? 'Undergo the ordeal of the river' : 'Demand trial by ordeal', go: () => {
      if (U.chance(0.45 + p.h / 400 + (S.pers?.has(p, 'pious') ? 0.05 : 0))) return acquit('when you survived the ordeal unharmed');
      S.applyFx(p, { h: -15 }); return sentence(p, c, 1);
    } });
    choices.push({ l: 'Flee before the trial', go: () => {
      if (U.chance(0.4 + (S.pers?.has(p, 'reckless') ? 0.05 : 0))) { p.flags.fugitive = yr(); S.applyFx(p, { rep: -8, mh: -4 }); S.log(p, `You fled before your trial for ${crime}. You are a fugitive now.`, 'bad'); return 'You slipped away. They are still looking for you.'; }
      return sentence(p, c, 1.5);
    } });
    S.prompt({ title: `On trial · ${where}`, text: `You were arrested for ${crime}${c.what ? ` (${c.what})` : ''}. You now stand before ${where}.`, choices });
    return `You were caught and arrested for ${crime}. You will stand trial.`;
  }
  S.hooks.arrest = arrest;

  /* ---------- lawsuits and fugitives ---------- */
  S.addHook('events', p => {
    const out = [], e = S.era();
    if (p.flags.fugitive) out.push({ id: 'fugitive', p: 0.2, t: 'You glimpse a wanted notice with your face on it.', ch: [
      { l: 'Lie low and move on', fx: { mh: -3, $c: -0.05 }, t: 'Another town, another name.' },
      { l: 'Turn yourself in', go: 'surrender', fx: { rep: 2 }, t: 'You walked into the court and gave your name.' }] });
    if (S.age(p) >= 21 && e.id !== 'prehistory') {
      out.push({ id: 'sued', p: 0.02, t: `A neighbour is suing you before ${court(p)}, claiming you damaged their property.`, ch: [
        { l: 'Settle out of court', fx: { $c: -0.15 }, t: 'You paid, and the matter was closed.' },
        { l: 'Fight it in court', odds: q => 0.45 + q.sm / 400 + q.rep / 400, win: { fx: { rep: 3, hp: 3 }, t: 'The case was thrown out. Your neighbour paid the costs.' }, alt: { fx: { $c: -0.35, rep: -3 }, t: 'You lost, and paid damages and costs.' } }] });
      out.push({ id: 'cheated', p: 0.02, min: 18, t: 'A merchant sold you rotten goods and refuses to pay you back.', ch: [
        { l: 'Take them to court', odds: q => 0.5 + q.sm / 400, win: { fx: { $c: 0.1, rep: 2 }, t: 'The court ordered them to repay you, with interest.' }, alt: { fx: { $c: -0.05 }, t: 'The court sided with the merchant.' } },
        { l: 'Let it go', fx: { mh: -1 }, t: 'Lesson learned.' }] });
      if (['modern', 'digital', 'near', 'wars', 'industrial'].includes(e.id)) out.push({ id: 'jury', p: 0.03, min: 21, t: 'You were summoned for jury duty.', ch: [
        { l: 'Serve on the jury', fx: { sm: 1, rep: 2, hp: -1 }, t: 'Two weeks of testimony. You took it seriously.' }, { l: 'Invent an excuse', fx: { rep: -1 }, t: 'Your excuse was accepted. Just.' }] });
    }
    return out;
  }, 'cat');
  S.addHook('chose', (p, c) => { if (c.go === 'surrender') { delete p.flags.fugitive; arrest(p, { crime: 'escape', yrs: 1, sev: 1 }); } });
  S.addHook('postYear', p => {
    if (p.flags.fugitive && yr() - p.flags.fugitive >= 1 && U.chance(0.12)) { S.log(p, 'The law caught up with you.', 'bad'); arrest(p, { crime: 'escape', yrs: 2, sev: 2 }); }
  });

  /* ---------- extra effect keys ---------- */
  S.addHook('fx', (p, fx) => {
    if (fx.promote && p.job && p.job.rank < 4) { p.job.rank++; p.job.perf = 60; }
    if (fx.pet && p.id === W().playerId && Sim.adoptPet) { const cur = p.money; const t = S.adoptPet(fx.pet); p.money = Math.max(p.money, cur); if (/Meet/.test(t)) S.log(p, t, 'family'); }
  });

  /* ---------- the lives of everyone you know ---------- */
  const BIG = ['lover', 'royal', 'rival', 'pet', 'job', 'go'];
  const pool = () => {
    const e = S.era();
    return [...DATA.npcEvents, ...e.ev, ...DATA.events].filter(ev => !ev.once && !BIG.some(k => ev.fx && k in ev.fx) && !(ev.ch || []).some(c => BIG.some(k => (c.fx && k in c.fx) || (c.win?.fx && k in c.win.fx) || (c.alt?.fx && k in c.alt.fx)) || c.go));
  };
  function npcYear(p) {
    const people = S.known(p).filter(o => S.alive(o) && S.age(o) >= 3);
    const sample = U.shuffle(people).slice(0, 40);
    const evs = pool(), news = [];
    for (const o of sample) {
      if (!U.chance(0.3)) continue;
      const a = S.age(o);
      const opts = evs.filter(ev => S.eventOK(o, ev, a));
      const ev = U.wpick(opts, x => x.p);
      if (!ev) continue;
      const before = o.log.length;
      try { S.runEvent(o, ev, true); } catch { continue; }
      const l = o.log[o.log.length - 1];
      if (o.log.length > before && l && (l.k === 'good' || l.k === 'bad')) {
        const close = (p.rels[o.id]?.c ?? 0) >= 45 || /Father|Mother|Brother|Sister|Son|Daughter|Husband|Wife/.test(S.relLabel(p, o));
        const g = gist(l.t);
        if (close && g) news.push({ o, t: l.t, g, k: l.k });
      }
    }
    if (news.length) {
      const pick = U.shuffle(news).slice(0, 3);
      const line = pick.map(n => `your ${S.relLabel(p, n.o).toLowerCase()} ${n.o.first}${n.g}`).join('; ');
      S.log(p, `News from people you know: ${line}.`, 'gossip');
      if (S.hooks.gossip) S.hooks.gossip(p, pick);
      // good news cheers you a little, bad news worries you
      const d = pick.reduce((s, n) => s + (n.k === 'good' ? 1 : -1), 0);
      if (d) p.hp = U.clamp(p.hp + d);
    }
  }
  // Turn "You were praised at work..." into "was praised at work"; for a choice, what came of it.
  // Returns null when the line is not about the person ("A bitter winter.").
  function gist(t) {
    let s = t;
    const i = s.indexOf(' You chose: ');
    if (i >= 0) { const rest = s.slice(i + 12), j = rest.indexOf('. '); s = j >= 0 ? rest.slice(j + 2) : rest; }
    s = s.split(/(?<=[.!?])\s/)[0].replace(/[.!]$/, '');
    if (!/^(You|Your)\b/.test(s)) return null;
    const own = /^Your /.test(s);
    s = s.replace(/^You were /, 'was ').replace(/^You are /, 'is ').replace(/^You /, '').replace(/^Your /, '').replace(/\byou\b/g, 'them').replace(/\byour\b/g, 'their').replace(/\byourself\b/g, 'themselves');
    if (s.length > 110) s = s.slice(0, 107) + '…';
    return own ? `'s ${s}` : ` ${s}`;      // "Tom's post went viral" / "Tom was promoted"
  }
  S.addHook('postYear', p => npcYear(p));

  return { court, arrest, sentence, CRIMES, gist, npcYear };
})();

/* ---- politics.js ---- */
/* =====================================================================
   POLITICS — offices, elections, ruling and war, and a world of rulers
   that rise and fall.
   * Every land has a kind of government (read from its current name):
     tribal, monarchy, constitutional monarchy, republic, one-party
     state, theocracy, colony or charter. Each has a ladder of five
     offices, won by acclaim, election, appointment, inheritance or coup.
   * In office you draw a salary, face yearly decisions and keep an
     approval rating. At the top you set policy, build monuments,
     make alliances and declare wars that draft real people.
   * Every country has a ruler who ages, dies and is succeeded; unstable
     lands have revolutions and restorations; wars end in victory,
     defeat or occupation. All of it is saved in W.reg and W.wars.
   ===================================================================== */

const Pol = (() => {
  const S = Sim, W = () => S.W, yr = () => S.W.year;
  const C = cc => S.world.C(cc);
  const premodern = () => DATA.PREMODERN.includes(S.era().id);

  /* ---------- kinds of government ---------- */
  function kindOf(cc) {
    const g = (S.world.gov(cc) || '').toLowerCase(), e = S.era().id;
    if (e === 'prehistory' || /band|forager|hunter|clan|tribe|village|chiefdom|herding|fishing|camp|hamlet|proto|temple town|cult centre|nomad/.test(g)) return 'tribal';
    if (/one-party|party/.test(g)) return 'party';
    if (/theocra/.test(g)) return 'theo';
    if (/constitutional/.test(g)) return 'const';
    if (/republic|democra|federal|commonwealth|free states|city league|assembly|city-state|trading republic/.test(g)) return 'republic';
    if (/colon|province|satrap|mandate|regency|viceroy|occupied|provinces/.test(g)) return 'colony';
    if (/corporate|charter|authority/.test(g)) return 'charter';
    return 'monarchy';
  }
  const ISLAMIC = ['EGY', 'IRN', 'MAG', 'MSP', 'LEV', 'ANA'];
  function headTitle(cc, sex) {
    const g = (S.world.gov(cc) || '').toLowerCase(), n = (S.world.name(cc) || '').toLowerCase(), F = sex === 'F', y = yr();
    if (cc === 'EGY' && y < -30) return 'Pharaoh';
    if (/shogun/.test(g) || /shogunate/.test(n)) return 'Shogun';
    if (/caliph/.test(g + n)) return 'Caliph';
    if (/sultan/.test(g + n)) return F ? 'Sultana' : 'Sultan';
    if (cc === 'IRN' && y > -600 && y < 1979) return F ? 'Shahbanu' : 'Shah';
    if (cc === 'RUS' && y >= 1547 && y < 1917) return F ? 'Tsaritsa' : 'Tsar';
    if (/empire/.test(g + n)) return F ? 'Empress' : 'Emperor';
    if (/grand duchy/.test(g + n)) return F ? 'Grand Duchess' : 'Grand Duke';
    if (/principalit/.test(g)) return F ? 'Princess' : 'Prince';
    if (/chief|tribe|clan|band|nomad/.test(g)) return F ? 'Chieftess' : 'Chief';
    return F ? 'Queen' : 'King';
  }
  function repHead(cc) {
    const y = yr();
    if (cc === 'ITA' && y >= -509 && y <= -27) return 'Consul';
    if (cc === 'GRC' && y < -146) return 'Archon';
    if (cc === 'MAG' && y < -146) return 'Suffete';
    if (/prime minister/i.test(S.world.gov(cc))) return 'Prime Minister';
    return 'President';
  }
  function legisTitle(cc) {
    const y = yr();
    if (cc === 'ITA' && y < 476) return 'Senator'; if (cc === 'GRC' && y < -146) return 'Member of the Boule';
    if (cc === 'USA') return 'Senator'; if (cc === 'FRA') return 'Deputy'; if (cc === 'SCA' && y < 1300) return 'Speaker at the Thing';
    return 'Member of Parliament';
  }
  const LADDERS = {
    tribal: ['Hunt leader', 'Elder', 'Speaker of the band', 'War chief', '@head'],
    monarchy: ['Village reeve', 'Town alderman', 'Royal councillor', '@chancellor', '@head'],
    const: ['Councillor', 'Mayor', '@legis', 'Minister', 'Prime Minister'],
    republic: ['Councillor', 'Mayor', '@legis', 'Minister', '@rhead'],
    party: ['Party cadre', 'Local party secretary', 'Central Committee member', 'Politburo member', 'General Secretary'],
    theo: ['Temple warden', 'Judge', 'Council of clerics', 'Grand vizier', 'Supreme Leader'],
    colony: ['Clerk of the council', 'Assemblyman', 'Colonial councillor', 'Lieutenant governor', 'Governor'],
    charter: ['Council delegate', 'Sector chief', 'Assembly member', 'Administrator', 'President of the Council'],
  };
  function officeTitle(cc, lvl, sex) {
    const k = kindOf(cc), raw = LADDERS[k][lvl - 1];
    if (raw === '@head') return headTitle(cc, sex);
    if (raw === '@rhead') return repHead(cc);
    if (raw === '@legis') return legisTitle(cc);
    if (raw === '@chancellor') return ISLAMIC.includes(cc) && yr() > 640 ? 'Grand vizier' : cc === 'EGY' ? 'Vizier' : cc === 'CHN' ? 'Grand Secretary' : 'Chancellor';
    if (k === 'monarchy' && lvl === 3 && cc === 'CHN') return 'Mandarin';
    return raw;
  }
  // how the office is won
  function method(k, lvl) {
    if (k === 'tribal') return lvl === 5 ? 'acclaim' : 'acclaim';
    if (k === 'republic' || k === 'const' || k === 'charter') return 'elect';
    if (k === 'monarchy' && lvl === 5) return 'throne';
    return 'appoint';
  }
  const AGE = [16, 21, 25, 30, 35], REP = [20, 35, 50, 60, 70], FAME = [0, 5, 15, 25, 40], CAMP = [0.1, 0.3, 1, 2.5, 6], SAL = [0.3, 0.6, 1.5, 3, 6], CLS = [1, 2, 3, 4, 5];

  /* ---------- world registry: regimes, rulers, policies ---------- */
  function reg(cc) {
    const w = W(); w.reg ||= {};
    return (w.reg[cc] ||= { gov: null, name: null, since: yr(), base: null, occ: null, pol: { tax: 1, army: 1, free: 1 }, works: [], ruler: null, nums: {} });
  }
  const natOf = cc => { const w = W(); w.nat ||= {}; return (w.nat[cc] ||= { stab: 60 }); };
  S.hooks.regName = (cc, base) => {
    const r = W().reg?.[cc]; if (!r) return base;
    const n = r.name && r.base === base ? r.name : base;
    return r.occ ? `${n} (under ${C(r.occ.by)?.adj || 'foreign'} occupation)` : n;
  };
  S.hooks.regGov = (cc, base) => { const r = W().reg?.[cc]; return r && r.gov && r.base === baseName(cc) ? r.gov : base; };
  const baseName = cc => { const c = C(cc); if (!c) return ''; for (const x of c.names) if (yr() <= x[0]) return x[1]; return c.names[c.names.length - 1][1]; };

  /* ---------- rulers ---------- */
  const ordinal = n => (n <= 1 ? '' : ` ${U.roman(n)}`);
  function mkRuler(cc, prev) {
    const r = reg(cc), k = kindOf(cc), e = S.era();
    const pool = S.pool(e, cc) || DATA.names[e.names];
    const sex = k === 'monarchy' || k === 'tribal' ? (U.chance(0.12) ? 'F' : 'M') : U.chance(yr() > 1950 ? 0.3 : 0.05) ? 'F' : 'M';
    const first = U.pick(sex === 'M' ? pool.m : pool.f);
    const dyn = (k === 'monarchy' || k === 'tribal') && prev?.dyn && U.chance(0.8) ? prev.dyn : U.pick(pool.last);
    r.nums[first] = (r.nums[first] || 0) + 1;
    const num = k === 'monarchy' ? r.nums[first] : 1;
    const t = k === 'monarchy' || k === 'tribal' ? headTitle(cc, sex) : officeTitle(cc, 5, sex);
    const age = k === 'monarchy' ? U.ri(16, 50) : U.ri(40, 65);
    return { first, n: `${first}${ordinal(num)}`, dyn, sex, t, born: U.add(yr(), -age), since: yr(), kind: k };
  }
  const rulerName = rr => (rr ? `${rr.t} ${rr.n}${rr.kind === 'monarchy' || rr.kind === 'tribal' ? '' : ` ${rr.dyn}`}` : '');
  function ruler(cc) {
    const r = reg(cc), p = S.me();
    if (r.ruler?.pid != null) { const q = S.P(r.ruler.pid); if (!q || !S.alive(q)) r.ruler = null; }
    if (!r.ruler) r.ruler = mkRuler(cc);
    // the ruler of your own land is a real person you can meet
    if (p && cc === p.cc && r.ruler.pid == null && !r.ruler.player) {
      const rr = r.ruler, q = S.mkPerson({ cc, born: rr.born, sex: rr.sex, first: rr.first, last: rr.dyn });
      q.title = rr.t; q.cls = rr.kind === 'monarchy' ? 6 : 5; q.flags.ruler = cc; q.rep = U.ri(55, 85); q.fm = U.ri(60, 90);
      if (q.home && S.towns) { const cap = S.towns.citiesAt(cc)[0]; if (cap) q.home = { c: cap.raw, rural: false }; }
      rr.pid = q.id;
    }
    return r.ruler;
  }
  function succeed(cc, why) {
    const r = reg(cc), old = r.ruler, k = kindOf(cc), p = S.me();
    if (old?.pid != null) { const q = S.P(old.pid); if (q && S.alive(q) && q.flags.ruler) { q.title = null; delete q.flags.ruler; } }
    r.ruler = mkRuler(cc, old);
    if (p && p.cc === cc) {
      const nn = rulerName(r.ruler);
      const t = why === 'death' ? (k === 'monarchy' || k === 'tribal' ? `${old ? rulerName(old) : 'The old ruler'} has died. ${nn} now rules ${S.world.name(cc)}.` : `${old ? rulerName(old) : 'The leader'} has died in office. ${nn} takes over.`)
        : why === 'election' ? `${nn} won the election and now leads ${S.world.name(cc)}.` : why === 'coup' ? `A coup! ${nn} has seized power in ${S.world.name(cc)}.` : `${nn} now leads ${S.world.name(cc)}.`;
      W().news.push({ y: yr(), t, type: 'politics', where: [cc] }); S.log(p, t, 'world');
    }
  }
  function rulerTick(cc) {
    const r = reg(cc), k = kindOf(cc);
    if (r.ruler?.player) { const q = S.P(r.ruler.pid); if (!q || !S.alive(q) || q.office?.lvl !== 5 || q.cc !== cc) r.ruler = null; return; }
    const rr = ruler(cc);
    if (rr.pid != null) { const q = S.P(rr.pid); if (!q || !S.alive(q)) return succeed(cc, 'death'); }
    else { const age = U.span(rr.born, yr()); if (U.chance(0.01 + Math.max(0, age - 45) * 0.004)) return succeed(cc, 'death'); }
    if ((k === 'republic' || k === 'const' || k === 'charter') && yr() - rr.since >= U.ri(4, 8)) return succeed(cc, 'election');
    if (natOf(cc).stab < 20 && U.chance(0.08)) return succeed(cc, 'coup');
  }

  /* ---------- revolutions, restorations, occupation ---------- */
  const REV = {
    monarchy: [['Revolutionary republic', 'the {Adj} Republic'], ['Military junta', 'the {Adj} Military Government'], ['Constitutional monarchy', 'the constitutional Kingdom of {Short}']],
    const: [['Military junta', 'the {Adj} Military Government'], ['Republic', 'the {Adj} Republic']],
    republic: [['Military junta', 'the {Adj} Military Government'], ['One-party state', "the People's Republic of {Short}"], ['Empire', 'the {Adj} Empire']],
    party: [['Republic', 'the {Adj} Republic'], ['Military junta', 'the {Adj} Military Government']],
    theo: [['Republic', 'the {Adj} Republic'], ['Military junta', 'the {Adj} Military Government']],
    colony: [['Republic', 'the Free {Adj} Republic'], ['Monarchy', 'the Kingdom of {Short}']],
    charter: [['Free states', 'the Free {Adj} Commons']],
  };
  const fill = (s, c) => s.replace('{Adj}', c.adj).replace('{Short}', c.short.replace(/^the /, ''));
  function revolution(cc) {
    const r = reg(cc), k = kindOf(cc), c = C(cc), p = S.me();
    const [gov, nm] = U.pick(REV[k] || REV.monarchy);
    r.base = baseName(cc); r.gov = gov; r.name = fill(nm, c); r.since = yr(); r.rev = (r.rev || 0) + 1;
    natOf(cc).stab = U.clamp(natOf(cc).stab + U.ri(8, 20));
    const t = `Revolution in ${c.short}! The old order falls, and ${r.name} is proclaimed.`;
    W().news.push({ y: yr(), t, type: 'revolution', where: [cc] });
    succeed(cc, 'coup');
    if (p && p.cc === cc) {
      S.log(p, t, 'world');
      if (p.title && U.chance(0.4)) { S.log(p, 'The revolutionaries stripped you of your title.', 'bad'); p.title = null; p.money *= 0.6; }
      if (p.office) { if (p.office.lvl >= 4) { S.log(p, 'The revolution swept you from office.', 'bad'); leave(p, true); if (U.chance(0.3)) S.hooks.arrest?.(p, { crime: 'corruption', yrs: 3, sev: 2, what: 'as a servant of the old regime' }); } else p.office.t = officeTitle(cc, p.office.lvl, p.sex); }
    }
  }
  function restoration(cc) {
    const r = reg(cc), c = C(cc), p = S.me(), old = r.name;
    r.gov = null; r.name = null; r.since = yr();
    const t = `${old ? old[0].toUpperCase() + old.slice(1) : c.short} gives way: ${baseName(cc)} is restored.`;
    W().news.push({ y: yr(), t, type: 'politics', where: [cc] });
    succeed(cc);
    if (p && p.cc === cc) S.log(p, t, 'world');
  }
  function regTick() {
    const p = S.me();
    for (const c of S.world.countriesAt()) {
      if (c.region === 'space' && yr() < 2100) { rulerTick(c.id); continue; }
      const r = reg(c.id), b = baseName(c.id);
      if (r.base !== b) { const changed = r.base != null; r.base = b; r.gov = null; r.name = null; r.since = yr(); if (changed) succeed(c.id); }
      if (r.occ && yr() >= r.occ.until) {
        const t = `${S.world.name(c.id).replace(/ \(under .*\)$/, '')} throws off ${C(r.occ.by)?.adj || 'foreign'} occupation.`;
        r.occ = null; W().news.push({ y: yr(), t, type: 'politics', where: [c.id] }); if (p && p.cc === c.id) { S.log(p, t, 'world'); S.applyFx(p, { hp: 8, mh: 4 }); }
      }
      const st = natOf(c.id).stab, k = kindOf(c.id);
      if (k !== 'tribal' && yr() > -2500) {
        if (!r.gov && st < 18 && U.chance(0.08)) revolution(c.id);
        else if (r.gov && yr() - r.since > 12 && U.chance(0.035 + (st < 30 ? 0.05 : 0))) restoration(c.id);
      }
      rulerTick(c.id);
    }
  }

  /* ---------- wars ---------- */
  const warsNow = () => (W().wars || []).filter(h => yr() >= h.y && yr() <= h.end);
  const atWar = (a, b) => S.activeWars().some(h => h.where && h.where.includes(a) && h.where.includes(b) && a !== b);
  function strength(cc) {
    const pop = S.world.popAt(cc) || 0.01, r = reg(cc);
    const pl = S.me(), lead = pl && pl.cc === cc && pl.office?.lvl >= 4 ? (pl.sm + (pl.wp ?? 50)) / 60 + (S.pers?.has(pl, 'brave') ? 0.5 : 0) : 0;
    return Math.log10(pop * 1e6 + 10) + (r.pol.army - 1) * 1.5 + natOf(cc).stab / 40 + lead;
  }
  function declare(a, b, byPlayer) {
    const w = W(); w.wars ||= [];
    const ca = C(a), cb = C(b), y = yr();
    const war = { y, end: y + U.ri(2, 7), type: 'war', key: `dyn${y}${a}${b}`, n: `${ca.adj}–${cb.adj} War`, t: `${S.world.name(a)} declares war on ${S.world.name(b)}.`, where: [a, b], draft: premodern() ? 0.05 : 0.1, mort: premodern() ? 0.05 : 0.035, civ: 0.002, dyn: 1, a, b, score: 0, byPlayer: !!byPlayer };
    w.wars.push(war);
    S.world.addRel?.(a, b, -40);
    w.news.push({ y, t: war.t, type: 'war', where: [a, b] });
    const p = S.me(); if (p && war.where.includes(p.cc)) S.log(p, war.t, 'world');
    natOf(a).stab = U.clamp(natOf(a).stab + 3); natOf(b).stab = U.clamp(natOf(b).stab - 2);
    return war;
  }
  function endWar(war, winner, how) {
    war.end = yr();
    const loser = winner === war.a ? war.b : war.a, p = S.me();
    let t;
    if (!winner) t = `The ${war.n} ends in an exhausted peace.`;
    else {
      natOf(winner).stab = U.clamp(natOf(winner).stab + 6); natOf(loser).stab = U.clamp(natOf(loser).stab - 15);
      const occ = Math.abs(war.score) > 9 && U.chance(0.45) && C(loser).region !== 'space';
      if (occ) reg(loser).occ = { by: winner, until: yr() + U.ri(5, 25) };
      t = `The ${war.n} ends: ${C(winner).short} ${how || 'is victorious'}${occ ? `, and occupies ${C(loser).short}` : ''}.`;
    }
    W().news.push({ y: yr(), t, type: 'war', where: war.where });
    if (p && war.where.includes(p.cc)) {
      S.log(p, t, 'world');
      const won = winner === p.cc;
      S.applyFx(p, winner ? (won ? { hp: 6, rep: 1 } : { hp: -6, mh: -4 }) : { hp: 2 });
      if (p.office?.lvl >= 4) { p.office.appr = U.clamp(p.office.appr + (winner ? (won ? 25 : -30) : 5)); S.applyFx(p, winner ? (won ? { fm: 10, rep: 6 } : { rep: -8 }) : {}); if (won) p.flags.warwon = (p.flags.warwon || 0) + 1; }
    }
  }
  function warTick() {
    for (const war of warsNow()) {
      if (!war.dyn || war.end < yr()) continue;
      war.score += (strength(war.a) - strength(war.b)) * 1.6 + U.rand(-4, 4);
      if (Math.abs(war.score) >= 14 || yr() >= war.end) endWar(war, Math.abs(war.score) < 3 ? null : war.score > 0 ? war.a : war.b);
    }
    // other nations quarrel too
    const live = warsNow().filter(h => h.dyn).length;
    if (live < 3 && yr() > -3000) {
      const cs = S.world.countriesAt().filter(c => c.region !== 'space' || yr() > 2100);
      for (let i = 0; i < 3; i++) {
        const a = U.pick(cs), b = U.pick(cs);
        if (!a || !b || a.id === b.id || atWar(a.id, b.id) || reg(a.id).occ || reg(b.id).occ) continue;
        const near = a.region === b.region;
        if (S.world.rel(a.id, b.id) < -50 && U.chance(near ? 0.06 : 0.02)) { if (!S.me() || (S.me().office?.lvl !== 5 || S.me().cc !== a.id)) declare(a.id, b.id); break; }
      }
    }
  }

  /* ---------- the player's political career ---------- */
  function requirements(p, lvl) {
    const cc = p.cc, k = kindOf(cc), m = method(k, lvl), why = [], a = S.age(p), cur = p.office?.lvl || 0;
    if (a < AGE[lvl - 1]) why.push(`age ${AGE[lvl - 1]}+`);
    if (p.rep < REP[lvl - 1]) why.push(`reputation ${REP[lvl - 1]}`);
    if ((m === 'elect') && (p.fm ?? 0) < FAME[lvl - 1]) why.push(`fame ${FAME[lvl - 1]}`);
    if (m === 'appoint' && (p.cls ?? 2) < CLS[lvl - 1] && k !== 'party') why.push('higher class');
    if (k === 'party' && !(p.orgs || []).some(o => o.id === 'party')) why.push('party membership');
    if (lvl > cur + 1 && lvl >= 3) why.push(`first serve as ${officeTitle(cc, lvl - 1, p.sex).toLowerCase()}`);
    if (p.prison) why.push('freedom');
    if (m === 'throne' && (p.cls ?? 2) < 6 && cur < 3) why.push('royal blood, or high office for a coup');
    if (lvl <= cur) why.push('you already hold a higher or equal office');
    return why;
  }
  function campaignCost(lvl) { return S.toVal(S.era().cost * CAMP[lvl - 1]); }
  function take(p, lvl, how) {
    const cc = p.cc, k = kindOf(cc);
    if (p.office) leave(p, true, true);
    p.office = { lvl, cc, t: officeTitle(cc, lvl, p.sex), since: yr(), yrs: 0, term: k === 'republic' || k === 'const' || k === 'charter' ? U.pick([4, 4, 5, 6]) : 0, appr: 55 + U.ri(-5, 10), kind: k };
    S.applyFx(p, { rep: 3 + lvl, fm: 2 + lvl * 2, hp: 8 });
    if (lvl === 5) {
      const r = reg(cc), old = r.ruler;
      if (old?.pid != null && old.pid !== p.id) { const q = S.P(old.pid); if (q) { q.title = null; delete q.flags.ruler; } }
      r.ruler = { pid: p.id, player: 1, n: p.first, first: p.first, dyn: p.last, sex: p.sex, t: p.office.t, born: p.born, since: yr(), kind: k };
      if (k === 'monarchy' || k === 'tribal' || k === 'theo') { p.title = p.office.t; p.cls = Math.max(p.cls ?? 2, 6); }
      W().news.push({ y: yr(), t: `${p.office.t} ${p.first} ${p.last} ${how === 'coup' ? 'seizes power' : 'takes power'} in ${S.world.name(cc)}.`, type: 'politics', where: [cc] });
    }
    p.flags.office = Math.max(p.flags.office || 0, lvl);
    S.log(p, `You became ${p.office.t}${how ? ` (${how})` : ''}.`, 'good');
    return `You are now ${p.office.t}!`;
  }
  function leave(p, forced, quiet) {
    const o = p.office; if (!o) return '';
    if (o.lvl === 5) { const r = reg(o.cc); if (r.ruler?.pid === p.id) r.ruler = null; if (p.title === o.t) p.title = null; }
    if (!quiet) S.log(p, forced ? `You were removed from office as ${o.t}.` : `You stepped down as ${o.t} after ${o.yrs} year${o.yrs === 1 ? '' : 's'}.`, forced ? 'bad' : 'life');
    p.office = null;
    return forced ? 'You were removed from office.' : 'You stepped down.';
  }
  // Seek an office: builds the right prompt for how it is won
  function seek(lvl) {
    const p = S.me(), cc = p.cc, k = kindOf(cc), m = method(k, lvl), why = requirements(p, lvl);
    if (why.length) return `You need: ${why.join(', ')}.`;
    if (p.did['seek']) return 'You have already tried for office this year.';
    p.did.seek = 1;
    const t = officeTitle(cc, lvl, p.sex), cost = campaignCost(lvl), inc = p.office && p.office.lvl === lvl;
    const opp = { n: `${S.pickName(U.chance(0.5) ? 'M' : 'F', S.era(), cc)} ${U.pick((S.pool(S.era(), cc) || DATA.names.modern).last)}`, str: U.ri(30 + lvl * 6, 70 + lvl * 6) };
    const base = 0.32 - (lvl - 1) * 0.05 + (p.rep - REP[lvl - 1]) / 150 + ((p.fm ?? 0) - FAME[lvl - 1]) / 250 + p.sm / 600 + (inc ? 0.1 : 0) - (opp.str - 55) / 250;
    const odds = x => U.clamp(base + x + S.hadd('odds', p, { tag: 'vote' }), 0.04, 0.93);
    const win = (x, how) => (U.chance(odds(x)) ? take(p, lvl, how) : (S.applyFx(p, { hp: -5, rep: -1 }), S.log(p, `You tried to become ${t.toLowerCase()} and failed.`, 'bad'), `You lost to ${opp.n}.`));
    if (m === 'elect') {
      S.prompt({ title: `Running for ${t}`, text: `You are standing for ${t.toLowerCase()} of ${S.world.name(cc)}. Your opponent is ${opp.n}. How will you campaign?`, choices: [
        { l: 'Knock on every door', go: () => { S.applyFx(p, { h: -2 }); return win(0.05, 'elected'); } },
        { l: `Hold rallies and give speeches (${S.money(cost)})`, dis: p.money < cost, go: () => { p.money -= cost; return win(0.12 + (S.pers?.has(p, 'charming') ? 0.08 : 0) + (S.pers?.has(p, 'shy') ? -0.08 : 0), 'elected'); } },
        { l: `Spend big on ${S.era().id === 'digital' || S.era().id === 'near' ? 'online ads' : ['modern', 'wars'].includes(S.era().id) ? 'broadcast ads' : 'posters and pamphlets'} (${S.money(cost * 3)})`, dis: p.money < cost * 3, go: () => { p.money -= cost * 3; return win(0.2, 'elected'); } },
        { l: 'Smear your opponent', go: () => { S.pers?.nudge(p, 'deceitful', 1); if (U.chance(0.25)) { S.applyFx(p, { rep: -10 }); S.log(p, 'Your smear campaign backfired into a scandal.', 'bad'); return win(-0.2); } return win(0.12, 'elected'); } },
        { l: 'Promise everyone everything', go: () => { const r = win(0.1, 'elected'); if (p.office) p.office.appr -= 8; return r; } }] });
      return `Your campaign for ${t.toLowerCase()} has begun.`;
    }
    if (m === 'acclaim') {
      S.prompt({ title: `Seeking the band's trust`, text: `The ${lvl === 5 ? 'chief is chosen' : 'elders gather'} around the great fire. Will they name you ${t.toLowerCase()}?`, choices: [
        { l: 'Prove yourself on a great hunt', go: () => { if (U.chance(0.15)) S.applyFx(p, { h: -12 }); return win(0.05 + p.h / 400, 'by acclaim'); } },
        { l: 'Give generous gifts of food and tools', go: () => { p.money -= S.toVal(S.era().cost * 0.2); return win(0.12, 'by acclaim'); } },
        { l: 'Speak wisely at the fire', go: () => win(p.sm / 300 + (S.pers?.has(p, 'charming') ? 0.08 : 0), 'by acclaim') }] });
      return 'You put yourself forward.';
    }
    if (m === 'appoint') {
      const gift = S.toVal(S.era().cost * CAMP[lvl - 1] * 1.5);
      S.prompt({ title: `Seeking appointment as ${t}`, text: `Offices here are given, not won. Who will you approach?`, choices: [
        { l: 'Rely on your record and reputation', go: () => win(0.02, 'appointed') },
        { l: `Send lavish gifts to a patron (${S.money(gift)})`, dis: p.money < gift, go: () => { p.money -= gift; return win(0.2, 'appointed'); } },
        { l: 'Flatter the powerful at every chance', go: () => { S.applyFx(p, { mh: -2 }); return win(0.1 + (S.pers?.has(p, 'charming') ? 0.1 : 0), 'appointed'); } }] });
      return 'You set out to win the favour of the powerful.';
    }
    // the throne: royal blood, or a coup
    const royal = (p.cls ?? 2) >= 6;
    S.prompt({ title: royal ? 'The throne' : 'Seize the throne?', text: royal ? `You have royal blood. ${rulerName(ruler(cc))} sits on the throne. Will you press your claim?` : `Only a coup can put you on the throne of ${S.world.name(cc)}. Soldiers, nobles and gold will decide it.`, choices: [
      { l: royal ? 'Press your claim before the court' : 'Plot with the generals', go: () => {
        const o = U.clamp(0.12 + (p.rep - 60) / 200 + (p.fm ?? 0) / 400 + (royal ? 0.15 : 0) + (natOf(cc).stab < 35 ? 0.15 : 0) + (S.pers?.has(p, 'brave') ? 0.05 : 0), 0.03, 0.6);
        if (U.chance(o)) return take(p, 5, royal ? 'by right of blood' : 'coup');
        S.log(p, 'Your bid for the throne failed.', 'bad');
        if (premodern() && U.chance(0.4)) { S.kill(p, 'execution for treason'); return 'You were executed for treason.'; }
        return S.hooks.arrest ? S.hooks.arrest(p, { crime: 'sedition', yrs: 6, sev: 3, what: 'plotting against the ruler' }) : 'You were arrested.';
      } },
      { l: 'Think better of it', go: () => 'You kept your head, and your head.' }] });
    return 'You weigh your chances.';
  }

  /* ---------- a year in office ---------- */
  const WORKS = { prehistory: 'a great stone circle', ancient: 'an aqueduct', medieval: 'a cathedral', renaissance: 'a palace and piazza', colonial: 'a canal', industrial: 'a railway', wars: 'a dam', modern: 'a highway', digital: 'a high-speed rail line', near: 'a sea wall', far: 'an orbital ring' };
  const DECISIONS = [
    { id: 'taxes', t: 'Farmers and merchants complain the taxes are crushing them.', ch: [['Cut taxes', { appr: 8, stab: -2 }, 'Cheers in the market.'], ['Hold firm', { appr: -3 }, 'Grumbling, but the coffers are full.'], ['Raise them further', { appr: -9, money: 0.5 }, 'You squeezed out more. They will remember.']] },
    { id: 'works', t: () => `${WORKS[S.era().id][0].toUpperCase() + WORKS[S.era().id].slice(1)} is falling into ruin.`, ch: [['Fund the repairs', { appr: 5, stab: 2 }, 'Workers swarmed over it for a season.'], ['Divert the funds to yourself', { money: 0.8, rep: -3, risk: 0.3 }, 'Nobody noticed. Probably.'], ['Leave it', { appr: -3 }, 'It crumbled a little more.']] },
    { id: 'protest', t: 'A crowd gathers in the square demanding change.', ch: [['Listen and compromise', { appr: 5, stab: 2, trait: 'kind' }, 'The crowd went home satisfied, mostly.'], ['Send the guards to disperse them', { appr: -5, stab: 1, trait: 'cruel' }, 'The square was cleared by nightfall.'], ['Crack down without mercy', { appr: -12, stab: 5, rep: -6, trait: 'cruel' }, 'Order returned, at a terrible price.']] },
    { id: 'scandal', t: 'An official under you is caught taking bribes.', ch: [['Expose him publicly', { appr: 4, rep: 3, trait: 'honest' }, 'The people applauded your honesty.'], ['Hush it up', { risk: 0.35 }, 'It went away. For now.'], ['Take a share yourself', { money: 0.6, trait: 'deceitful', risk: 0.4 }, 'A quiet arrangement.']] },
    { id: 'envoy', t: () => `An envoy arrives from ${S.world.name(U.pick(S.world.countriesAt().filter(c => c.id !== S.me().cc && c.region !== 'space')).id)} seeking friendship.`, ch: [['Welcome them warmly', { appr: 2, rel: 12 }, 'Gifts were exchanged. Ties grew warmer.'], ['Snub them', { fame: 2, rel: -12 }, 'They left in a huff.']] },
    { id: 'monument', t: 'Your advisers propose a great monument to your rule.', ch: [['Build it', { fame: 6, appr: -3, stab: -1 }, 'It will stand for centuries, with your name carved on it.'], ['Spend the money on the people', { appr: 6 }, 'The people ate better, and loved you for it.']] },
    { id: 'plot', t: 'Spies report a faction plotting against you.', ch: [['Arrest the plotters', { stab: 3, appr: -4, trait: 'cruel' }, 'Doors were broken down at dawn.'], ['Win them over with favours', { money: -0.5, appr: 3 }, 'Enemies became allies, for a price.'], ['Ignore the rumours', { plot: 1 }, 'You slept soundly. Perhaps too soundly.']] },
    { id: 'reform', t: () => `Reformers ask you to champion ${{ prehistory: 'sharing the herds fairly', ancient: 'freeing debt-slaves', medieval: 'a charter of rights for townsfolk', renaissance: 'schools for the poor', colonial: 'freedom of the press', industrial: "limits on children's working hours", wars: 'votes for women', modern: 'civil rights for all', digital: 'data privacy', near: 'a universal basic income', far: 'rights for synthetic minds' }[S.era().id]}.`, ch: [['Champion the reform', { appr: 4, fame: 4, rep: 4, stab: -1 }, 'History will remember you kindly.'], ['Oppose it', { appr: -2, stab: 1 }, 'The old ways hold, for now.']] },
  ];
  function decision(p) {
    const d = U.pick(DECISIONS), o = p.office;
    const text = typeof d.t === 'function' ? d.t() : d.t;

    const pr = S.prompts[0];

      <div class="labels">${DATA.eras.map((e, i) => [e, i]).filter(([e]) => ['prehistory', 'ancient', 'medieval', 'renaissance', 'industrial', 'modern', 'far'].includes(e.id)).map(([e, i]) => `<span style="left:${(i / DATA.eras.length) * 100}%">${U.fmtYear(e.from).replace('10000 BC', '10k BC')}</span>`).join('')}</div>`;

    const e = S.era(), p = S.me();
    setEraTheme(e);
    $('#when').innerHTML = `<div class="yr">${U.fmtYearAD(w.year)}</div><div class="er">${esc(e.short || e.name)}</div>`;

    $('#btnGod').hidden = !(S.godAllowed && S.godAllowed());
    if (!$('#layout')) {
      $('#screen').innerHTML = `<div class="layout" id="layout"><aside class="side"><div class="card" id="card"></div></aside>
        <section><nav class="tabs" role="tablist" id="tabs"></nav><div id="view"></div></section></div>`;
    }
    $('#card').innerHTML = ui.cardHTML(p);
    $('#tabs').innerHTML = ui.tabList().map(([id, n]) => `<button class="tab" role="tab" data-act="tab" data-tab="${id}" aria-selected="${ui.tab === id}">${n}</button>`).join('');
    renderView();
    const dead = !!w.dead || !S.alive(p);
    $('#agebar').hidden = false;
    $('#ageBtn').disabled = dead;
    $('#ageBtn').innerHTML = `Age +1 <small>→ ${U.fmtYearAD(U.next(w.year))}</small>`;
    pump();
  }
  function renderView() {
    const v = ui.views[ui.tab];
    $('#view').innerHTML = v ? v(S.me()) : '';
    if (ui.tab === 'tree' && ui.afterTree) ui.afterTree();
  }
  const TABS = [['life', 'Life'], ['rel', 'Relationships'], ['act', 'Activities'], ['job', 'Occupation'], ['assets', 'Assets'], ['tree', 'Family Tree'], ['world', 'World']];
  ui.on.tab = el => { ui.tab = el.dataset.tab; render(); $('#tabs [aria-selected="true"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' }); };

  /* ---------------- character card ---------------- */
  function card(p) {
    const e = S.era(), a = S.age(p), tags = [];
    tags.push(`<span class="tag era">${esc(e.name)}</span>`);
    if (p.prison) tags.push(`<span class="tag bad">In prison · ${plural(p.prison, 'year')}</span>`);
    if (p.flags.war) tags.push(`<span class="tag bad">At war</span>`);
    p.sick.forEach(s => tags.push(`<span class="tag bad">${esc(s.n)}</span>`));
    if (p.job) tags.push(`<span class="tag">${esc(p.job.t)}</span>`);
    else if (p.school) tags.push(`<span class="tag">${esc(e.edu.n[p.school.lvl])}</span>`);
    else if (p.retired) tags.push(`<span class="tag">Retired</span>`);
    const sp = S.spouse(p);
    if (sp) tags.push(`<span class="tag">Married to ${esc(sp.first)}</span>`);
    if (p.title) tags.push(`<span class="tag good">${esc(p.title)}</span>`);
    const st = [['Health', p.h], ['Happiness', p.hp], ['Smarts', p.sm], ['Looks', p.lk], ['Reputation', p.rep]];
    return `<div class="who">${av(p, 'lg')}<div class="meta"><h2>${esc(S.fullName(p))}</h2>
      <div class="sub">${p.sex === 'M' ? 'He' : 'She'} · age ${a} · ${span(p)} · ${esc(U.house(S.W.dyn.name))}</div></div></div>
      <div class="tags">${tags.join('')}</div>
      <div class="stats">${st.map(([k, v]) => `<div class="stat"><span class="k">${k}</span>${bar(v)}<span class="v">${Math.round(v)}</span></div>`).join('')}</div>
      <div class="wealth"><span class="eyebrow">Wealth · ${esc(e.cur.n)}</span><span class="v ${p.money < 0 ? 'faint' : ''}">${S.money(p.money)}</span></div>
      ${p.assets.length ? `<div class="faint" style="font-size:12px;text-align:right">Net worth ${S.money(S.netWorth(p))}</div>` : ''}`;
  }

  /* ---------------- Life log ---------------- */
  ui.views.life = p => {
    const groups = [];
    for (const l of p.log) {
      const g = groups[groups.length - 1];
      if (g && g.y === l.y) g.items.push(l); else groups.push({ y: l.y, a: l.a, items: [l] });
    }
    groups.reverse();
    const yd = {}; for (const x of p.yd || []) yd[x.y] = x.d;
    const dc = (d, o) => (d && ui.dchips ? ui.dchips(d, o) : '');
    return `<div class="panel">${groups.slice(0, ui.logLimit || 120).map((g, i) => `<div class="logyr ${i === 0 ? 'now' : ''}"><div class="d"><b>${U.fmtYearAD(g.y)}</b>Age ${g.a}</div>
      <div><ul>${g.items.map(l => `<li class="${l.k}">${ui.linkify ? ui.linkify(l.t, p) : esc(l.t)}${l.d ? ' ' + dc(l.d, { small: 1, max: 5 }) : ''}</li>`).join('')}</ul>${yd[g.y] ? `<div class="ydelta"><span class="faint">The year:</span> ${dc(yd[g.y], { small: 1, max: 8 })}</div>` : ''}</div></div>`).join('') || '<p class="muted">Your story begins.</p>'}${groups.length > (ui.logLimit || 120) ? '<button class="btn sm block" data-act="moreLog" style="margin-top:10px">Show older years</button>' : ''}</div>`;
  };

  /* ---------------- Relationships ---------------- */
  const GROUPS = [
    ['Partner', /^(Husband|Wife|Boyfriend|Girlfriend|Fiancé|Fiancée)$/],
    ['Parents & grandparents', /^(Father|Mother|Grand(father|mother)|Great-grand(father|mother))$/],
    ['Siblings', /Brother|Sister/],
    ['Children & grandchildren', /^(Son|Daughter|Grand(son|daughter)|Great-grand(son|daughter))$/],
    ['Extended family', /Uncle|Aunt|Cousin|Nephew|Niece|in-law/],
    ['Friends & others', /./],
  ];
  function relRow(p, o) {
    const r = p.rels[o.id], lab = S.relLabel(p, o);
    const sub = S.alive(o) ? `${lab} · ${S.age(o)}${o.job ? ' · ' + o.job.t : ''}` : `${lab} · † ${U.fmtYear(o.died)}, ${o.cause}`;
    return `<button class="row" data-act="person" data-id="${o.id}">${ui.av(o, 'sm')}<div class="main"><div class="t">${esc(S.fullName(o))}</div><div class="s">${esc(sub)}</div></div>
      ${S.alive(o) && r ? `<div class="end"><div class="mini" title="Closeness ${Math.round(r.c)}">${bar(r.c, 'era')}</div></div>` : ''}</button>`;
  }
  ui.views.rel = p => {
    const all = S.known(p), live = all.filter(S.alive), dead = all.filter(o => !S.alive(o));
    const used = new Set(), out = [];
    for (const [name, rx] of GROUPS) {
      const g = live.filter(o => !used.has(o.id) && rx.test(S.relLabel(p, o))).sort((a, b) => a.born - b.born);
      g.forEach(o => used.add(o.id));
      if (g.length) out.push(`<div class="sec-h"><h3>${name}</h3><span class="faint">${g.length}</span></div><div class="list">${g.map(o => relRow(p, o)).join('')}</div>`);
    }
    return `<div class="btnrow" style="margin-bottom:6px">
        <button class="btn sm" data-act="activity" data-id="u:friend">${esc(S.era().L.friend)}</button>
        <button class="btn sm" data-act="activity" data-id="u:love">${esc(S.era().L.love)}</button></div>
      ${out.join('') || '<p class="muted">You know no one yet.</p>'}
      ${dead.length ? `<details style="margin-top:16px"><summary class="sec-h" style="cursor:pointer"><h3 style="display:inline">In memory</h3> <span class="faint">${dead.length}</span></summary><div class="list">${dead.sort((a, b) => b.died - a.died).map(o => relRow(p, o)).join('')}</div></details>` : ''}`;
  };

  // Bio sheet for anyone: family member, friend, or a stranger in the tree
  function person(id, res) {
    const p = S.me(), o = S.P(id);
    if (!o) return;
    const self = o.id === p.id, liv = S.alive(o), e = S.era();
    const lab = self ? 'You' : S.relLabel(p, o);
    const r = p.rels[o.id], sp = S.spouse(o);
    const kv = [
      ['Born', `${U.fmtYearAD(o.born)} · ${S.eraOf(o.born).name}`],
      liv ? ['Age', S.age(o)] : ['Died', `${U.fmtYearAD(o.died)}, age ${S.age(o)}, of ${o.cause}`],
      ['Occupation', o.job ? `${o.job.t}${o.job.rank ? ` (${S.rankName(o.job.rank)})` : ''}` : o.retired ? 'Retired' : o.lastJob ? `Formerly ${o.lastJob}` : '—'],
      ['Education', e.edu.n[o.edu]],
      ['Spouse', sp ? S.fullName(sp) : o.exes.length ? 'Divorced or widowed' : '—'],
      ['Children', o.kids.length],
      ['Wealth', S.money(S.netWorth(o))],
    ];
    if (o.played) kv.push(['Dynasty', 'Played by you']);
    const acts = !self && liv ? S.actionsFor(p, o) : [];
    sheet(`<div class="who">${av(o, 'lg')}<div class="meta"><div class="eyebrow">${esc(lab)}</div><h2>${esc(S.fullName(o))}</h2><div class="sub">${span(o)}</div></div></div>
      ${liv ? `<div class="stats">${[['Health', o.h], ['Happiness', o.hp], ['Smarts', o.sm], ['Looks', o.lk]].map(([k, v]) => `<div class="stat"><span class="k">${k}</span>${bar(v)}<span class="v">${Math.round(v)}</span></div>`).join('')}
        ${r && !self ? `<div class="stat"><span class="k">Closeness</span>${bar(r.c, 'era')}<span class="v">${Math.round(r.c)}</span></div>` : ''}</div>` : ''}
      <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${res ? `<div class="result" role="status">${esc(res)}</div>` : ''}
      ${acts.length ? `<div class="acts" style="margin-top:14px">${acts.map(a => ui.interactBtn(o, a)).join('')}</div>` : ''}
      ${!self && liv && S.alive(p) ? `<button class="btn era block" style="margin-top:10px" data-act="become" data-id="${o.id}">Become ${esc(o.first)}</button>
        <p class="faint" style="font-size:12px;margin:8px 0 0">${esc(p.first)} keeps living in the world as an ordinary person.</p>` : ''}`, { label: S.fullName(o) });
  }
  // A button for something to do with a person; once-a-year actions already used up are greyed out and say so
  ui.interactBtn = (o, a) => a.done
    ? `<button class="btn used" disabled title="${a.done === 'auto' ? 'Auto-play did this for you this year' : 'You did this this year'}">${esc(a.l)}<span class="note">${a.done === 'auto' ? 'Done by auto-play this year' : 'Done this year'}</span></button>`
    : `<button class="btn" data-act="interact" data-id="${o.id}" data-a="${a.id}">${esc(a.l)}</button>`;
  ui.on.person = el => ui.person(+el.dataset.id);
  ui.on.interact = el => {
    const t = S.interact(+el.dataset.id, el.dataset.a);
    S.settle();
    ui.open = null; render();
    if (S.W.dead) return;
    ui.person(+el.dataset.id, t);
  };
  ui.on.become = el => {
    const o = S.P(+el.dataset.id);
    ui.open = { locked: false };
    sheet(`<h2>Become ${esc(o.first)}?</h2><div class="body">You will continue the story as ${esc(S.fullName(o))}, age ${S.age(o)}. ${esc(S.me().first)} stays in the world and keeps living on their own.</div>
      <div class="acts"><button class="btn era" data-act="becomeYes" data-id="${o.id}">Become ${esc(o.first)}</button><button class="btn" data-act="close">Not now</button></div>`);
  };
  ui.on.becomeYes = el => { S.become(+el.dataset.id); ui.open = null; $('#modal').innerHTML = ''; ui.tab = 'life'; render(); ui.save(); toast(`You are now ${S.fullName(S.me())}.`); };

  /* ---------------- Activities ---------------- */
  ui.views.act = p => {
    const acts = S.activities(p);
    const row = a => {
      const why = a.jailed ? 'Not from prison' : a.young ? `Age ${a.min}+` : a.done ? 'Done this year' : a.broke ? 'Cannot afford' : '';
      return `<button class="row ${why ? 'off' : ''}" data-act="activity" data-id="${a.id}" ${why ? 'disabled' : ''}>
        <div class="main"><div class="t">${esc(a.n)}</div><div class="s">${esc(a.d || '')}</div>${a.src.fx && ui.fxPills ? `<div class="dchips small preview">${ui.fxPills(a.src.fx)}${a.src.risk ? `<span class="dodds alt">${Math.round(a.src.risk.p * 100)}% risk</span>` : ''}</div>` : ''}</div>
        <div class="end">${why ? `<span class="why">${why}</span>` : a.cost ? `<span class="mono">${S.money(a.cost)}</span>` : '<span class="faint">Free</span>'}</div></button>`;
    };
    const eraActs = acts.filter(a => a.era), common = acts.filter(a => !a.era);
    return `<div class="sec-h"><h3>Of the ${esc(S.era().name)} era</h3></div><div class="list">${eraActs.map(row).join('') || '<div class="row muted">Nothing special this year.</div>'}</div>
      <div class="sec-h"><h3>Everyday life</h3></div><div class="list">${common.map(row).join('')}</div>`;
  };
  ui.on.activity = el => {
    const t = S.doActivity(el.dataset.id);
    S.settle(); render(); toast(t);
  };

  Object.assign(ui, { $, esc, av, bar, span, an, plural, toast, sheet, closeSheet, pump, render, renderView, person, eraCol, bornCol, isDark, ribbon, setEraTheme, cardHTML: card, tabList: () => TABS, TABS });
  return ui;
})();

(() => {

  const rangeOf = e => [e.from, e.id === 'far' ? 2400 : e.to];

  /* ---------------- storage (wrapped: storage may be unavailable) ---------------- */
  const store = {
    get(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
  };
  ui.store = store;
  ui.save = () => { if (S.W) store.set(KEY, S.serialize()); };
  const meta = w => { const p = w.people[w.playerId]; return `${U.house(w.dyn.name)} · ${U.fmtYearAD(w.year)} · ${p ? `${p.first} ${p.last}` : ''}`; };

          <button class="btn sm ${o.why.length ? '' : 'era'}" data-act="enroll" data-lvl="${o.lvl}" ${o.why.length ? 'disabled' : ''}>Enrol</button></div>`).join('')}</div>`

          <div class="fact"><div class="eyebrow">Currency</div><div class="v">${esc(e.cur.s)} ${esc(e.cur.n)}</div></div>
          <div class="fact"><div class="eyebrow">Life expectancy</div><div class="v">~${le} yrs</div></div>

        <div class="cause">Died of ${esc(d.cause)} at the age of ${d.age}, in the ${esc(d.era)} era.</div></div>
      <dl class="kv"><dt>Occupation</dt><dd>${esc(d.job || 'None')}</dd><dt>Net worth</dt><dd>${esc(d.netTxt)}</dd><dt>Children</dt><dd>${d.kids}</dd>
        <dt>Life score</dt><dd>${U.fmtNum(d.score)}</dd><dt>Dynasty score</dt><dd>${U.fmtNum(w.dyn.score)} over ${plural(w.dyn.lives.length, 'life')}</dd></dl>
      ${ach.length ? `<div class="tags" style="margin-bottom:14px">${ach.map(a => `<span class="tag good" title="${esc(a.d)}">${esc(a.n)}</span>`).join('')}</div>` : ''}
      ${heirs.length ? `<div class="eyebrow">Continue the story as</div><p class="faint" style="font-size:13px;margin:4px 0 10px">${esc(typeof Legacy !== 'undefined' ? (p.will ? 'Your will decides how the money and heirlooms are shared; your chosen heir takes the rest and any title.' : `${Legacy.LAWTXT[Legacy.lawOf(p.cc)]}. Your chosen heir takes any title.`) : 'Your chosen heir receives half your money, all your property and any title.')}</p>
        <div class="list">${heirs.map(({ o, rel }) => `<button class="row" data-act="heir" data-id="${o.id}">${ui.av(o, 'sm')}<div class="main"><div class="t">${esc(S.fullName(o))}</div><div class="s">${esc(rel)} · age ${S.age(o)}${o.job ? ' · ' + esc(o.job.t) : ''}</div></div></button>`).join('')}</div>`
        : `<div class="result">No one you knew is still alive. Your line has ended.</div>`}
      <div class="btnrow" style="margin-top:14px"><button class="btn sm" data-act="newHouse">Begin a new house in this world</button><button class="btn sm" data-act="newGame">Start over</button></div>`, { locked: true, label: 'Death' });

  /* ---------------- menu, saves, export / import ---------------- */
  ui.on.menu = () => {

  ui.on.export = () => {

  ui.on.dlExp = () => {
    try {
      const b = new Blob([S.serialize()], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = `tempora-${U.slug(S.W.dyn.name)}-${S.W.year}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch { toast('Download blocked here. Use Copy instead.'); }

/* ---- ui3.js ---- */
/* =====================================================================
   UI, part 3 — portraits, character card, stat & class sheets, bios with
   appearance and genetics, Life story view, relationships with pets and
   bulk actions.
   ===================================================================== */

(() => {
  const S = Sim, ui = UI, { $, esc, bar, span, plural, toast, sheet, render } = ui;
  const idR = (id, s) => { const x = Math.sin(id * 12.9898 + s * 78.233) * 43758.5453; return x - Math.floor(x); };
  const initialsAv = ui.av;

  /* ---------------- portraits ---------------- */
  function portrait(p, cls = '') {
    const ph = S.pheno ? S.pheno(p) : null;
    if (!ph) return initialsAv(p, cls);
    const a = S.age(p), F = p.sex === 'F', ring = ui.bornCol(p);
    const baby = a < 3, kid = a < 13;
    const r = baby ? 8.5 : kid ? 9.5 : 10.5, cy = baby ? 25 : 22.5;
    const skin = ph.skin.hex, hair = ph.hair.hex, eye = ph.eyes.hex, curl = ph.hair.curl;
    const L = 24 - r, R = 24 + r;
    let back = '', top = '', extra = '';
    if (!baby && curl >= 4) back = `<circle cx="24" cy="${cy - 1.5}" r="${r + 5.5}" fill="${hair}"/>`;
    else if (!baby && F && a >= 4) back = `<path d="M${L - 2} ${cy} Q${L - 4} ${cy + 15} ${L + 1} ${cy + 18} L${R - 1} ${cy + 18} Q${R + 4} ${cy + 15} ${R + 2} ${cy} Z" fill="${hair}"/>`;
    const bald = !F && a > 50 && idR(p.id, 3) < 0.4;
    if (baby) top = `<path d="M22 ${cy - r + 1} q2 -3 4 0" stroke="${hair}" stroke-width="1.6" fill="none"/>`;
    else if (curl === 3) top = [-7, -3.5, 0, 3.5, 7].map((dx, i) => `<circle cx="${24 + dx}" cy="${cy - r + 1.5 + (i % 2)}" r="3.4" fill="${hair}"/>`).join('');
    else if (curl < 4) top = bald
      ? `<path d="M${L} ${cy} Q${L} ${cy - 5} ${L + 3} ${cy - 6} L${L + 3} ${cy} Z M${R} ${cy} Q${R} ${cy - 5} ${R - 3} ${cy - 6} L${R - 3} ${cy} Z" fill="${hair}"/>`
      : `<path d="M${L} ${cy + 1} Q${L - 0.5} ${cy - r - 3} 24 ${cy - r - 2.5} Q${R + 0.5} ${cy - r - 3} ${R} ${cy + 1} Q${R - 2} ${cy - r + 3} ${24 + (curl ? 2 : 0)} ${cy - r + 3.5} Q${L + 2} ${cy - r + 3} ${L} ${cy + 1} Z" fill="${hair}"/>`;
    if (!F && a >= 20 && idR(p.id, 5) < 0.32) extra += `<path d="M${L + 1.5} ${cy + 2} Q24 ${cy + r + 5.5} ${R - 1.5} ${cy + 2} Q24 ${cy + r + 1.5} ${L + 1.5} ${cy + 2} Z" fill="${hair}" opacity=".92"/>`;
    const glasses = a >= 8 && p.g && p.g.myo[0] && p.g.myo[1] && S.W.year >= 1290;
    if (glasses) extra += `<circle cx="20.3" cy="${cy + 0.4}" r="2.6" fill="none" stroke="#2a2a2a" stroke-width=".8"/><circle cx="27.7" cy="${cy + 0.4}" r="2.6" fill="none" stroke="#2a2a2a" stroke-width=".8"/><path d="M22.9 ${cy + 0.2} h2.2" stroke="#2a2a2a" stroke-width=".8"/>`;
    const brows = a >= 10 ? `<path d="M18.6 ${cy - 2.6} h3.4 M26 ${cy - 2.6} h3.4" stroke="${hair}" stroke-width="1" stroke-linecap="round"/>` : '';
    const mouth = S.alive(p) && (p.hp ?? 50) >= 40 ? `<path d="M21.8 ${cy + 4.6} Q24 ${cy + 6.4} 26.2 ${cy + 4.6}" stroke="#7a3f2c" stroke-width=".9" fill="none" stroke-linecap="round"/>` : `<path d="M22 ${cy + 5.4} h4" stroke="#7a3f2c" stroke-width=".9" stroke-linecap="round"/>`;
    const svg = `<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" style="fill:var(--surface)"/><rect width="48" height="48" fill="${ring}" opacity=".2"/>
      ${back}<path d="M6 50 Q9 ${cy + 13} 24 ${cy + 12.5} Q39 ${cy + 13} 42 50 Z" fill="${ring}"/><rect x="21.3" y="${cy + 7}" width="5.4" height="6" fill="${skin}"/>
      <ellipse cx="24" cy="${cy}" rx="${r - 0.4}" ry="${r + 0.8}" fill="${skin}"/>${top}${brows}
      <circle cx="20.4" cy="${cy + 0.5}" r="${baby ? 0.9 : 1.25}" fill="${eye}"/><circle cx="27.6" cy="${cy + 0.5}" r="${baby ? 0.9 : 1.25}" fill="${eye}"/>${mouth}${extra}
      <circle cx="24" cy="24" r="23" fill="none" stroke="${ring}" stroke-width="2"/></svg>`;
    return `<span class="av pt ${cls}${S.alive(p) ? '' : ' dead'}" title="${esc(`${ph.skin.n} skin, ${ph.hair.n} ${ph.hair.type} hair, ${ph.eyes.n} eyes`)}">${svg}</span>`;
  }
  ui.av = portrait;

  /* ---------------- character card ---------------- */
  const statRow = (p, s) => `<button class="stat srow" data-act="stat" data-k="${s.k}" aria-label="${s.n}: ${Math.round(p[s.k] ?? 0)}, ${esc(DATA.statTier(s.k, p[s.k] ?? 0).name)}"><span class="k">${s.n}</span>${bar(p[s.k] ?? 0)}<span class="v">${Math.round(p[s.k] ?? 0)}</span></button>`;
  ui.cardHTML = p => {
    const e = S.era(), a = S.age(p), tags = [];

  ui.person = (id, res) => {

      ['Education', e.edu.n[o.edu]], ['Spouse', sp ? S.fullName(sp) : o.exes.length ? 'Divorced or widowed' : '—'],
      ['Children', o.kids.length], ['Wealth', S.money(S.netWorth(o))],

      ${ph.conds.length ? `<div class="tags">${ph.conds.map(([c, k]) => `<span class="tag ${k === 'bad' ? 'bad' : k === 'good' ? 'good' : ''}">${esc(c)}</span>`).join('')}</div>` : ''}` : '';
    sheet(`<div class="who">${portrait(o, 'lg')}<div class="meta"><div class="eyebrow">${esc(lab)}</div><h2>${esc(S.fullName(o))}</h2><div class="sub">${span(o)}</div></div></div>
      ${liv ? `<div class="stats">${DATA.stats.filter(s => s.main || ['mh', 'fm'].includes(s.k)).filter(s => s.k !== 'rep').map(s => `<div class="stat"><span class="k">${s.n}</span>${bar(o[s.k] ?? 0)}<span class="v">${Math.round(o[s.k] ?? 0)}</span></div>`).join('')}

    return toggle + `<div class="panel story">${chs.map(c => `<section><h3>Chapter ${c.n} · ${esc(c.title)}</h3>${c.intro ? `<p class="intro">${esc(c.intro)}</p>` : ''}

    const bulk = `<div class="panel bulk"><div class="eyebrow">Everyone at once · ${live.length} people</div><div class="btnrow" style="margin-top:8px">

    return bulk + relView(p) + petBlock;
  };
  ui.on.bulk = el => {
    const p = S.me(), e = S.era(), act = el.dataset.a;
    let people = S.known(p).filter(S.alive);
    if (el.dataset.g === 'family') people = people.filter(o => p.rels[o.id]?.k === 'fam' || /Father|Mother|Brother|Sister|Son|Daughter|Grand|Husband|Wife/.test(S.relLabel(p, o)));
    if (act === 'party') {
      if (p.did.party) return toast('You already hosted a gathering this year.');
      const c = S.toVal(e.cost * 0.05); if (p.money < c) return toast(`A gathering costs ${S.money(c)}.`);
      p.did.party = 1; p.money -= c;
      people.forEach(o => { S.rel(p, o).c = U.clamp(S.rel(p, o).c + U.ri(2, 8)); });
      S.applyFx(p, { hp: 6, rep: 2, fm: 1 }); S.log(p, `You threw a gathering for ${people.length} people. The house was full of noise.`, 'good');
      render(); return toast('What a gathering!');
    }
    if (act === 'gift') {
      const each = S.toVal(e.cost * 0.03), tot = each * people.length;
      if (p.money < tot) return toast(`Gifts for everyone would cost ${S.money(tot)}.`);
    }
    let n = 0;
    for (const o of people) { const t = S.interact(o.id, act); if (t && !/already|cannot|gone/i.test(t)) n++; }

      ${pet.tricks ? `<p class="lede">Knows ${plural(pet.tricks, 'trick')}.</p>` : ''}${res ? `<div class="result">${esc(res)}</div>` : ''}
      <div class="acts" style="margin-top:12px">${acts.map(a => `<button class="btn ${a === 'rehome' ? 'danger' : ''}" data-act="petAct" data-id="${id}" data-a="${a}">${L[a]}</button>`).join('')}</div>`, { label: pet.n });
  }
  ui.on.pet = el => petSheet(+el.dataset.id);
  ui.on.petAct = el => { const t = S.petAct(+el.dataset.id, el.dataset.a); ui.open = null; render(); if (el.dataset.a === 'rehome') { $('#modal').innerHTML = ''; toast(t); } else petSheet(+el.dataset.id, t); };

  Object.assign(ui, { portrait });
})();

/* =====================================================================

(() => {
  const S = Sim, ui = UI, { $, esc, bar, plural, toast, sheet, render } = ui;
  const pct = v => `${Math.round(v * 100)}%`;
  const START_YEAR = { prehistory: -8000, ancient: -450, medieval: 1300, renaissance: 1480, colonial: 1720, industrial: 1840, wars: 1912, modern: 1950, digital: 2000, near: 2040, far: 2160 };
  const rangeOf = e => [e.from, e.id === 'far' ? 2400 : e.to];
  const MODES = [
    ['narrative', 'Narrative', 'A story told in chapters. Choices pop up as your life unfolds, and your life reads back as prose.'],
    ['household', 'Household', 'Run the whole home: plan each family member’s year and manage the shared budget.'],
    ['god', 'God', 'Everything unlocked: edit any stat, person, gene, class or year. Keeps the Narrative and Household features.'],
  ];

  /* ---------------- tabs ---------------- */
  ui.tabList = () => {
    const m = S.W?.mode;
    const t = [['life', 'Life'], ['rel', 'Relationships'], ['act', 'Activities'], ['places', 'Places'], ['job', 'Occupation'], ['assets', 'Assets']];
    if (m === 'household' || m === 'god') t.push(['home', 'Household']);
    t.push(['tree', 'Family Tree'], ['world', 'World'], ['community', 'Community']);
    return t;
  };

  /* ---------------- start screen ---------------- */
  const pick = { era: 'medieval', year: START_YEAR.medieval, cc: '', mode: 'narrative', godOn: false };
  const keepFields = () => ['f-first', 'f-last', 'f-sex', 'f-orient', 'f-cls'].map(id => [id, $('#' + id)?.value]);

  ui.start = () => {
    const e = pick.era === 'random' ? null : DATA.eras.find(x => x.id === pick.era);

    $('#when').innerHTML = ''; $('#agebar').hidden = true; $('#btnGod').hidden = true;
    const auto = ui.store.get('tempora.autosave');
    const [lo, hi] = e ? rangeOf(e) : [0, 0];

    $('#screen').innerHTML = `<div class="start">
      <div class="hero"><div class="eyebrow">A life simulator across twelve thousand years</div><h2>Every life is a chapter.<br>Every family, a history.</h2>

      ${auto ? `<div class="panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><div class="eyebrow">Saved dynasty</div><div style="font-family:var(--f-display);font-size:20px">${esc(U.house(auto.dyn?.name || ''))} · ${U.fmtYearAD(auto.year)}</div></div><button class="btn era" data-act="continue">Continue</button></div>` : ''}
      <div class="sec-h"><h3>How do you want to play?</h3></div>
      <div class="modes">${MODES.map(([id, n, d]) => `<button class="modecard" data-act="pickMode" data-m="${id}" aria-pressed="${pick.mode === id}"><div class="n">${n}</div><div class="d">${esc(d)}</div></button>`).join('')}</div>
      ${pick.mode !== 'god' ? `<label class="check"><input type="checkbox" id="f-god" ${pick.godOn ? 'checked' : ''} data-input="godOn"> Also allow god tools (off by default)</label>` : ''}
      <div class="sec-h"><h3>Choose when to be born</h3></div>
      <div class="eras">${DATA.eras.map(x => `<button class="eracard" style="--c:${ui.eraCol(x)}" data-act="pickEra" data-id="${x.id}" aria-pressed="${pick.era === x.id}"><div class="n">${esc(x.name)}</div><div class="r">${U.fmtYear(x.from)}${x.to > 9000 ? '+' : `–${U.fmtYear(x.to)}`}</div></button>`).join('')}
        <button class="eracard" style="--c:var(--ink-3)" data-act="pickEra" data-id="random" aria-pressed="${pick.era === 'random'}"><div class="n">Random</div><div class="r">any year, any land</div></button></div>
      ${e ? `<div class="panel"><div class="form">

        : '<div class="panel"><p class="lede" style="margin:0">Fate will choose the era, the year and the land.</p></div>'}
      <div class="panel"><div class="form">
        <div class="field"><label for="f-first">First name</label><input id="f-first" placeholder="Random" maxlength="24" autocomplete="off"></div>
        <div class="field"><label for="f-last">Family name</label><input id="f-last" placeholder="Random" maxlength="24" autocomplete="off"></div>
        <div class="field"><label for="f-sex">Born as</label><select id="f-sex"><option value="">Random</option><option value="F">A girl</option><option value="M">A boy</option></select></div>
        <div class="field"><label for="f-orient">Attracted to</label><select id="f-orient"><option value="straight">The opposite sex</option><option value="gay">The same sex</option><option value="bi">Anyone</option></select></div>
        <div class="field"><label for="f-cls">Family fortune</label><select id="f-cls"><option value="">Random</option>${S.CLASSES.map(c => `<option value="${c.id}">${c.id[0].toUpperCase() + c.id.slice(1)}</option>`).join('')}</select></div>

  };
  // country names at an arbitrary year, before any world exists
  function S_name(cc, y) { const c = DATA.countries.find(x => x.id === cc); for (const x of c.names) if (y <= x[0]) return x[1]; return c.names[c.names.length - 1][1]; }

  ui.input.cc = el => { pick.cc = el.value; };

/* ---- delta.js ---- */
/* =====================================================================
   CHANGE INDICATORS — every click, choice and year is measured: stats,
   money and closeness are snapshotted before and diffed after. Changes
   show as chips in a floating bar, as badges on the character card, on
   each life-log entry, under each year, and as previews on choices and
   activities before you pick them.
   ===================================================================== */

const Delta = (() => {
  const S = Sim, ui = UI, { $, esc } = ui;
  const LAB = { h: 'Health', hp: 'Happiness', sm: 'Smarts', lk: 'Looks', rep: 'Reputation', mh: 'Mind', fe: 'Fertility', im: 'Imagination', wp: 'Willpower', fm: 'Fame' };
  const ORDER = ['h', 'hp', 'sm', 'lk', 'rep', 'mh', 'im', 'wp', 'fm', 'fe'];
  const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '±');
  const num = v => `${sign(v)}${Math.abs(v)}`;

  // chips for a change record from Sim.diff
  function chips(d, o = {}) {
    if (!d) return '';
    const out = [];
    for (const k of ORDER) if (d[k]) out.push(`<span class="dchip ${d[k] > 0 ? 'up' : 'down'}${k === 'fe' ? ' minor' : ''}">${num(d[k])} ${LAB[k]}</span>`);
    if (d.$) out.push(`<span class="dchip ${d.$ > 0 ? 'up' : 'down'} money">${d.$ > 0 ? '+' : '−'}${esc(S.money(Math.abs(d.$)))}</span>`);
    for (const [id, v] of d.rel || []) {
      const q = S.P(id); if (!q) continue;
      out.push(v === 'new' ? `<span class="dchip up rel">New: ${esc(q.first)}</span>` : `<span class="dchip ${v > 0 ? 'up' : 'down'} rel">${esc(q.first)} ${num(v)}</span>`);
    }
    for (const [k, v] of Object.entries(d.x || {})) out.push(`<span class="dchip ${v > 0 ? 'up' : 'down'}">${num(v)} ${esc(k)}</span>`);
    const max = o.max || 9;
    const shown = out.slice(0, max).join('') + (out.length > max ? `<span class="dchip more">+${out.length - max}</span>` : '');
    return shown ? `<span class="dchips${o.small ? ' small' : ''}">${shown}</span>` : '';
  }

  // what an fx object is likely to do, before it happens
  function fxText(fx, e = S.era()) {
    if (!fx) return [];
    const out = [];
    const rng = v => (Array.isArray(v) ? (v[0] === v[1] ? num(v[0]) : `${sign(v[0] + v[1])}${Math.min(Math.abs(v[0]), Math.abs(v[1]))}–${Math.max(Math.abs(v[0]), Math.abs(v[1]))}`) : num(v));

      <div class="hhgrid">${m.map(o => `<button class="panel member" data-act="member" data-id="${o.id}">${ui.av(o, 'lg')}<div class="main"><div class="t">${esc(S.fullName(o))}</div><div class="s">${esc(H.roleOf(p, o))} · ${S.age(o)}${o.job ? ' · ' + esc(o.job.t) : o.school ? ' · at school' : ''}</div>
        <div class="minis">${[['Health', o.h], ['Happy', o.hp], ['Smarts', o.sm]].map(([k, v]) => `<div class="stat"><span class="k">${k}</span>${bar(v)}<span class="v">${Math.round(v)}</span></div>`).join('')}</div>
        ${o.sick.length ? `<div class="tags">${o.sick.map(s => `<span class="tag bad">${esc(s.n)}</span>`).join('')}</div>` : ''}</div></button>`).join('')}</div>`;
